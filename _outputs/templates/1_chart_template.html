<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Visualizer</title>

  <!-- TradingView Lightweight Charts (MIT) -->
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: light dark;
      --bg:        #000000;
      --fg:        #ffffff;
      --txt:       #ffffff;
      --txt-dim:   #8b949e;
      --green:     #3fb950;
      --red:       #f85149;
      --yellow:    #d29922;
      --radius:    6px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg:      #ffffff;
        --fg:      #000000;
        --txt:     #000000;
      }
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--txt);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      overflow: hidden;
    }

    /* ── Layout ───────────────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Top bar ──────────────────────────────────────────────────────────── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--fg);
      flex-shrink: 0;
      flex-wrap: wrap;
      overflow: hidden;
    }


    /* ── Price panel ──────────────────────────────────────────────────────── */
    #price-panel {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      overflow: hidden;
    }
    #ticker-label   { font-size: 32px; font-weight: 700; color: CanvasText; }
    #company-label  { font-size: 24px; color: var(--txt-dim); max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #price-label    { font-size: 40px; font-weight: 700; }
    #change-label   { font-size: 26px; font-weight: 600; }

    /* ── Market status badge ──────────────────────────────────────────────── */
    #status-badge {
      font-size: 22px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid;
      letter-spacing: .5px;
    }
    #status-badge.open   { color: var(--green); border-color: var(--green); background: #3fb95015; }
    #status-badge.closed { color: var(--txt-dim); border-color: var(--fg); background: transparent; }

    /* ── Chart area ───────────────────────────────────────────────────────── */
    #chart-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    #chart { width: 100%; height: 100%; }

    /* ── Volume sub-chart ─────────────────────────────────────────────────── */
    /* Volume is rendered on a separate pane inside the same chart container */

    /* ── Footer ───────────────────────────────────────────────────────────── */
    #footer {
      background: var(--bg);
      border-top: 1px solid var(--fg);
      padding: 4px 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11px;
      color: var(--txt-dim);
      flex-shrink: 0;
    }
    #footer span { display: flex; align-items: center; gap: 4px; }
    #live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.5s infinite;
    }
    #live-dot.off { background: var(--txt-dim); animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    /* ── Loading overlay ──────────────────────────────────────────────────── */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 10;
      font-size: 15px;
      color: var(--txt-dim);
      gap: 10px;
    }
    #loading.hidden { display: none; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--fg);
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error toast ──────────────────────────────────────────────────────── */
    #error-toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: #5a0000;
      border: 1px solid var(--red);
      border-radius: var(--radius);
      color: var(--red);
      padding: 8px 18px;
      font-size: 13px;
      z-index: 999;
      display: none;
    }
    #error-toast.show { display: block; }

    /* ── OHLCV tooltip ────────────────────────────────────────────────────── */
    #ohlcv-tooltip {
      position: absolute;
      top: 10px;
      left: 10px;
      background: transparent;
      border: 1px solid var(--fg);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-size: 11px;
      pointer-events: none;
      display: none;
      flex-direction: column;
      gap: 3px;
      max-width: 380px;
    }
    #ohlcv-tooltip.visible { display: flex; }
    .ot-time { color: var(--txt); font-weight: 600; }
    .ot-pv   {
      display: flex;
      gap: 14px;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 0;
      border-top: 1px solid var(--txt-dim);
      border-bottom: 1px solid var(--txt-dim);
    }
    .ot-row  { display: flex; gap: 8px; flex-wrap: wrap; }
    .ov { color: var(--txt-dim); margin-right: 2px; }
    .oval { color: var(--txt); }

    /* ── Cursor-linked price/volume label (attached to time-axis) ─────────── */
    #cursor-pv-label {
      position: absolute;
      left: 0;
      top: 0;
      transform: translateY(-100%);
      background: var(--bg);
      color: var(--txt);
      border: 1px solid #58a6ff;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 3px;
      pointer-events: none;
      display: none;
      z-index: 6;
      white-space: nowrap;
    }
    #cursor-pv-label.visible { display: block; }
    #cursor-pv-label .cpv-sep { color: var(--txt-dim); margin: 0 6px; }
    #cursor-pv-label .cpv-lab { color: var(--txt-dim); margin-right: 3px; font-weight: 600; }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Top bar ──────────────────────────────────────────────────────────── -->
  <div id="topbar">
    <div id="price-panel">
      <span id="ticker-label">—</span>
      <span id="company-label"></span>
      <span id="price-label">—</span>
      <span id="change-label"></span>
      <span id="status-badge" class="closed">CLOSED</span>
    </div>
  </div>

  <!-- ── Chart + overlays ─────────────────────────────────────────────────── -->
  <div id="chart-wrap">
    <div id="chart"></div>
    <div id="loading"><div class="spinner"></div> Loading data…</div>
    <div id="ohlcv-tooltip"></div>
    <div id="cursor-pv-label"></div>
  </div>

  <!-- ── Footer ───────────────────────────────────────────────────────────── -->
  <div id="footer">
    <span><div id="live-dot" class="off"></div> <span id="live-label">Live updates off</span></span>
    <span>Updated: <span id="updated-label">—</span></span>
    <span>Interval: <span id="interval-label">—</span></span>
    <span id="clock-label" title="Internet-calibrated Eastern Time + clock offset">ET — (syncing…)</span>
    <span>Source: Yahoo Finance</span>
  </div>
</div>

<div id="error-toast"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════════════════════════════════
const PERIODS = ["1d","5d","1mo","3mo","6mo","1y","2y","5y","max"];
const REFRESH_MS      = 6000;    // live poll interval (ms)
const CLOCK_RESYNC_MS = 1800000; // re-fetch /api/time_info every 30 min

let state = {
  ticker:    "",
  period:    "1d",
  liveTimer: null,
  // Populated after first chart load from exchange_schedule in API response.
  // Shape: { code, name, tz, open:[h,m], close:[h,m], break_start, break_end, approximate }
  exchange:  null,
};

// ── Internet clock calibration ────────────────────────────────────────────────
// clockOffsetMs = internet_utc_ms − Date.now()
// Add this to Date.now() whenever you need an internet-accurate UTC timestamp.
let clockOffsetMs  = 0;
let clockSyncSource = "not yet synced";

async function syncClock() {
  try {
    const t0  = Date.now();
    // Include ticker so the server can return the correct exchange schedule
    const url = state.ticker ? `/api/time_info?ticker=${encodeURIComponent(state.ticker)}` : "/api/time_info";
    const res  = await fetch(url);
    const t1  = Date.now();
    const info = await res.json();
    // Compensate for half the fetch round-trip to centre on the server timestamp
    const rttHalf   = (t1 - t0) / 2;
    clockOffsetMs   = info.offset_ms - rttHalf;
    clockSyncSource = info.sync_source || "server";
    // Adopt exchange schedule from the time_info response if not yet set
    // (will be overwritten by renderChart on first data load anyway)
    if (!state.exchange && info.exchange_schedule) {
      state.exchange = info.exchange_schedule;
    }
    updateClockLabel();
  } catch (_) {
    clockSyncSource = "sync failed — using last offset";
    updateClockLabel();
  }
}

function internetNow() {
  return new Date(Date.now() + clockOffsetMs);
}

/**
 * Market-open check using the exchange schedule stored in state.exchange.
 * Uses Intl.DateTimeFormat with the exchange's own IANA timezone — handles
 * DST automatically for every market, no library needed.
 * Falls back to NYSE hours if state.exchange is not yet populated.
 */
function isMarketOpenNow() {
  const exch = state.exchange || { tz:"America/New_York", open:[9,30], close:[16,0] };
  const now   = internetNow();

  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: exch.tz,
    weekday:  "short",
    hour:     "numeric",
    minute:   "numeric",
    hour12:   false,
  }).formatToParts(now);

  const get     = type => parts.find(p => p.type === type)?.value ?? "";
  const weekday = get("weekday");
  if (weekday === "Sat" || weekday === "Sun") return false;

  const h        = parseInt(get("hour"),   10);
  const m        = parseInt(get("minute"), 10);
  const totalMin = h * 60 + m;
  const openMin  = exch.open[0]  * 60 + exch.open[1];
  const closeMin = exch.close[0] * 60 + exch.close[1];
  if (totalMin < openMin || totalMin >= closeMin) return false;

  // Midday break (JP, HK, CN, SG …)
  if (exch.break_start && exch.break_end) {
    const bsMin = exch.break_start[0] * 60 + exch.break_start[1];
    const beMin = exch.break_end[0]   * 60 + exch.break_end[1];
    if (totalMin >= bsMin && totalMin < beMin) return false;
  }

  return true;
}

// Year/month/day that `epochSec` falls on when viewed in timezone `tz`.
function _dateInTz(epochSec, tz) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: tz,
    year: "numeric", month: "2-digit", day: "2-digit",
  }).formatToParts(new Date(epochSec * 1000));
  return {
    y:  +parts.find(p => p.type === "year").value,
    mo: +parts.find(p => p.type === "month").value,
    d:  +parts.find(p => p.type === "day").value,
  };
}

// Convert a wall-clock date/time in timezone `tz` to a Unix epoch (seconds).
// Uses the "guess as UTC, then correct by observed offset" trick so it stays
// correct across DST without a tz library.
function _tzDateTimeToEpoch(y, mo, d, h, mi, tz) {
  const utcGuess = Date.UTC(y, mo - 1, d, h, mi);
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: tz,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit",
    hourCycle: "h23",
  }).formatToParts(new Date(utcGuess));
  const py  = +parts.find(p => p.type === "year").value;
  const pmo = +parts.find(p => p.type === "month").value;
  const pd  = +parts.find(p => p.type === "day").value;
  const ph  = +parts.find(p => p.type === "hour").value;
  const pmi = +parts.find(p => p.type === "minute").value;
  const tzAsUTC = Date.UTC(py, pmo - 1, pd, ph, pmi);
  const offsetMs = tzAsUTC - utcGuess;
  return (utcGuess - offsetMs) / 1000;
}

function updateClockLabel() {
  const $cl = document.getElementById("clock-label");
  if (!$cl) return;
  const exch = state.exchange || { tz: "America/New_York", name: "NYSE" };
  const now  = internetNow();
  const timeStr = new Intl.DateTimeFormat("en-US", {
    timeZone: exch.tz,
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
  }).format(now);
  const offsetSec = Math.round(clockOffsetMs / 1000);
  const approxNote = exch.approximate ? " ⚠ approx holidays" : "";
  $cl.textContent =
    `${exch.name || ""}  ${timeStr}  (Δ${offsetSec >= 0 ? "+" : ""}${offsetSec}s via ${clockSyncSource.split(" (")[0]}${approxNote})`;
  $cl.title = `Exchange: ${exch.name}  Timezone: ${exch.tz}  Clock offset: ${offsetSec >= 0 ? "+" : ""}${offsetSec}s`;
}

// ══════════════════════════════════════════════════════════════════════════════
//  DOM refs
// ══════════════════════════════════════════════════════════════════════════════
const $loading      = document.getElementById("loading");
const $tickerLabel  = document.getElementById("ticker-label");
const $companyLabel = document.getElementById("company-label");
const $priceLabel   = document.getElementById("price-label");
const $changeLabel  = document.getElementById("change-label");
const $statusBadge  = document.getElementById("status-badge");
const $liveDot      = document.getElementById("live-dot");
const $liveLabel    = document.getElementById("live-label");
const $updatedLabel = document.getElementById("updated-label");
const $intervalLabel= document.getElementById("interval-label");
const $errorToast   = document.getElementById("error-toast");
const $ohlcvTooltip    = document.getElementById("ohlcv-tooltip");
const $cursorPVLabel   = document.getElementById("cursor-pv-label");

// Compact volume format: 1,234,567 → 1.23M
function _fmtVol(v) {
  if (typeof v !== 'number' || !isFinite(v)) return '—';
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return String(v);
}
// Date + HH:MM from epoch seconds (or BusinessDay {y,m,d}).
function _fmtTime(t) {
  if (typeof t === 'number') {
    const d = new Date(t * 1000);
    return `${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
  }
  if (t && typeof t === 'object' && 'year' in t) {
    return `${t.year}-${String(t.month).padStart(2,'0')}-${String(t.day).padStart(2,'0')}`;
  }
  return String(t);
}

// ══════════════════════════════════════════════════════════════════════════════
//  Period UI (no buttons here anymore — the 3D scene parent (index.html)
//  renders a single top-of-screen period bar that controls every billboard
//  via postMessage. Wheel-zoom inside the chart still auto-switches period
//  and broadcasts the change so the parent's top bar stays in sync.)
// ══════════════════════════════════════════════════════════════════════════════
function updatePeriodButtons() { /* no-op: buttons moved to parent scene */ }

// ══════════════════════════════════════════════════════════════════════════════
//  Lightweight Charts setup
// ══════════════════════════════════════════════════════════════════════════════
const chartEl = document.getElementById("chart");
const _light = window.matchMedia('(prefers-color-scheme: light)').matches;
const _bg = _light ? '#ffffff' : '#000000';
const _fg = _light ? '#000000' : '#ffffff';
const _grid = _light ? '#e0e0e0' : '#3a3a50';
const _txtDim = '#8b949e';

const chart = LightweightCharts.createChart(chartEl, {
  layout: {
    background:  { color: _bg },
    textColor:   _txtDim,
  },
  grid: {
    vertLines: { color: _grid },
    horzLines: { color: _grid },
  },
  crosshair: {
    mode: LightweightCharts.CrosshairMode.Normal,
    // Price label on the right scale is hidden entirely — the cursor-linked
    // price+volume info is surfaced via the #cursor-pv-label overlay instead.
    horzLine: { labelVisible: false },
  },
  rightPriceScale: {
    borderColor: _fg,
    scaleMargins: { top: 0.05, bottom: 0.25 },
  },
  timeScale: {
    borderColor: _fg,
    timeVisible: true,
    secondsVisible: false,
  },
  // Wheel / drag zoom inside the chart is disabled — all mouse-wheel
  // interaction is forwarded to the parent 3D scene so scrolling always
  // zooms the camera, never the chart's time scale.
  handleScroll:  false,
  handleScale:   false,
});

// Forward every wheel event to the parent so the 3D camera zooms even
// when the cursor is over this chart iframe. Events can't bubble across
// the frame boundary, so we relay {deltaY, deltaMode} via postMessage
// and let the parent apply its own zoom-inertia math.
window.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type:      'sv-wheel',
        deltaY:    ev.deltaY,
        deltaMode: ev.deltaMode,
      }, '*');
    }
  } catch (_) { /* cross-origin safety net — same-origin in practice */ }
}, { passive: false });

// Forward right-mouse-button drags to the parent so the 3D camera orbits
// even when the cursor is over this chart iframe. Use screenX/screenY
// (not clientX/clientY) so deltas stay correct if the mouse leaves the
// iframe mid-drag, and document-level capture-phase listeners so nothing
// from lightweight-charts can swallow the events first.
let _rmbActive = false;
let _rmbLastSX = 0;
let _rmbLastSY = 0;
document.addEventListener('mousedown', (ev) => {
  if (ev.button !== 2) return;
  _rmbActive = true;
  _rmbLastSX = ev.screenX;
  _rmbLastSY = ev.screenY;
  // Hide the crosshair + date/time/price readouts while orbiting so the
  // chart doesn't show cursor-linked info under a drag that belongs to
  // the 3D camera, not the chart.
  chart.applyOptions({ crosshair: { mode: LightweightCharts.CrosshairMode.Hidden } });
  $ohlcvTooltip.classList.remove('visible');
  $cursorPVLabel.classList.remove('visible');
  ev.preventDefault();
}, true);
document.addEventListener('mousemove', (ev) => {
  if (!_rmbActive) return;
  // Lose the drag if the button came up outside this document.
  if (!(ev.buttons & 2)) { _rmbActive = false; return; }
  const dx = ev.screenX - _rmbLastSX;
  const dy = ev.screenY - _rmbLastSY;
  _rmbLastSX = ev.screenX;
  _rmbLastSY = ev.screenY;
  if (dx === 0 && dy === 0) return;
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type:   'sv-rmb-move',
        deltaX: dx,
        deltaY: dy,
      }, '*');
    }
  } catch (_) {}
}, true);
document.addEventListener('mouseup', (ev) => {
  if (ev.button !== 2) return;
  _rmbActive = false;
  chart.applyOptions({ crosshair: { mode: LightweightCharts.CrosshairMode.Normal } });
}, true);
document.addEventListener('contextmenu', (ev) => ev.preventDefault(), true);

// Candlestick series
const candleSeries = chart.addCandlestickSeries({
  upColor:          "#3fb950",
  downColor:        "#f85149",
  borderUpColor:    "#3fb950",
  borderDownColor:  "#f85149",
  wickUpColor:      "#3fb950",
  wickDownColor:    "#f85149",
});

// Line series (close prices only — hidden by default)
const lineSeries = chart.addLineSeries({
  color:            '#58a6ff',
  lineWidth:        2,
  priceLineVisible: false,
  visible:          false,
});

// Area series (line + gradient fill — hidden by default)
const areaSeries = chart.addAreaSeries({
  lineColor:        '#58a6ff',
  topColor:         'rgba(88,166,255,0.28)',
  bottomColor:      'rgba(88,166,255,0.02)',
  lineWidth:        2,
  priceLineVisible: false,
  visible:          false,
});

// Current chart type — switched via sv-charttype message from parent
let _chartType = 'candle';

function applyChartType(type) {
  if (!['candle','line','area'].includes(type)) return;
  _chartType = type;
  candleSeries.applyOptions({ visible: type === 'candle' });
  lineSeries.applyOptions({   visible: type === 'line' });
  areaSeries.applyOptions({   visible: type === 'area' });
}

// Shared state — read by syncChartLines, written by applyMode / applyDetail / OS media query
let _isLight = _light;
let _detailVisible = true;

// Single source of truth for grid + border colors, respects both theme and detail state
function syncChartLines() {
  const grid   = _detailVisible ? (_isLight ? '#e0e0e0' : '#3a3a50') : 'transparent';
  const border = _detailVisible ? (_isLight ? '#000000' : '#ffffff') : 'transparent';
  chart.applyOptions({
    grid:            { vertLines: { color: grid }, horzLines: { color: grid } },
    rightPriceScale: { borderColor: border },
    timeScale:       { borderColor: border },
  });
  candleSeries.applyOptions({ priceLineVisible: _detailVisible });
  lineSeries.applyOptions({   priceLineVisible: _detailVisible });
  areaSeries.applyOptions({   priceLineVisible: _detailVisible });
  document.getElementById('topbar').style.borderBottomColor  = _detailVisible ? '' : 'transparent';
  document.getElementById('footer').style.borderTopColor     = _detailVisible ? '' : 'transparent';
  document.getElementById('status-badge').style.borderColor  = _detailVisible ? '' : 'transparent';
  document.getElementById('ohlcv-tooltip').style.borderColor = _detailVisible ? '' : 'transparent';
}

// Live-update chart colors when OS theme changes at runtime
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
  _isLight = e.matches;
  const bg = _isLight ? '#ffffff' : '#000000';
  chart.applyOptions({
    layout: { background: { color: bg }, textColor: '#8b949e' },
  });
  syncChartLines();
});

// Volume histogram on a separate (shorter) pane — achieved via price scale margin
const volumeSeries = chart.addHistogramSeries({
  color:          "#58a6ff44",
  priceFormat:    { type: "volume" },
  priceScaleId:   "volume",
});
chart.priceScale("volume").applyOptions({
  scaleMargins: { top: 0.80, bottom: 0.00 },
});

// Resize chart when window resizes
const ro = new ResizeObserver(entries => {
  const { width, height } = entries[0].contentRect;
  chart.resize(width, height);
});
ro.observe(chartEl);

// Programmatic range-change suppression flag, still used by renderChart
// when it calls setVisibleRange/fitContent. Left in place even though the
// wheel-zoom-to-period auto-switch has been removed — the rest of the
// render pipeline references it.
let _ignoreRangeChange  = false;

// ══════════════════════════════════════════════════════════════════════════════
//  Cross-iframe period sync (used by the 3D Stock Visualizer parent)
//
//  When multiple chart iframes are hosted inside the Three.js scene, any one
//  of them changing its time window (via wheel-zoom or a period button) is
//  broadcast to the parent, which forwards it to the other iframes so they
//  all stay on the same period.
//
//  Standalone use (this page opened directly) is unaffected — the parent is
//  just `window` itself in that case and the postMessage is a no-op.
// ══════════════════════════════════════════════════════════════════════════════
function broadcastPeriod(p) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "sv-period", period: p }, "*");
    }
  } catch (_) { /* cross-origin safety net */ }
}

window.addEventListener("message", (ev) => {
  const d = ev.data;
  if (!d || typeof d.period !== "string" || !PERIODS.includes(d.period)) return;

  // Parent forwarded preloaded batch data — render directly, no fetch needed.
  if (d.type === "sv-period-with-data" && d.data) {
    state.period = d.period;
    updatePeriodButtons();
    clearLiveTimer();
    $loading.classList.add("hidden");
    try {
      renderChart(d.data);
      scheduleLive();
    } catch (err) {
      showError("Failed to render: " + err.message);
    }
    return;
  }

  // Legacy path: parent only told us the new period — fetch our own data.
  if (d.type === "sv-period" && d.period !== state.period) {
    state.period = d.period;
    updatePeriodButtons();
    loadChart();
  }
});

// ══════════════════════════════════════════════════════════════════════════════
//  OHLCV crosshair tooltip
// ══════════════════════════════════════════════════════════════════════════════
chart.subscribeCrosshairMove(param => {
  // While a right-drag is active the user is orbiting the 3D camera — any
  // cursor-linked chart overlays must stay hidden until the drag releases.
  if (_rmbActive || !param.point || !param.time) {
    $ohlcvTooltip.classList.remove("visible");
    $cursorPVLabel.classList.remove("visible");
    return;
  }

  const bar = param.seriesData.get(candleSeries);
  if (!bar) {
    $ohlcvTooltip.classList.remove("visible");
    $cursorPVLabel.classList.remove("visible");
    return;
  }

  const { open: o, high: h, low: l, close: c } = bar;
  const chg    = c - o;
  const chgPct = ((chg / o) * 100).toFixed(2);
  const color  = chg >= 0 ? "#3fb950" : "#f85149";
  const fmt    = v => typeof v === "number" ? v.toFixed(2) : "—";
  const volBar = param.seriesData.get(volumeSeries);
  const vol    = volBar ? volBar.value : null;

  $ohlcvTooltip.innerHTML =
    `<div class="ot-time">${_fmtTime(param.time)}</div>
     <div class="ot-pv">
       <span><span class="ov">Price</span><span class="oval" style="color:${color}">${fmt(c)}</span></span>
       <span><span class="ov">Vol</span><span class="oval">${_fmtVol(vol)}</span></span>
     </div>
     <div class="ot-row">
       <span><span class="ov">O</span><span class="oval">${fmt(o)}</span></span>
       <span><span class="ov">H</span><span class="oval">${fmt(h)}</span></span>
       <span><span class="ov">L</span><span class="oval">${fmt(l)}</span></span>
       <span><span class="ov">C</span><span class="oval" style="color:${color}">${fmt(c)}</span></span>
       <span><span class="ov">Δ</span><span class="oval" style="color:${color}">${chg>=0?"+":""}${fmt(chg)} (${chgPct}%)</span></span>
     </div>`;
  $ohlcvTooltip.classList.add("visible");

  // Floating Price + Volume label that tracks the crosshair's x-position
  // at the bottom of the chart — appears right next to the native
  // date/time axis label so price/volume are visible exactly where the
  // cursor is.
  $cursorPVLabel.innerHTML =
    `<span class="cpv-lab">Price</span><span style="color:${color}">${fmt(c)}</span>` +
    `<span class="cpv-sep">|</span>` +
    `<span class="cpv-lab">Vol</span><span>${_fmtVol(vol)}</span>`;
  // Make visible first so offsetWidth is measurable, then flip the label
  // to the cursor's LEFT side whenever the default right-of-cursor position
  // would overflow the chart pane (so it stays on-screen near the right edge).
  $cursorPVLabel.classList.add('visible');
  const _paneW   = chart.timeScale().width();
  const _labW    = $cursorPVLabel.offsetWidth;
  const _flip    = (param.point.x + 8 + _labW) > _paneW;
  $cursorPVLabel.style.left = (_flip ? param.point.x - 8 - _labW : param.point.x + 8) + 'px';
  $cursorPVLabel.style.top  = (param.point.y - 6) + 'px';
});

// ══════════════════════════════════════════════════════════════════════════════
//  Data loading
// ══════════════════════════════════════════════════════════════════════════════

// Stale-while-revalidate single-chart load.
//   Phase 1 (mode=swr): instant render from SQLite cache, no network. The
//                       server returns 204 if nothing is cached for this
//                       (ticker, period), in which case we skip to phase 2
//                       with the spinner — typical first-ever load path.
//   Phase 2 (mode=fresh): real yfinance fetch. Always runs unless phase 1
//                       returned data with stale=false.
async function loadChart() {
  if (!state.ticker) return;
  clearLiveTimer();

  const url = `/api/data?ticker=${encodeURIComponent(state.ticker)}&period=${state.period}`;
  let renderedFromCache = false;
  let needFresh         = true;

  try {
    const res = await fetch(url + "&mode=swr");
    if (res.status !== 204) {
      const data = await res.json();
      if (data && !data.error && Array.isArray(data.records) && data.records.length) {
        renderChart(data);
        renderedFromCache = true;
        $loading.classList.add("hidden");
        if (data.stale === false) needFresh = false;
      }
    }
  } catch (_) { /* phase-1 failure → fall through to phase 2 */ }

  if (!renderedFromCache) $loading.classList.remove("hidden");

  if (needFresh) {
    try {
      const res  = await fetch(url);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      renderChart(data);
    } catch (err) {
      if (!renderedFromCache) showError("Failed to load: " + err.message);
      // else: keep the cached frame; silent failure on background refresh.
    } finally {
      $loading.classList.add("hidden");
    }
  }

  scheduleLive();
}

function renderChart(data) {
  const { meta, records, interval, fetched_at, market_open, exchange_schedule } = data;

  // Keep exchange schedule in sync — used by isMarketOpenNow() between polls
  if (exchange_schedule) {
    state.exchange = exchange_schedule;
    updateClockLabel();
  }

  // ── Price series ─────────────────────────────────────────────────────────
  const candles = records.map(r => ({
    time:  r.t,    // Unix epoch — Lightweight Charts accepts this directly
    open:  r.o,
    high:  r.h,
    low:   r.l,
    close: r.c,
  }));
  const volumes = records.map(r => ({
    time:  r.t,
    value: r.v,
    color: r.c >= r.o ? "#3fb95044" : "#f8514944",
  }));
  const lineData = records.map(r => ({ time: r.t, value: r.c }));

  // For 1d: pad each series with whitespace bars (items with just `time`,
  // no OHLC/value) from the last real bar up to session close. Lightweight
  // Charts v4 clamps setVisibleRange to the actual data extent, so we need
  // the series itself to reserve the space — then fitContent naturally spans
  // open→close, with the price curve reaching mid-chart mid-session and the
  // right edge at close.
  let sessionOpenEpoch  = null;
  let sessionCloseEpoch = null;
  if (state.period === "1d" && state.exchange && records.length > 0) {
    const tz = state.exchange.tz;
    const { y, mo, d } = _dateInTz(records[0].t, tz);
    sessionOpenEpoch  = _tzDateTimeToEpoch(y, mo, d, state.exchange.open[0],  state.exchange.open[1],  tz);
    sessionCloseEpoch = _tzDateTimeToEpoch(y, mo, d, state.exchange.close[0], state.exchange.close[1], tz);
    const lastT = records[records.length - 1].t;
    const step  = (records.length >= 2) ? Math.max(1, records[1].t - records[0].t) : 60;
    for (let t = lastT + step; t <= sessionCloseEpoch; t += step) {
      candles.push({ time: t });
      lineData.push({ time: t });
      volumes.push({ time: t });
    }
  }

  candleSeries.setData(candles);
  lineSeries.setData(lineData);
  areaSeries.setData(lineData);
  volumeSeries.setData(volumes);

  // Suppress the zoom-subscription while we programmatically fit the view.
  _ignoreRangeChange = true;
  if (sessionOpenEpoch != null && sessionCloseEpoch != null) {
    chart.timeScale().setVisibleRange({ from: sessionOpenEpoch, to: sessionCloseEpoch });
  } else {
    chart.timeScale().fitContent();
  }
  setTimeout(() => { _ignoreRangeChange = false; }, 250);

  // ── Price panel ───────────────────────────────────────────────────────────
  if (records.length >= 2) {
    const last  = records[records.length - 1];
    const first = records[0];
    const chg   = last.c - first.o;
    const chgPct= ((chg / first.o) * 100).toFixed(2);
    const color = chg >= 0 ? "#3fb950" : "#f85149";

    $tickerLabel.textContent  = meta.ticker || "—";
    $companyLabel.textContent = meta.short_name || "";
    $priceLabel.textContent   = last.c.toFixed(2);
    $priceLabel.style.color   = color;
    $changeLabel.textContent  = `${chg >= 0 ? "+" : ""}${chg.toFixed(2)} (${chgPct}%)`;
    $changeLabel.style.color  = color;
    // Tint line/area series to match price direction
    const rgba = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
    };
    lineSeries.applyOptions({ color: color });
    areaSeries.applyOptions({
      lineColor:   color,
      topColor:    rgba(color, 0.28),
      bottomColor: rgba(color, 0.02),
    });
    document.title            = `${meta.ticker} ${last.c.toFixed(2)} — Stock Visualizer`;
  }

  // ── Status / footer ───────────────────────────────────────────────────────
  const exchName = exchange_schedule?.name || "";
  if (market_open) {
    $statusBadge.textContent = exchName ? `${exchName} OPEN` : "OPEN";
    $statusBadge.className   = "open";
  } else {
    $statusBadge.textContent = exchName ? `${exchName} CLOSED` : "CLOSED";
    $statusBadge.className   = "closed";
  }

  // Broadcast price info to parent so the fixed overlay can display it.
  if (window.parent !== window && records.length >= 2) {
    const last  = records[records.length - 1];
    const first = records[0];
    const chg   = last.c - first.o;
    const chgPct= ((chg / first.o) * 100).toFixed(2);
    try {
      window.parent.postMessage({
        type: 'sv-price-info',
        ticker: meta.ticker || '',
        company: meta.short_name || '',
        price: last.c.toFixed(2),
        change: `${chg >= 0 ? '+' : ''}${chg.toFixed(2)} (${chgPct}%)`,
        positive: chg >= 0,
        status: market_open ? 'open' : 'closed',
        statusText: $statusBadge.textContent,
      }, '*');
    } catch (_) {}
  }

  const updatedDate = new Date(fetched_at + "Z"); // treat as UTC
  $updatedLabel.textContent  = updatedDate.toLocaleTimeString();
  $intervalLabel.textContent = interval;
}

// ══════════════════════════════════════════════════════════════════════════════
//  Live polling
//
//  Market-open decision uses isMarketOpenNow() — the browser's own Intl-based
//  ET check on a clock calibrated against the internet (clockOffsetMs).
//  The server's market_open field is used only as a cross-check / fallback.
// ══════════════════════════════════════════════════════════════════════════════

function scheduleLive() {
  clearLiveTimer();
  const open = isMarketOpenNow();

  if (open) {
    $liveDot.classList.remove("off");
    $liveLabel.textContent = "Live (6 s)";
    state.liveTimer = setInterval(async () => {
      // Re-evaluate market status every tick using calibrated clock
      if (!isMarketOpenNow()) {
        scheduleLive();   // will flip to "off" branch
        return;
      }
      try {
        const res  = await fetch(`/api/data?ticker=${encodeURIComponent(state.ticker)}&period=${state.period}`);
        const data = await res.json();
        if (!data.error) renderChart(data);
      } catch (_) { /* silent — keep polling */ }
      updateClockLabel();
    }, REFRESH_MS);
  } else {
    $liveDot.classList.add("off");
    $liveLabel.textContent = "Live updates off";
  }
}

function clearLiveTimer() {
  if (state.liveTimer) { clearInterval(state.liveTimer); state.liveTimer = null; }
}

// ══════════════════════════════════════════════════════════════════════════════
//  Error toast
// ══════════════════════════════════════════════════════════════════════════════
let _errorTimer = null;
function showError(msg) {
  $errorToast.textContent = msg;
  $errorToast.classList.add("show");
  clearTimeout(_errorTimer);
  _errorTimer = setTimeout(() => $errorToast.classList.remove("show"), 5000);
}


function applyMode(light) {
  _isLight = light;
  const bg = light ? '#ffffff' : '#000000';
  const root = document.documentElement;
  root.style.setProperty('--bg', bg);
  root.style.setProperty('--fg', light ? '#000000' : '#ffffff');
  root.style.setProperty('--txt', light ? '#000000' : '#ffffff');
  chart.applyOptions({
    layout: { background: { color: bg }, textColor: '#8b949e' },
  });
  syncChartLines();
}

// Hide/show thin 1px lines (grid + scale borders) to reduce aliasing flicker
// when the billboard is scaled small.  Everything else (topbar, footer, volume,
// price/time labels, candlesticks) stays untouched.
function applyDetail(show) {
  if (show === _detailVisible) return;
  _detailVisible = show;
  syncChartLines();
}

window.addEventListener('message', (ev) => {
  const d = ev && ev.data;
  if (d && d.type === 'sv-mode') applyMode(d.light);
  if (d && d.type === 'sv-detail') applyDetail(d.show);
  if (d && d.type === 'sv-charttype') applyChartType(d.chartType);
});

// ══════════════════════════════════════════════════════════════════════════════
//  Boot: sync clock, then read URL params and load chart
// ══════════════════════════════════════════════════════════════════════════════
(async function boot() {
  const params = new URLSearchParams(window.location.search);
  const t     = params.get("ticker") || "";
  const p     = params.get("period") || "1d";
  state.period = PERIODS.includes(p) ? p : "1d";
  updatePeriodButtons();

  // Calibrate clock against internet before deciding market status
  await syncClock();
  // Re-calibrate every 30 min while the page is open
  setInterval(syncClock, CLOCK_RESYNC_MS);
  // Tick the ET clock display every second
  setInterval(updateClockLabel, 1000);

  if (t) {
    state.ticker = t.toUpperCase();
    loadChart();
  } else {
    $loading.classList.add("hidden");
  }
})();
</script>
</body>
</html>
