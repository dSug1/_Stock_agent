      // Percent-sort overlay: tickers without a parsed entry price keep their
      // default order at the top; tickers with an entry price follow, sorted
      // ascending by the displayed %Δ = (current − entry)/current so the most
      // negative %Δ comes first and the most positive %Δ last.
      if (_sortMode === 'percent') {
        const keyed = withAngle.map((it, i) => {
          const bb = it.b;
          const t  = getTargetPrice(bb.ticker);
          let info;
          try { info = _priceInfoMap.get(bb.element.contentWindow); } catch (_) {}
          const c  = info && Number.isFinite(info.priceNum) ? info.priceNum : null;
          const pct = (t != null && c != null && c > 0) ? ((c - t) / c) : null;
          return { it, pct, baseIdx: i };
        });
        keyed.sort((a, b) => {
          // Group 1: no pct → retain default (baseIdx) order at the top.
          // Group 2: has pct → sorted ascending by pct.
          if (a.pct == null && b.pct == null) return a.baseIdx - b.baseIdx;
          if (a.pct == null) return -1;
          if (b.pct == null) return  1;
          if (a.pct === b.pct) return a.baseIdx - b.baseIdx;
          return a.pct - b.pct;
        });
        withAngle.length = 0;
        for (const k of keyed) withAngle.push(k.it);
      }

      // Mark which billboards are still present
      const currentSet = new Set(ring);

      // Remove stale entries
      for (const [bb, entry] of _tickerRowMap) {
        if (!currentSet.has(bb)) {
          entry.rowEl.remove();
          entry.sepEl.remove();
          if (entry.inputRowEl) {
            if (entry.inputEl) { try { entry.inputEl.blur(); } catch (_) {} }
            try { window.getSelection()?.removeAllRanges(); } catch (_) {}
            entry.inputRowEl.remove();
          }
          _tickerRowMap.delete(bb);
        }
      }

      // Ensure each billboard has a row; reorder via appendChild
      for (let i = 0; i < withAngle.length; i++) {
        const bb = withAngle[i].b;
        let entry = _tickerRowMap.get(bb);
        if (!entry) {
          const rowEl = document.createElement('div');
          rowEl.className = 'tl-row';
          const plusBtn = document.createElement('button');
          plusBtn.type = 'button';
          plusBtn.className = 'tl-plus';
          plusBtn.textContent = '+';
          plusBtn.title = 'Add marker text';
          const tTicker  = document.createElement('span'); tTicker.className  = 'tl-ticker';
          const tCompany = document.createElement('span'); tCompany.className = 'tl-company';
          const tPrice   = document.createElement('span'); tPrice.className   = 'tl-price';
          const tChange  = document.createElement('span'); tChange.className  = 'tl-change';
          const tTarget  = document.createElement('span'); tTarget.className  = 'tl-target';
          const giraffeBtn = document.createElement('button');
          giraffeBtn.type = 'button';
          giraffeBtn.className = 'tl-giraffe-btn';
          giraffeBtn.title = 'Open this ticker';
          const giraffeImg = document.createElement('img');
          giraffeImg.src = '/utilities/renderer/logo.png';
          giraffeImg.alt = '';
          giraffeBtn.appendChild(giraffeImg);
          rowEl.append(plusBtn, tTicker, tCompany, tPrice, tChange, tTarget, giraffeBtn);
          const sepEl = document.createElement('hr');
          sepEl.className = 'tl-sep';
          const clickedBb = bb;
          rowEl.addEventListener('click', (e) => {
            // Clicks on the plus or input row must not trigger orbit.
            if (e.target.closest('.tl-plus, .tl-marker-input-row')) return;
            _clickOrbitTarget = clickedBb;
            _cameraDirty = true;
          });
          giraffeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            _clickOrbitTarget = clickedBb;
            _chatExpanded = true;
            document.body.classList.add('chat-expanded');
            setChatBtnState(1);
            _lastTickerListGen = -1;
            _cameraDirty = true;
          });
          plusBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            // Toggle the input row. Never clears the marker text — the
            // billboard keeps displaying whatever's stored for this ticker.
            toggleMarkerInputRow(clickedBb);
          });
          entry = {
            rowEl, sepEl,
            ticker: tTicker, company: tCompany, price: tPrice, change: tChange, target: tTarget,
            giraffe: giraffeBtn, plus: plusBtn,
            inputRowEl: null, inputEl: null,
            _lastTicker: '', _lastPrice: '', _lastChange: '', _lastTarget: '', _lastTargetCls: '',
          };
          _tickerRowMap.set(bb, entry);
        }
        // Reflect current marker state on the "+"/"−" button.
        syncBillboardMarker(bb);
        refreshPlusButton(entry, bb);
        // If the input row is open, append it before the main row.
        if (entry.inputRowEl) $tickerListScroll.appendChild(entry.inputRowEl);
        // appendChild moves existing nodes — achieves reorder
        $tickerListScroll.appendChild(entry.rowEl);
        // separator after every row except the last
        if (i < withAngle.length - 1) {
          $tickerListScroll.appendChild(entry.sepEl);
        } else {
          entry.sepEl.remove();  // remove trailing separator
        }
        // Mark closest by billboard identity, NOT by visual row index.
        // In percent-sort mode the top visual row may be a non-closest
        // billboard (the most-negative-% one) — state 2 hides every
        // non-.closest row, so keying on identity is what guarantees the
        // correct row stays visible.
        entry.rowEl.classList.toggle('closest', bb === _closestInteractive);
      }

      // Rows are always rendered at their natural fixed size — no font
      // scaling based on row count. Scroll-on-overflow handles the rest.
      $tickerList.style.setProperty('--ticker-row-scale', 1);

      sizeTickerListScroll();
    }

    /**
     * Size the #ticker-list-scroll container to fit the currently-rendered
     * rows. Safe to re-call whenever row heights may have changed (e.g.
     * after target text is populated and .tl-target flips from display:none
     * to visible, adding a wrapped line below the row).
     */
    function sizeTickerListScroll() {
      const rows = $tickerListScroll.querySelectorAll('.tl-row');
      const seps = $tickerListScroll.querySelectorAll('.tl-sep');
      const n = rows.length;
      // Sum of row + separator heights, plus the scroll container's own
      // padding (top + bottom) — measures the total content-box height
      // the scroll container needs if no clamp is applied.
      const cs    = getComputedStyle($tickerListScroll);
      const padY  = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
      const measureRows = (count) => {
        let h = 0;
        for (let i = 0; i < count && i < n; i++) h += rows[i].offsetHeight;
        for (let i = 0; i < count - 1 && i < seps.length; i++) h += seps[i].offsetHeight;
        return h + padY;
      };

      document.body.classList.toggle('chat-expanded', _chatExpanded);

      if (_chatExpanded) {
        // State 2: only the closest row is visible, no sizing needed.
        $tickerListScroll.style.maxHeight = '';
        $tickerListScroll.style.minHeight = '';
        $tickerListScroll.classList.remove('scrollable');
        return;
      }

      // State 1 (adaptive): compute how much vertical space is available
      // in the chat container for the ticker list, then show as many rows
      // as fit and scroll the rest.
      const bottomRowEl   = document.getElementById('chat-bottom-row');
      const toggleEl      = document.getElementById('chat-bottom-toggle');
      const bottomRowH    = bottomRowEl ? bottomRowEl.offsetHeight : 0;
      const toggleH       = toggleEl    ? toggleEl.offsetHeight    : 0;
      const overlayChrome = 32 /* top + bottom 16px viewport margins */ + 16 /* paddings/gaps */;
      const maxAvail      = Math.max(60, window.innerHeight - overlayChrome - bottomRowH - toggleH);
      const naturalH      = measureRows(n);

      if (naturalH > maxAvail) {
        // Rows overflow the available space → enable scrolling.
        $tickerListScroll.style.maxHeight = maxAvail + 'px';
        $tickerListScroll.style.minHeight = maxAvail + 'px';
        $tickerListScroll.classList.add('scrollable');
      } else {
        // Everything fits: use natural height, pad to 3 rows when fewer.
        $tickerListScroll.style.maxHeight = '';
        $tickerListScroll.style.minHeight = (n < 3) ? measureRows(3) + 'px' : '';
        $tickerListScroll.classList.remove('scrollable');
      }
    }

    /**
     * Update text content of every ticker-list row from _priceInfoMap.
     * Uses dirty checks to minimise DOM writes on the hot path.
     */
    function updateTickerListData() {
      let targetVisibilityChanged = false;
      for (const [bb, entry] of _tickerRowMap) {
        let info;
        try { info = _priceInfoMap.get(bb.element.contentWindow); } catch (_) {}
        const ticker  = info ? info.ticker  : (bb.ticker || '');
        const company = info ? info.company : '';
        const price   = info ? info.price   : '...';
        const change  = info ? info.change  : '';
        const color   = info ? (info.positive ? '#3fb950' : '#f85149') : 'var(--text)';

        if (entry._lastTicker !== ticker) {
          entry.ticker.textContent = ticker;
          entry._lastTicker = ticker;
        }
        // Dirty-check the source class — flips only when the ticker changes
        // or when Go/markTickerAuto rewrites the LS entry.
        const srcAuto = (ticker && getTickerSource(ticker) === TICKER_SOURCE.AUTO);
        if (entry._lastSrcAuto !== srcAuto) {
          entry.ticker.classList.toggle('source-auto', srcAuto);
          entry._lastSrcAuto = srcAuto;
        }
        if (entry._lastCompany !== company) {
          entry.company.textContent = company;
          entry._lastCompany = company;
        }
        if (entry._lastPrice !== price) {
          entry.price.textContent = price;
          entry._lastPrice = price;
        }
        if (entry._lastChange !== change) {
          entry.change.textContent = change;
          entry._lastChange = change;
        }
        entry.price.style.color  = color;
        entry.change.style.color = color;

        const targetPrice = getTargetPrice(ticker);
        const priceNum    = info ? info.priceNum : null;
        const tl          = formatTargetLabel(targetPrice, priceNum);
        if (entry._lastTarget !== tl.text) {
          // A flip between empty and non-empty changes row height (wraps
          // a new line on/off), so we need to re-size the scroll clamp.
          if ((entry._lastTarget === '') !== (tl.text === '')) {
            targetVisibilityChanged = true;
          }
          entry.target.textContent = tl.text;
          entry._lastTarget = tl.text;
        }
        const newCls = 'tl-target ' + tl.cls;
        if (entry._lastTargetCls !== newCls) {
          entry.target.className = newCls;
          entry._lastTargetCls = newCls;
        }
      }
      if (targetVisibilityChanged) sizeTickerListScroll();
    }

    /**
     * Toggle the marker-text input row for a billboard's ticker list entry.
     * Creates the row lazily on first open; removes it on second click.
     * Typing updates localStorage + the 3D marker element live.
     */
    function toggleMarkerInputRow(b) {
      const entry = _tickerRowMap.get(b);
      if (!entry) return;
      if (entry.inputRowEl) {
        // Blur the focused input and drop any lingering text selection
        // (input.select() on open leaves a range in window.getSelection())
        // so the caret doesn't linger after the element is removed.
        if (entry.inputEl) { try { entry.inputEl.blur(); } catch (_) {} }
        try { window.getSelection()?.removeAllRanges(); } catch (_) {}
        entry.inputRowEl.remove();
        entry.inputRowEl = null;
        entry.inputEl = null;
        refreshPlusButton(entry, b);
        return;
      }
      const inputRow = document.createElement('div');
      inputRow.className = 'tl-marker-input-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'tl-marker-input';
      input.placeholder = 'Marker text\u2026';
      input.value = b.markerText || '';
      inputRow.appendChild(input);
      input.addEventListener('input', () => {
        const text = input.value;
        setMarkerText(b.ticker, text);
        b.markerText = text;
        if (b.markerEl) b.markerEl.textContent = text;
        refreshPlusButton(entry, b);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.preventDefault(); toggleMarkerInputRow(b); }
        else if (e.key === 'Enter') { input.blur(); }
      });
      entry.inputRowEl = inputRow;
      entry.inputEl = input;
      // Insert before the main row so it reads as "above the ticker".
      if (entry.rowEl.parentNode) {
        entry.rowEl.parentNode.insertBefore(inputRow, entry.rowEl);
      }
      refreshPlusButton(entry, b);
      input.focus();
      input.select();
    }

    // ── Target entry price: first row of sv.entryTargets.<TICKER>, if it
    // parses as a positive float. Any non-numeric first-row text is a plain
    // note (just displayed in the detail editor, no price overlay).
    function getTargetPrice(ticker) {
      if (!ticker) return null;
      const arr = getEntryTargets(ticker);
      const raw = String(arr[0] ?? '').trim().replace(',', '.');
      if (!raw) return null;
      const v = parseFloat(raw);
      return (Number.isFinite(v) && v > 0) ? v : null;
    }
    // Second entry price: second row of sv.entryTargets.<TICKER>, same parse
    // rules. Used only by the billboard chart to render a second target line
    // beneath the first.
    function getTargetPrice2(ticker) {
      if (!ticker) return null;
      const arr = getEntryTargets(ticker);
      const raw = String(arr[1] ?? '').trim().replace(',', '.');
      if (!raw) return null;
      const v = parseFloat(raw);
      return (Number.isFinite(v) && v > 0) ? v : null;
    }
    // Format the "Target X.XX (+Y.YY%)" label for a given target & current price.
    // Percentage = (current − target) / current. Positive → current is above
    // target (orange); negative → current is below target (blue). Returns empty
    // text when either input is missing — callers should clear their display.
    function formatTargetLabel(targetNum, currentNum) {
      if (targetNum == null || !Number.isFinite(currentNum) || currentNum <= 0) {
        return { text: '', cls: '' };
      }
      const pct  = ((currentNum - targetNum) / currentNum) * 100;
      const sign = pct >= 0 ? '+' : '';
      return {
        text: `Target ${targetNum.toFixed(2)} (${sign}${pct.toFixed(2)}%)`,
        cls:  pct >= 0 ? 'above' : 'below',
      };
    }
    // Push the current stored target for `ticker` to every billboard iframe
    // that's rendering that ticker. Called on input change and on iframe
    // load-handshake (in the sv-price-info listener).
    function broadcastTargetPrice(ticker) {
      if (!ticker) return;
      const target  = getTargetPrice(ticker);
      const target2 = getTargetPrice2(ticker);
      for (const b of billboards) {
        if (!b.interactive || b.ticker !== ticker) continue;
        try { b.element.contentWindow.postMessage({ type: 'sv-target', target, target2 }, '*'); } catch (_) {}
      }
    }

    // Entry targets — per-ticker list of free-text values. Persisted to
    // localStorage under sv.entryTargets.<TICKER> as a JSON array of strings.
    // Empty/missing → a single empty row so the UI always has one input.
    const LS_TARGETS_KEY_PFX = 'sv.entryTargets.';
    function getEntryTargets(ticker) {
      if (!ticker) return [''];
      try {
        const raw = localStorage.getItem(LS_TARGETS_KEY_PFX + ticker);
        const arr = raw ? JSON.parse(raw) : null;
        if (Array.isArray(arr) && arr.length > 0) return arr.map(v => String(v ?? ''));
      } catch (_) {}
      return [''];
    }
    function setEntryTargets(ticker, values) {
      if (!ticker) return;
      const key = LS_TARGETS_KEY_PFX + ticker;
      try {
        const arr = (Array.isArray(values) && values.length > 0) ? values : [''];
        localStorage.setItem(key, JSON.stringify(arr));
      } catch (_) {}
    }
    // Sync per-row UI: last row is "+", others are "−". First row keeps the
    // "Entry target" placeholder; all following rows show "Enter text here".
    // Re-applied after any add/remove so positions stay correct when the
    // first row is deleted.
    function refreshTargetButtons(container) {
      const rows = container.querySelectorAll('.cb-target-row');
      rows.forEach((row, i) => {
        const btn = row.querySelector('.cb-target-btn');
        const isLast = i === rows.length - 1;
        btn.textContent = isLast ? '+' : '\u2212';
        btn.title = isLast ? 'Add another entry target' : 'Remove this entry target';
        const input = row.querySelector('.cb-target-input');
        input.placeholder =
          i === 0 ? 'Enter entry target or text here' :
          i === 1 ? 'Enter second entry price or text here' :
                    'Enter text here';
      });
    }
    function collectTargetValues(container) {
      return Array.from(container.querySelectorAll('.cb-target-input')).map(el => el.value);
    }
    function buildTargetRow(container, ticker, initialValue) {
      const row = document.createElement('div');
      row.className = 'cb-target-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'cb-target-input';
      input.placeholder = 'Entry target';
      input.value = initialValue || '';
      input.addEventListener('input', () => {
        setEntryTargets(ticker, collectTargetValues(container));
        // First row is the primary target, second row is the secondary target.
        // Either changing means the iframe(s) need the updated values pushed.
        const rows = container.querySelectorAll('.cb-target-input');
        if (rows[0] === input || rows[1] === input) broadcastTargetPrice(ticker);
      });
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cb-target-btn';
      btn.textContent = '+';
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const rows = container.querySelectorAll('.cb-target-row');
        const isLast = rows[rows.length - 1] === row;
        if (isLast) {
          // "+" → append a new empty row, making THIS row no longer last.
          const newRow = buildTargetRow(container, ticker, '');
          container.appendChild(newRow);
          refreshTargetButtons(container);
          setEntryTargets(ticker, collectTargetValues(container));
          newRow.querySelector('input').focus();
        } else {
          // "−" → remove this row. Guard: always keep at least one row.
          if (rows.length > 1) {
            const wasFirst  = rows[0] === row;
            const wasSecond = rows[1] === row;
            row.remove();
            refreshTargetButtons(container);
            setEntryTargets(ticker, collectTargetValues(container));
            // If either primary or secondary target row was removed, the
            // iframe's rendered targets need refreshing.
            if (wasFirst || wasSecond) broadcastTargetPrice(ticker);
          }
        }
      });
      row.append(input, btn);
      return row;
    }
    function renderEntryTargets(container, ticker) {
      container.replaceChildren();
      const values = getEntryTargets(ticker);
      for (const v of values) container.appendChild(buildTargetRow(container, ticker, v));
      refreshTargetButtons(container);
    }

    /**
     * Populate the #chat-body detail panel (state 2 only) with data for the
     * currently-closest billboard. The closest row is also the only ticker
     * row visible at the top in state 2, so detail content tracks it.
     * Cheap dirty-check: only rewrites DOM when the ticker identity changes.
     */
    let _detailLastTicker = null;
    function updateTickerDetail() {
      const expanded = document.body.classList.contains('chat-expanded');
      if (!expanded) {
        _detailLastTicker = null;
        return;
      }
      const b = _closestInteractive;
      let info;
      try { if (b && b.element) info = _priceInfoMap.get(b.element.contentWindow); } catch (_) {}
      const ticker  = info ? info.ticker  : (b && b.ticker) || '';
      const company = info ? info.company : '';
      if (_detailLastTicker === ticker) return;
      _detailLastTicker = ticker;
      $chatBody.replaceChildren();
      if (!ticker) return;
      // Ticker + company are already shown in the state-2 top row
      // (#ticker-list's .closest .tl-row) — no need to repeat them here.
      const targets = document.createElement('div');
      targets.className = 'cb-targets';
      $chatBody.append(targets);
      renderEntryTargets(targets, ticker);
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  HAMBURGER MENU toggle (top-left)
    //
    //  Clicking the bars icon slides the panel in from the left and swaps the
    //  icon to a white X. Clicking again closes. CSS handles the icon swap and
    //  the slide animation via the body.menu-open class.
    // ══════════════════════════════════════════════════════════════════════════
    const $menuToggle = document.getElementById('menu-toggle');
    $menuToggle.addEventListener('click', () => {
      document.body.classList.toggle('menu-open');
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  DISPLAY GROUP TOGGLE — collapses Theme + Camera sections
    // ══════════════════════════════════════════════════════════════════════════
    const $displayToggle = document.getElementById('display-toggle');
    const $displayGroup  = document.getElementById('display-group');
    function applyDisplayOpen(open) {
      $displayGroup.classList.toggle('collapsed', !open);
      $displayToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    // Always start collapsed on page load; clear any stale persisted state
    // from earlier builds so the default is enforced.
    try { localStorage.removeItem('sv.displayOpen'); } catch (_) {}
    applyDisplayOpen(false);
    $displayToggle.addEventListener('click', () => {
      const open = $displayGroup.classList.contains('collapsed');  // currently collapsed → opening
      applyDisplayOpen(open);
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  LIGHT / DARK TOGGLE
    // ══════════════════════════════════════════════════════════════════════════
    const $themeToggle = document.getElementById('theme-toggle');

    function updateThemeToggleLabel() {
      $themeToggle.textContent = isLightMode() ? 'Light' : 'Dark';
    }
    updateThemeToggleLabel();

    $themeToggle.addEventListener('click', () => {
      // Toggle: if currently light → force dark, if currently dark → force light.
      _modeOverride = isLightMode() ? 'dark' : 'light';
      lsSet(LS_MODE_KEY, _modeOverride);
      applyModeOverride();
      syncSceneBackground();
      updateThemeToggleLabel();
    });

    // If OS theme changes and no override is active, update button label.
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
      if (!_modeOverride) updateThemeToggleLabel();
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  CHART TYPE TOGGLE  (Candle → Line → Area → Candle …)
    // ══════════════════════════════════════════════════════════════════════════
    const CHART_TYPES = ['candle', 'line', 'area'];
    const CHART_TYPE_LABELS = { candle: 'Candle', line: 'Line', area: 'Area' };
    const LS_CHART_TYPE_KEY = 'sv.chartType';
    let _chartType = (function() {
      try { const v = localStorage.getItem(LS_CHART_TYPE_KEY); return CHART_TYPES.includes(v) ? v : 'candle'; }
      catch(_) { return 'candle'; }
    })();

    const $chartTypeToggle = document.getElementById('charttype-toggle');

    function broadcastChartType() {
      if (typeof billboards === 'undefined') return;
      for (const b of billboards) {
        if (!b || !b.interactive) continue;
        const el = b.element;
        if (!el || el.tagName !== 'IFRAME') continue;
        try { el.contentWindow.postMessage({ type: 'sv-charttype', chartType: _chartType }, '*'); }
        catch (_) {}
      }
    }

    function updateChartTypeLabel() {
      $chartTypeToggle.textContent = CHART_TYPE_LABELS[_chartType];
    }
    updateChartTypeLabel();

    $chartTypeToggle.addEventListener('click', () => {
      const idx = CHART_TYPES.indexOf(_chartType);
      _chartType = CHART_TYPES[(idx + 1) % CHART_TYPES.length];
      lsSet(LS_CHART_TYPE_KEY, _chartType);
      updateChartTypeLabel();
      broadcastChartType();
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  USER PREFERENCES — slider + reset-view wiring
    //
    //  The key definitions, default values, and lsSet/lsGet helpers live
    //  near the top of the script so the session-restore logic can reach them.
    //  Here we only wire the DOM elements to those helpers. Slider values
    //  are INTENTIONALLY not touched by the "Reset view" button, which is
    //  scoped to camera position/target only.
    // ══════════════════════════════════════════════════════════════════════════

    // Orbit-speed slider (lives inside the menu panel).
    const $speed    = document.getElementById('orbit-speed');
    const $speedVal = document.getElementById('orbit-speed-val');
    let _userRotateSpeed = 1.0;           // user's chosen base speed (for snap magnet)
    function applyOrbitSpeed(v, persist) {
      _userRotateSpeed        = v;
      controls.rotateSpeed    = v;
      $speed.value            = String(v);
      $speedVal.textContent   = v.toFixed(2);
      if (persist) lsSet(LS_ORBIT_SPEED_KEY, v);
    }
    $speed.addEventListener('input', () => {
      applyOrbitSpeed(parseFloat($speed.value), /*persist=*/true);
    });

    // Scroll-gain slider — controls OrbitControls.zoomSpeed, i.e. how many
    // world units the camera dollies per wheel tick.
    const $scroll    = document.getElementById('scroll-gain');
    const $scrollVal = document.getElementById('scroll-gain-val');
    function applyScrollGain(v, persist) {
      controls.zoomSpeed    = v;
      $scroll.value         = String(v);
      $scrollVal.textContent = v.toFixed(2);
      if (persist) lsSet(LS_SCROLL_GAIN_KEY, v);
    }
    $scroll.addEventListener('input', () => {
      applyScrollGain(parseFloat($scroll.value), /*persist=*/true);
    });


    // Restore saved preferences (or defaults) before the first render.
    // persist=false because we're replaying the stored value, not overwriting it.
    applyOrbitSpeed(lsGetNumber(LS_ORBIT_SPEED_KEY, DEFAULT_ORBIT_SPEED, 0.1, 3), false);
    applyScrollGain(lsGetNumber(LS_SCROLL_GAIN_KEY, DEFAULT_SCROLL_GAIN, 0.1, 3), false);

    // ══════════════════════════════════════════════════════════════════════════
    //  RESET VIEW
    //
    //  Restores the original camera position and orbit target. Billboards
    //  themselves sit at fixed world positions (a ring around the origin),
    //  so snapping the camera back to CAMERA_START_POS also snaps every
    //  billboard back to its initial screen position/size.
    //
    //  NOTE: the orbit-speed and scroll-gain sliders are NOT touched here —
    //  they are user preferences persisted across sessions in localStorage
    //  and must survive a view reset.
    // ══════════════════════════════════════════════════════════════════════════
    const $resetView = document.getElementById('reset-view');
    $resetView.addEventListener('click', () => {
      alignCameraToFirstBillboard();
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  CHAT DIALOG — giraffe opens; single button cycles expand → reduce → close
    // ══════════════════════════════════════════════════════════════════════════
    const $chatStateBtn = document.getElementById('chat-state-btn');
    const $chatBody     = document.getElementById('chat-body');
    let _chatExpanded   = false;
    // State 0 = closed, 1 = half-open, 2 = fully-open.
    // In states 1 and 2 the corner button always shows "×" and closes to 0.
    // State 1 → 2 transition is triggered exclusively by the per-row giraffe
    // button in the ticker list; there is no "+" expand affordance any more.
    let _chatBtnState = 0;

    function setChatBtnState(s) {
      _chatBtnState = s;
      $chatStateBtn.textContent = '×';
      $chatStateBtn.setAttribute('aria-label', 'Close chat');
    }

    document.getElementById('ticker-go').addEventListener('click', () => {
      document.body.classList.toggle('chat-open');
      _chatExpanded = false;
      document.body.classList.remove('chat-expanded');
      setChatBtnState(1);
      _lastTickerListGen = -1;
      _cameraDirty = true;
    });
    function closeChatContainer() {
      document.body.classList.remove('chat-open');
      document.body.classList.remove('chat-expanded');
      _chatExpanded = false;
      setChatBtnState(0);
      $chatBody.replaceChildren();
      // Reset chat-mode layout state on the ticker-list scroll container
      // so it can't linger under the now-hidden #ticker-list and affect
      // the bottom-center single-ticker overlay.
      $tickerListScroll.style.maxHeight = '';
      $tickerListScroll.style.minHeight = '';
      $tickerListScroll.classList.remove('scrollable');
      $tickerList.style.removeProperty('--ticker-row-scale');
      // Force the overlay visible so the single ticker row + giraffe
      // reappear immediately, without waiting for the next dirty frame.
      $overlayWrapper.classList.add('visible');
      _lastTickerListGen = -1;
      _cameraDirty = true;
    }

    $chatStateBtn.addEventListener('click', closeChatContainer);

    // Back button — state 2 → state 1. Collapses the detail view and
    // restores the scrollable ticker list.
    document.getElementById('chat-back-btn').addEventListener('click', () => {
      _chatExpanded = false;
      document.body.classList.remove('chat-expanded');
      $chatBody.replaceChildren();
      _lastTickerListGen = -1;
      _cameraDirty = true;
    });

    // Show/hide toggle for the state-1 ring-controls + ticker-input row.
    const LS_CHAT_BOTTOM_HIDDEN = 'sv.chatBottomHidden';
    const $chatBottomToggle = document.getElementById('chat-bottom-toggle');
    function applyChatBottomHidden(hidden) {
      document.body.classList.toggle('chat-bottom-hidden', hidden);
      $chatBottomToggle.textContent = hidden ? '▼' : '▲';
      $chatBottomToggle.title = hidden ? 'Show ring controls' : 'Hide ring controls';
    }
    try {
      applyChatBottomHidden(localStorage.getItem(LS_CHAT_BOTTOM_HIDDEN) === '1');
    } catch (_) { applyChatBottomHidden(false); }
    $chatBottomToggle.addEventListener('click', () => {
      const hidden = !document.body.classList.contains('chat-bottom-hidden');
      applyChatBottomHidden(hidden);
      lsSet(LS_CHAT_BOTTOM_HIDDEN, hidden ? '1' : '0');
      // Row visibility change → available space for ticker list changes,
      // so force a rebuild that recomputes the scroll clamp.
      _lastTickerListGen = -1;
      _cameraDirty = true;
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  TOP PERIOD BAR
    //
    //  Controls every billboard's time window at once. Click a button → we
    //  update the local active state and broadcast {type:'sv-period', period}
    //  directly to every chart iframe. The period-sync hub above forwards any
    //  iframe-initiated period change (wheel zoom inside a chart) to the others,
    //  AND we listen for those here so the top-bar highlight stays in sync.
    // ══════════════════════════════════════════════════════════════════════════
    // PERIODS was declared up near the session-restore block so the
    // cache-replay logic can reach it. currentPeriod starts at whatever
    // the session restore decided (URL query or cached value or default).
    let currentPeriod = initialPeriod;

    const $periodRow = document.getElementById('period-row');
    const periodButtons = {};
    PERIODS.forEach(p => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pbtn';
      btn.textContent = p.toUpperCase();
      btn.dataset.period = p;
      btn.addEventListener('click', () => setGlobalPeriod(p, /*fromBroadcast=*/false));
      $periodRow.appendChild(btn);
      periodButtons[p] = btn;
    });

    function updatePeriodHighlight() {
      for (const p of PERIODS) {
        periodButtons[p].classList.toggle('active', p === currentPeriod);
      }
    }
    updatePeriodHighlight();

    function broadcastPeriodToAll(p) {
      for (const b of billboards) {
        if (!b.interactive) continue;
        try {
          b.element.contentWindow.postMessage({ type: 'sv-period', period: p }, '*');
        } catch (_) { /* same-origin safety net */ }
      }
    }

    // Stale-while-revalidate period change.
    //
    //   Phase 1 (mode=swr):  one DB-only request returns whatever's already
    //                        cached. Iframes render INSTANTLY — no spinner,
    //                        no yfinance roundtrip. Tickers absent from the
    //                        response had nothing in the cache.
    //   Phase 2 (mode=fresh): for every ticker that was either missing or
    //                        flagged stale=true, do a normal batched yfinance
    //                        fetch and re-render those iframes silently.
    //
    // First-ever load of a (ticker, period) goes straight through phase 2 with
    // a spinner — there's no cached frame to render. Subsequent visits feel
    // instant because phase 1 hits the cache.
    //
    // `excludeWindow`: if the period change originated from a chart iframe
    // (wheel-zoom inside it), that iframe already has the data — skip it.
    async function broadcastPeriodWithBatch(p, excludeWindow) {
      const targets = billboards.filter(b =>
        b.interactive && b.ticker && b.element.contentWindow !== excludeWindow);
      if (targets.length === 0) return;
      const tickers = [...new Set(targets.map(b => b.ticker))];
      const baseUrl = `/api/data_batch?tickers=${encodeURIComponent(tickers.join(','))}`
                    + `&period=${encodeURIComponent(p)}`;

      // Track which tickers still need a fresh fetch after phase 1.
      let needFresh = new Set(tickers);

      try {
        const res  = await fetch(baseUrl + '&mode=swr');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const blob = await res.json();
        if (blob && blob.tickers) {
          for (const b of targets) {
            const data = blob.tickers[b.ticker];
            if (!data) continue;             // SWR miss — keep in needFresh
            // Render cached frame immediately.
            try {
              b.element.contentWindow.postMessage(
                { type: 'sv-period-with-data', period: p, data }, '*');
            } catch (_) { /* cross-origin safety net */ }
            if (!data.stale) needFresh.delete(b.ticker);
          }
        }
      } catch (_) { /* phase-1 failure → fall through to phase-2 for everyone */ }

      if (needFresh.size === 0) return;

      try {
        const url2  = `/api/data_batch?tickers=${encodeURIComponent([...needFresh].join(','))}`
                    + `&period=${encodeURIComponent(p)}`;
        const res2  = await fetch(url2);
        if (!res2.ok) throw new Error(`HTTP ${res2.status}`);
        const blob2 = await res2.json();
        if (!blob2 || !blob2.tickers) return;
        for (const b of targets) {
          if (!needFresh.has(b.ticker)) continue;
          const data = blob2.tickers[b.ticker];
          if (!data) continue;
          try {
            b.element.contentWindow.postMessage(
              { type: 'sv-period-with-data', period: p, data }, '*');
          } catch (_) { /* cross-origin safety net */ }
        }
      } catch (_) {
        // Phase-2 failure: tell the iframes the period at least, so they can
        // try their own fetch (loadChart) as a last-resort fallback.
        for (const b of targets) {
          if (!needFresh.has(b.ticker)) continue;
          try {
            b.element.contentWindow.postMessage({ type: 'sv-period', period: p }, '*');
          } catch (_) { /* same-origin safety net */ }
        }
      }
    }

    function setGlobalPeriod(p, fromBroadcast) {
      if (!PERIODS.includes(p) || p === currentPeriod) return;
      currentPeriod = p;
      updatePeriodHighlight();
      if (!fromBroadcast) broadcastPeriodWithBatch(p, /*excludeWindow=*/null);
      persistSession();
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  TICKER INPUT (bound to the billboard closest to the camera)
    //
    //  Every animation frame we find the closest interactive billboard and,
    //  unless the user is currently typing in the input, reflect that
    //  billboard's ticker in the input box. Clicking Go (or pressing Enter)
    //  resolves the entered text via /api/resolve (falling back to the raw
    //  upper-cased text) and rewrites the closest billboard's iframe src so
    //  it loads the new ticker at the current period.
    // ══════════════════════════════════════════════════════════════════════════
    const $tickerInput   = document.getElementById('ticker-input');
    const $tickerGoBtn   = document.getElementById('ticker-go-btn');
    const $tickerSortBtn = document.getElementById('ticker-sort-btn');
    const $tickerSortMode = $tickerSortBtn.querySelector('.tsb-mode');

    // Sync the sort-button glyph with `_sortMode`. "%" is the default mode
    // (user-input order, clicking swaps to percentage sort); "T" signals the
    // opposite — clicking swaps back to the ticker/user-input order.
    function syncSortButton() {
      $tickerSortMode.textContent = (_sortMode === 'percent') ? 'T' : '%';
      $tickerSortBtn.title = (_sortMode === 'percent')
        ? 'Sorted by entry-price percentage — click to restore user order'
        : 'Sorted by user input — click to sort by entry-price percentage';
    }
    syncSortButton();

    $tickerSortBtn.addEventListener('click', () => {
      _sortMode = (_sortMode === 'percent') ? 'default' : 'percent';
      try { localStorage.setItem(LS_SORT_MODE_KEY, _sortMode); } catch (_) {}
      syncSortButton();
      // Force a full rebuild on the next updatePriceOverlay tick. The render
      // loop gates updatePriceOverlay behind _cameraDirty, so flip that too
      // to actually fire an overlay refresh after the toggle.
      _lastTickerListGen = -1;
      _lastSortSig       = '';
      _cameraDirty       = true;
    });

    // Set by updateBillboardProjection — reused by refreshTickerInput
    // to avoid iterating billboards twice.
    let _closestInteractive = null;

    function findClosestInteractiveBillboard() {
      return _closestInteractive;
    }

    let _lastClosestBillboard = null;
    function refreshTickerInput() {
      // Don't clobber what the user is currently typing.
      if (document.activeElement === $tickerInput) return;
      const b = _closestInteractive;
      if (b === _lastClosestBillboard) return;
      _lastClosestBillboard = b;
      $tickerInput.value = b ? b.ticker : '';
    }

    async function runTickerUpdate() {
      const raw = $tickerInput.value.trim();
      if (!raw) return;
      // Try to resolve company names / fuzzy input to a real ticker. Fall
      // back to the raw upper-cased string if the resolve endpoint fails.
      let ticker = raw.toUpperCase();
      try {
        const res = await fetch(`/api/resolve?q=${encodeURIComponent(raw)}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.ticker) ticker = String(data.ticker).toUpperCase();
        }
      } catch (_) { /* network blip — use raw uppercased */ }

      const target = findClosestInteractiveBillboard();
      if (!target) return;
      target.ticker = ticker;
      // User typed this in → always manual (wins over any prior 'auto').
      markTickerManual(ticker);
      // Rewrite the iframe src so the chart reloads with the new ticker at
      // the current global period.
      target.element.src =
        `${CHART_URL}?ticker=${encodeURIComponent(ticker)}`
      + `&period=${encodeURIComponent(currentPeriod)}`;
      $tickerInput.value = ticker;
      $tickerInput.blur();
      // Force the next refresh to re-apply (avoids a stale cache match).
      _lastClosestBillboard = null;
      _lastTickerListGen = -1;   // refresh .tl-ticker source class
      _cameraDirty = true;
      persistSession();
    }

    $tickerGoBtn.addEventListener('click', runTickerUpdate);

    // ─── Ticker autocomplete ─────────────────────────────────────────────
    // Debounced /api/search-powered suggest box. Matches against both the
    // symbol and company name (Yahoo Finance search covers both).
    const $tickerSuggest = document.createElement('ul');
    $tickerSuggest.id = 'ticker-suggest';
    document.body.appendChild($tickerSuggest);

    let _suggestTimer  = 0;
    let _suggestReqId  = 0;
    let _suggestItems  = [];
    let _suggestActive = -1;
    const SUGGEST_DEBOUNCE_MS  = 150;
    const SUGGEST_MAX_ITEMS    = 8;
    // Minimum query length before we hit the network. Keeps per-keystroke
    // traffic low — important for providers with tight rate limits
    // (Twelve Data's free tier is 8 req/min) and for not spamming Yahoo.
    const SUGGEST_MIN_CHARS    = 2;
    // In-memory response cache (Map iteration order = insertion order, so
    // evicting the oldest key gives us a cheap LRU). Ticker/company name
    // mappings are very stable, so a day-long TTL is fine.
    const SUGGEST_CACHE_MAX    = 128;
    const SUGGEST_CACHE_TTL_MS = 24 * 60 * 60 * 1000;
    const _suggestCache        = new Map();
    function suggestCacheGet(q) {
      const key = q.toLowerCase();
      const hit = _suggestCache.get(key);
      if (!hit) return null;
      if (Date.now() - hit.t > SUGGEST_CACHE_TTL_MS) { _suggestCache.delete(key); return null; }
      _suggestCache.delete(key);        // re-insert to bump LRU position
      _suggestCache.set(key, hit);
      return hit.items;
    }
    function suggestCacheSet(q, items) {
      const key = q.toLowerCase();
      if (_suggestCache.size >= SUGGEST_CACHE_MAX) {
        _suggestCache.delete(_suggestCache.keys().next().value);
      }
      _suggestCache.set(key, { items, t: Date.now() });
    }

    function hideSuggest() {
      $tickerSuggest.classList.remove('visible');
      _suggestItems  = [];
      _suggestActive = -1;
    }

    function positionSuggest() {
      const r = $tickerInput.getBoundingClientRect();
      $tickerSuggest.style.left  = r.left + 'px';
      $tickerSuggest.style.width = r.width + 'px';
      // Prefer dropping below; flip to above if there isn't enough room.
      const spaceBelow = window.innerHeight - r.bottom;
      const spaceAbove = r.top;
      if (spaceBelow < 120 && spaceAbove > spaceBelow) {
        $tickerSuggest.style.top       = 'auto';
        $tickerSuggest.style.bottom    = (window.innerHeight - r.top + 2) + 'px';
        $tickerSuggest.style.maxHeight = Math.max(60, Math.min(240, spaceAbove - 8)) + 'px';
      } else {
        $tickerSuggest.style.bottom    = 'auto';
        $tickerSuggest.style.top       = (r.bottom + 2) + 'px';
        $tickerSuggest.style.maxHeight = Math.max(60, Math.min(240, spaceBelow - 8)) + 'px';
      }
    }

    function setSuggestActive(i) {
      const n = _suggestItems.length;
      if (n === 0) { _suggestActive = -1; return; }
      _suggestActive = ((i % n) + n) % n;
      const lis = $tickerSuggest.querySelectorAll('li');
      lis.forEach((el, idx) => el.classList.toggle('active', idx === _suggestActive));
      const activeEl = lis[_suggestActive];
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
    }

    function commitSuggest(item) {
      $tickerInput.value = item.symbol;
      hideSuggest();
      runTickerUpdate();
    }

    function renderSuggest(items) {
      _suggestItems  = items;
      _suggestActive = -1;
      $tickerSuggest.replaceChildren();
      for (const it of items) {
        const li   = document.createElement('li');
        const sym  = document.createElement('span'); sym.className  = 'ts-sym';  sym.textContent  = it.symbol;
        const name = document.createElement('span'); name.className = 'ts-name'; name.textContent = it.name || '';
        li.append(sym, name);
        // mousedown (not click) so we fire before the input blurs.
        li.addEventListener('mousedown', (ev) => { ev.preventDefault(); commitSuggest(it); });
        $tickerSuggest.appendChild(li);
      }
      if (items.length === 0) { hideSuggest(); return; }
      positionSuggest();
      $tickerSuggest.classList.add('visible');
    }

    async function fetchSuggest(q) {
      const cached = suggestCacheGet(q);
      if (cached) { renderSuggest(cached); return; }
      const myId = ++_suggestReqId;
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        if (!res.ok) return;
        const data  = await res.json();
        const items = Array.isArray(data) ? data.slice(0, SUGGEST_MAX_ITEMS) : [];
        suggestCacheSet(q, items);
        if (myId !== _suggestReqId) return;   // stale response — a newer query raced past us
        renderSuggest(items);
      } catch (_) { /* network blip — leave previous state alone */ }
    }

    $tickerInput.addEventListener('input', () => {
      const q = $tickerInput.value.trim();
      clearTimeout(_suggestTimer);
      if (q.length < SUGGEST_MIN_CHARS) { hideSuggest(); return; }
      _suggestTimer = setTimeout(() => fetchSuggest(q), SUGGEST_DEBOUNCE_MS);
    });
    $tickerInput.addEventListener('blur', () => {
      // Delay so a mousedown-based item click still commits before we hide.
      setTimeout(hideSuggest, 120);
    });
    $tickerInput.addEventListener('keydown', (ev) => {
      const open = $tickerSuggest.classList.contains('visible');
      if (ev.key === 'ArrowDown' && open) {
        ev.preventDefault();
        setSuggestActive(_suggestActive + 1);
      } else if (ev.key === 'ArrowUp' && open) {
        ev.preventDefault();
        setSuggestActive(_suggestActive - 1);
      } else if (ev.key === 'Escape' && open) {
        ev.preventDefault();
        hideSuggest();
      } else if (ev.key === 'Enter') {
        ev.preventDefault();
        if (open && _suggestActive >= 0) commitSuggest(_suggestItems[_suggestActive]);
        else { hideSuggest(); runTickerUpdate(); }
      }
    });
    // Reposition on scroll/resize while visible.
    window.addEventListener('resize', () => {
      if ($tickerSuggest.classList.contains('visible')) positionSuggest();
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  RING SIZE CONTROLS  (+  /  −)
    //
    //  "+"  adds a new interactive billboard at the position closest to the
    //       camera along the ring, then redistributes every ring billboard
    //       evenly around the circle so one slot always faces the camera.
    //  "−"  removes whichever ring billboard is currently closest to the
    //       camera, then redistributes the rest evenly.
    //  Bounds: ring size is clamped to [1, 100].
    //
    //  "Closest to the camera" here means at the angle on the ring that
    //  minimizes distance to the camera: atan2(camera.z, camera.x) in the XZ
    //  plane (the analytic solution for a point on a radius-R circle).
    // ══════════════════════════════════════════════════════════════════════════
    const RING_MIN = 1;
    const RING_MAX = Infinity;

    function getRingBillboards() {
      return billboards.filter(b => b !== centerBillboard);
    }

    function findClosestRingBillboard() {
      let best = null, bestD = Infinity;
      for (const b of billboards) {
        if (b === centerBillboard) continue;
        const d = b.worldPos.distanceTo(camera.position);
        if (d < bestD) { bestD = d; best = b; }
      }
      return best;
    }

    /**
     * Redistribute every ring billboard evenly around circleRadius centred
     * on ringCenter so that slot 0 sits at the angle on the ring closest
     * to the camera. If `priority` is given and is a ring billboard, it is
     * placed at slot 0; the rest keep their existing relative order and
     * fill slots 1..n-1.
     */
    function recomputeRingPositions(priority) {
      const ring = getRingBillboards();
      const n = ring.length;
      if (n === 0) return;

      let ordered;
      if (priority && ring.includes(priority)) {
        ordered = [priority, ...ring.filter(b => b !== priority)];
      } else {
        ordered = ring;
      }

      // Angle from ring center to camera (XZ plane).
      const cameraAngle = Math.atan2(
        camera.position.z - ringCenter.z,
        camera.position.x - ringCenter.x
      );
      for (let i = 0; i < n; i++) {
        const angle = cameraAngle + (i / n) * Math.PI * 2;
        ordered[i].worldPos.set(
          ringCenter.x + Math.cos(angle) * circleRadius,
          0,
          ringCenter.z + Math.sin(angle) * circleRadius,
        );
      }
    }

    /**
     * Create a fresh interactive iframe with no ticker and add it to the
     * ring. The resulting billboard is placed at slot 0 (closest to camera).
     * No-op when already at RING_MAX.
     */
    function addClosestRingBillboard() {
      const ring = getRingBillboards();
      if (ring.length >= RING_MAX) return;
      const iframe = document.createElement('iframe');
      iframe.className   = 'chart-frame';
      // No ticker param → template shows an empty chart. The user can fill
      // it via the ticker input beside this button.
      iframe.src         = `${CHART_URL}?period=${encodeURIComponent(currentPeriod)}`;
      iframe.style.width  = IFRAME_WIDTH_PX  + 'px';
      iframe.style.height = IFRAME_HEIGHT_PX + 'px';
      iframe.setAttribute('allow', 'fullscreen');
      iframe.setAttribute('loading', 'eager');
      attachFocusSanitizer(iframe);
      iframe.addEventListener('load', () => {
        try { iframe.contentWindow.postMessage({ type: 'sv-mode', light: isLightMode() }, '*'); } catch (_) {}
        try { iframe.contentWindow.postMessage({ type: 'sv-detail', show: false }, '*'); } catch (_) {}
      }, { once: true });
      iframe.style.display = 'none';  // hidden until the next projection frame
      billboardsLayer.appendChild(iframe);
      const markerEl = makeMarkerElement();
      billboardsLayer.appendChild(markerEl);
      const b = {
        element:     iframe,
        worldPos:    new THREE.Vector3(),
        interactive: true,
        ticker:      '',
        markerEl,
        markerText:  '',
        _markerTicker: null,
      };
      billboards.push(b);
      // Expand ring geometry if crossing the threshold (radius + center shift).
      adjustRingGeometry(ring.length + 1);
      recomputeRingPositions(b);
      _lastClosestBillboard = null;   // force ticker input to refresh
      _cameraDirty = true;            // immediate visual update
      updateRingButtonState();
      persistSession();
    }

    /**
     * Remove whichever ring billboard is currently closest to the camera,
     * then redistribute the survivors. No-op when already at RING_MIN.
     */
    function removeClosestRingBillboard() {
      const ring = getRingBillboards();
      if (ring.length <= RING_MIN) return;
      const target = findClosestRingBillboard();
      if (!target) return;
      // Detach from the DOM and splice from the master billboards array.
      if (target.element && target.element.parentNode) {
        target.element.parentNode.removeChild(target.element);
      }
      if (target.markerEl && target.markerEl.parentNode) {
        target.markerEl.parentNode.removeChild(target.markerEl);
      }
      const idx = billboards.indexOf(target);
      if (idx >= 0) billboards.splice(idx, 1);
      if (_lastClosestBillboard === target) _lastClosestBillboard = null;
      // Shrink ring geometry if still above the threshold (radius + center shift).
      adjustRingGeometry(ring.length - 1);
      recomputeRingPositions();
      _cameraDirty = true;            // immediate visual update
      updateRingButtonState();
      persistSession();
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  RING SWAP  (←  /  →)
    //
    //  Swap the closest ring billboard (T, the "ticker billboard") with its
    //  screen-left or screen-right neighbor on the ring, then rotate the
    //  camera around the Y axis by the same angle T moved so T stays
    //  horizontally centered on screen — i.e. T remains closest to the
    //  camera after the swap.
    //
    //  "Screen-left" / "screen-right" is computed by projecting the two
    //  ring-adjacent billboards onto the camera's world-space right vector:
    //  the one with a more negative dot product is on the left, the more
    //  positive one is on the right. This is robust to any camera yaw.
    //
    //  Net visual effect: T stays front-and-center, the whole scene appears
    //  to rotate by one slot, and the ring-ordering of tickers has shifted
    //  one step in the clicked direction. The arrow buttons are disabled
    //  while the ring contains fewer than 2 billboards (nothing to swap).
    // ══════════════════════════════════════════════════════════════════════════
    const _swapTmpA   = new THREE.Vector3();
    const _swapTmpB   = new THREE.Vector3();
    const _swapRight  = new THREE.Vector3();
    const _swapOffset = new THREE.Vector3();
    const _yAxis      = new THREE.Vector3(0, 1, 0);

    function swapRingNeighbor(direction) {
      // direction = -1 (left arrow) or +1 (right arrow)
      const ring = getRingBillboards();
      if (ring.length < 2) return;

      const T = findClosestRingBillboard();
      if (!T) return;

      // Sort the ring by angle around the ring center (XZ plane). Because
      // recomputeRingPositions always lays billboards on an evenly spaced
      // circle — and swaps only shuffle which billboard occupies which
      // slot — the angle-sorted order is always the true ring-neighbor order.
      const sorted = ring.slice().sort(
        (a, b) =>
          Math.atan2(a.worldPos.z - ringCenter.z, a.worldPos.x - ringCenter.x) -
          Math.atan2(b.worldPos.z - ringCenter.z, b.worldPos.x - ringCenter.x)
      );
      const n    = sorted.length;
      const tIdx = sorted.indexOf(T);
      const prev = sorted[(tIdx - 1 + n) % n];
      const next = sorted[(tIdx + 1) % n];

      // Project each candidate onto the camera's world-space +X vector to
      // decide which is screen-left and which is screen-right of T.
      _swapRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
      const prevDot = _swapTmpA.subVectors(prev.worldPos, T.worldPos).dot(_swapRight);
      const nextDot = _swapTmpB.subVectors(next.worldPos, T.worldPos).dot(_swapRight);

      // screen-left  = more negative dot   (direction = -1)
      // screen-right = more positive dot   (direction = +1)
      const wantLeft = (direction < 0);
      let neighbor;
      if (prev === next) {
        // Ring of size 2 — there's only one "other" billboard; both
        // buttons act on the same target.
        neighbor = prev;
      } else if (wantLeft) {
        neighbor = (prevDot < nextDot) ? prev : next;
      } else {
        neighbor = (prevDot > nextDot) ? prev : next;
      }

      // Capture T's and neighbor's old angles (relative to ring center)
      // BEFORE mutating worldPos — the camera rotation delta is derived
      // from these, not from the camera's current angle.
      const tOldAngle = Math.atan2(
        T.worldPos.z - ringCenter.z, T.worldPos.x - ringCenter.x);
      const nOldAngle = Math.atan2(
        neighbor.worldPos.z - ringCenter.z, neighbor.worldPos.x - ringCenter.x);

      // Swap the two world positions. All other billboards stay put.
      _swapTmpA.copy(T.worldPos);
      T.worldPos.copy(neighbor.worldPos);
      neighbor.worldPos.copy(_swapTmpA);

      // Rotate the camera so that its own atan2(z,x) angle follows T
      // from tOldAngle to nOldAngle. Three.js's applyAxisAngle(+Y, α)
      // rotates a point right-hand-rule around +Y, which DECREASES its
      // atan2(z,x) angle by α — so the rotation amount we pass is
      // (tOldAngle - nOldAngle), not the reverse. Wrap into [-π, π] to
      // always pick the short way around.
      let delta = tOldAngle - nOldAngle;
      if (delta >  Math.PI) delta -= 2 * Math.PI;
      if (delta < -Math.PI) delta += 2 * Math.PI;

      _swapOffset.subVectors(camera.position, controls.target);
      _swapOffset.applyAxisAngle(_yAxis, delta);
      camera.position.copy(controls.target).add(_swapOffset);
      // Flush any residual damping so the new orientation is instant.
      controls.update();

      // T is still the closest to the camera (we moved the camera to
      // follow), but _lastClosestBillboard may be stale via object identity
      // comparisons that compare positions too — force a refresh anyway.
      _lastClosestBillboard = null;

      _lastTickerListGen = -1;
      _cameraDirty       = true;

      persistSession();
    }

    const $ringLeft  = document.getElementById('ring-left');
    const $ringMinus = document.getElementById('ring-minus');
    const $ringPlus  = document.getElementById('ring-plus');
    const $ringRight = document.getElementById('ring-right');

    function updateRingButtonState() {
      const n = getRingBillboards().length;
      $ringMinus.disabled = (n <= RING_MIN);
      $ringPlus .disabled = (n >= RING_MAX);
      // Nothing to swap with unless there are at least 2 ring billboards.
      const canSwap = (n >= 2);
      $ringLeft .disabled = !canSwap;
      $ringRight.disabled = !canSwap;
    }

    $ringPlus .addEventListener('click', addClosestRingBillboard);
    $ringMinus.addEventListener('click', removeClosestRingBillboard);
    $ringLeft .addEventListener('click', () => swapRingNeighbor(-1));
    $ringRight.addEventListener('click', () => swapRingNeighbor(+1));
    updateRingButtonState();

    // Write the freshly-resolved initial session (URL query ∪ cache) back to
    // localStorage. On a URL-launch this promotes the URL params into the
    // cache so the next blank launch restores them. On a blank-launch this
    // is a no-op overwrite.
    persistSession();

    // Safety-net: flush session state when the tab closes. Every user-driven
    // mutation already calls persistSession(), so this is belt-and-braces for
    // any in-flight state (e.g. a pending ticker edit that hasn't committed).
    window.addEventListener('beforeunload', () => { try { persistSession(); } catch (_) {} });

    // ══════════════════════════════════════════════════════════════════════════
    //  ZOOM CLAMP — keep a background margin around every billboard
    //
    //  OrbitControls' minDistance clamps distance-to-target, not
    //  distance-to-nearest-billboard. Since the ring billboards sit 7 units
    //  from the origin, the camera can still get arbitrarily close to one of
    //  them even while respecting minDistance. If it does, the billboard's
    //  rendered size balloons and the iframe fills the whole screen, leaving
    //  no background pixels under the cursor — the user can no longer right-
    //  click-drag to orbit or scroll-wheel to zoom out.
    //
    //  Approach: for a given camera view direction (unit vector v from the
    //  orbit target), find the smallest camera-to-target radius r such that
    //  EVERY billboard is at least dMinRequired away from the camera. This
    //  is the minimum orbit radius along the current view ray.
    //
    //  Geometry: camera at target + r*v, billboard offset d_p = billboard - target.
    //  Distance² = |r*v - d_p|² = r² − 2r(v·d_p) + |d_p|². We need this ≥ dMin².
    //    r² − 2r(v·d_p) + (|d_p|² − dMin²) ≥ 0
    //  Upward parabola in r, roots at r = (v·d_p) ± √((v·d_p)² − |d_p|² + dMin²).
    //  The "safe far side" root is r_high = dot + √disc; if disc ≤ 0 the
    //  billboard is always far enough regardless of r. Take max(r_high) over
    //  all billboards and clamp to [MIN_ORBIT_DISTANCE, MAX_ORBIT_DISTANCE].
    //
    //  Called from the animation loop, so both wheel-driven dolly and
    //  right-click orbit into a tighter configuration push the camera out
    //  whenever it would otherwise let a billboard fill the screen.
    // ══════════════════════════════════════════════════════════════════════════
    const BILLBOARD_MAX_SCREEN_FRAC = 0.85; // billboard may fill ≤ 85% of each axis

    // Cached viewport / FOV derived values — recomputed only on resize.
    let _vpW = window.innerWidth;
    let _vpH = window.innerHeight;
    let _halfFovTan = Math.tan(camera.fov * Math.PI / 360);
    let _scaleNumerator = BILLBOARD_SCALE * _vpH / (2 * _halfFovTan);
    let _cachedMarginDMin = 0;

    function recomputeViewportCache() {
      _vpW = window.innerWidth;
      _vpH = window.innerHeight;
      _halfFovTan = Math.tan(camera.fov * Math.PI / 360);
      _scaleNumerator = BILLBOARD_SCALE * _vpH / (2 * _halfFovTan);
      _cachedMarginDMin = Math.max(
        (IFRAME_WIDTH_PX  * BILLBOARD_SCALE * _vpH) /
        (2 * _vpW * BILLBOARD_MAX_SCREEN_FRAC * _halfFovTan),
        (IFRAME_HEIGHT_PX * BILLBOARD_SCALE * _vpH) /
        (2 * _vpH * BILLBOARD_MAX_SCREEN_FRAC * _halfFovTan)
      );
    }
    recomputeViewportCache();

    function computeMarginDMin() {
      return _cachedMarginDMin;
    }

    const _viewDir = new THREE.Vector3();
    const _offset  = new THREE.Vector3();

    function computeEnforcedMinRadius() {
      _viewDir.subVectors(camera.position, controls.target);
      const viewLen = _viewDir.length();
      if (viewLen < 1e-6) return getMinOrbitDistance();
      _viewDir.multiplyScalar(1 / viewLen);

      const dMin    = computeMarginDMin();
      const dMinSq  = dMin * dMin;

      let minR = getMinOrbitDistance();
      for (const b of billboards) {
        _offset.subVectors(b.worldPos, controls.target);
        const dot    = _viewDir.dot(_offset);
        const offLen = _offset.lengthSq();
        const disc   = dot * dot - offLen + dMinSq;
        if (disc <= 0) continue;                 // always safe regardless of r
        const rHigh = dot + Math.sqrt(disc);     // minimum safe r for this billboard
        if (rHigh > minR) minR = rHigh;
      }
      return Math.min(controls.maxDistance, minR);
    }

    function enforceBillboardMargin() {
      const enforcedMin = computeEnforcedMinRadius();
      _viewDir.subVectors(camera.position, controls.target);
      const curR = _viewDir.length();
      if (curR < 1e-6) return;
      if (curR >= enforcedMin) return;
      _viewDir.multiplyScalar(1 / curR);
      camera.position.copy(controls.target).addScaledVector(_viewDir, enforcedMin);
      _cameraDirty = true;              // camera was pushed — need another render
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  BILLBOARD PROJECTOR
    //
    //  For each billboard:
    //    1. Project its fixed world position into normalized device coords
    //       via camera.projectionMatrix × camera.matrixWorldInverse.
    //    2. If it's behind the camera or outside the near/far clip, hide it.
    //    3. Convert NDC to screen pixels and write to element.style.left/top.
    //    4. Compute the perspective-correct scale so a 1-world-unit object
    //       appears at its proper on-screen size, then apply as a plain 2D
    //       translate(-50%,-50%) + scale(s) transform.
    //    5. Assign zIndex by distance so closer billboards paint on top.
    //
    //  Because the final transform is 2D only, each iframe's hit-box equals
    //  its visible rectangle — no CSS3D AABB leakage, no pointer-event
    //  crosstalk between billboards regardless of camera angle.
    // ══════════════════════════════════════════════════════════════════════════
    const _ndc = new THREE.Vector3();
    function updateBillboardProjection() {

      // Track sort order for zIndex. Farthest gets lowest zIndex.
      const ordered = billboards
        .map((b, i) => ({ b, i, d: b.worldPos.distanceTo(camera.position) }))
        .sort((a, b) => b.d - a.d);

      // Find closest interactive billboard (last in distance-descending order).
      _closestInteractive = null;
      for (let i = ordered.length - 1; i >= 0; i--) {
        if (ordered[i].b.interactive) { _closestInteractive = ordered[i].b; break; }
      }
      // While a row-click / giraffe-click rotation is in flight, the clicked
      // billboard hasn't yet become geometrically closest — but the UI
      // (overlay, state-2 detail, .closest row) must reflect the user's intent
      // immediately. Override until _clickOrbitTarget is cleared by the
      // rotation loop.
      if (_clickOrbitTarget && _clickOrbitTarget.interactive) {
        _closestInteractive = _clickOrbitTarget;
      }

      for (let rank = 0; rank < ordered.length; rank++) {
        const { b, d } = ordered[rank];
        const el = b.element;

        // Project world position → NDC
        _ndc.copy(b.worldPos).project(camera);
        // project() returns (x,y in [-1,1], z in [-1,1] when in front; >1 means
        // behind camera or past the far plane)
        const inFront = _ndc.z > -1 && _ndc.z < 1;
        if (!inFront) {
          if (el.style.display !== 'none') el.style.display = 'none';
          if (b.markerEl && b.markerEl.style.display !== 'none') {
            b.markerEl.style.display = 'none';
          }
          continue;
        }
        if (el.style.display === 'none') el.style.display = '';

        const sx = ( _ndc.x * 0.5 + 0.5) * _vpW;
        const sy = (-_ndc.y * 0.5 + 0.5) * _vpH;
        const scale = _scaleNumerator / d;

        el.style.left      = sx + 'px';
        el.style.top       = sy + 'px';
        el.style.transform = `translate(-50%, -50%) scale(${scale})`;
        el.style.zIndex    = String(rank + 1);

        // Hide thin 1px lines (grid, scale borders, iframe border) when small
        if (b.interactive) {
          const show = (IFRAME_HEIGHT_PX * scale) >= _vpH * 0.75;
          if (b._detail !== show) {
            b._detail = show;
            el.classList.toggle('no-detail', !show);
            try { el.contentWindow.postMessage({ type: 'sv-detail', show }, '*'); } catch (_) {}
          }
        }

        // Marker billboard — anchored to the chart's top-left corner in screen
        // space. Only shown when the linked ticker has non-empty marker text.
        if (b.markerEl) {
          syncBillboardMarker(b);
          if (!b.markerText) {
            if (b.markerEl.style.display !== 'none') b.markerEl.style.display = 'none';
          } else {
            // Anchor at the chart's top-left corner in screen space. We use
            // transform-origin: 0 0 (top-left) and a pure scale, then offset
            // `top` by the marker's own scaled height so its bottom edge lands
            // exactly on the chart's top edge. This avoids the subpixel jitter
            // that percentage-based translates can introduce when the reference
            // box size varies per marker.
            const mx  = sx - (IFRAME_WIDTH_PX  * 0.5) * scale;
            const chartTop = sy - (IFRAME_HEIGHT_PX * 0.5) * scale;
            // offsetHeight reads un-transformed height — cheap, and we need a
            // fresh read because the marker's height can change when text wraps
            // near the max-width boundary or when the class list toggles. Show
            // the element first (needed for offsetHeight to be non-zero).
            if (b.markerEl.style.display !== 'block') b.markerEl.style.display = 'block';
            const mh = b.markerEl.offsetHeight;
            b.markerEl.style.left      = mx + 'px';
            b.markerEl.style.top       = (chartTop - mh * scale) + 'px';
            b.markerEl.style.transform = `scale(${scale})`;
            b.markerEl.style.zIndex    = String(rank + 1);
          }
        }

      }

    }

    // ══════════════════════════════════════════════════════════════════════════
    //  SNAP MAGNET — slow the orbit when the closest billboard is near the
    //  horizontal center and large enough to read.
    //
    //  Works by modulating controls.rotateSpeed BEFORE controls.update() so
    //  OrbitControls itself applies the damping naturally — no camera.position
    //  hacks that fight its internal spherical state.
    //
    //  rotateSpeed is lerped from _userRotateSpeed (edge of zone) down to
    //  SNAP_MIN_FACTOR × _userRotateSpeed (zone center). Outside the zone or
    //  when the billboard is small, full speed is restored.
    // ══════════════════════════════════════════════════════════════════════════
    const SNAP_NDC_ZONE    = 0.55;  // snap engages when |ndc.x| < this
    const SNAP_MIN_FACTOR  = 0.12;  // at zone center, speed = 12% of user speed
    const SNAP_SIZE_THRESH = 0.30;  // billboard apparent height ≥ 30% of viewport
    const _snapNdc         = new THREE.Vector3();

    // Click-to-orbit: when a ticker row is clicked, rotate the camera around
    // ringCenter until the billboard lands on the desired screen position —
    // dead-centre (NDC x = 0) when chat is closed, or shifted into the
    // visible left 2/3 (NDC x = -1/3) when chat is half- or fully-open.
    // Fast exponential lerp so the motion completes in ~100 ms.
    const _clickOrbitOffset = new THREE.Vector3();

    // Solve for the camera orbit angle C such that the billboard at angle A,
    // ringCenter-radius R_bb, appears at target horizontal NDC x_ndc, from a
    // camera at ringCenter-radius R_cam.
    //
    // Derivation: with camera looking at ringCenter, billboard at angle A,
    //   tan θ = R_bb · sin(C − A) / (R_cam − R_bb · cos(C − A))
    // where θ is the billboard's horizontal angle off the camera view axis,
    // and x_ndc = tan θ / tan(FOV_h/2). Setting τ = x_ndc · tan(FOV_h/2):
    //   sin δ + τ cos δ = τ · R_cam / R_bb    with δ = C − A
    // which resolves to δ = asin(r / √(1+τ²)) − atan(τ),  r = τ·R_cam/R_bb.
    function solveTargetCameraAngle(A, R_bb, R_cam, xNdc) {
      if (xNdc === 0) return A;
      const halfFovV = camera.fov * Math.PI / 180 / 2;
      const tanHalfH = Math.tan(halfFovV) * camera.aspect;
      const tau = xNdc * tanHalfH;
      const r   = tau * R_cam / R_bb;
      const mag = Math.sqrt(1 + tau * tau);
      if (Math.abs(r) > mag) return A;  // no solution — fall back to centre
      return A + Math.asin(r / mag) - Math.atan(tau);
    }

    function stepClickOrbit() {
      if (!_clickOrbitTarget) return;
      const b = _clickOrbitTarget;
      const dx = camera.position.x - ringCenter.x;
      const dz = camera.position.z - ringCenter.z;
      const R_cam = Math.hypot(dx, dz);
      if (R_cam < 1e-4) { _clickOrbitTarget = null; return; }

      const C = Math.atan2(dz, dx);
      const bdx = b.worldPos.x - ringCenter.x;
      const bdz = b.worldPos.z - ringCenter.z;
      const A   = Math.atan2(bdz, bdx);

      // Target screen NDC x for the billboard. Chat panel occludes the right
      // 1/3, so when it's open we aim at the centre of the visible left 2/3.
      const chatOpen = document.body.classList.contains('chat-open');
      const xNdcTarget = chatOpen ? -1 / 3 : 0;
      const R_bb = Math.hypot(bdx, bdz);
      const targetC = (chatOpen && R_bb > 1e-4)
        ? solveTargetCameraAngle(A, R_bb, R_cam, xNdcTarget)
        : A;

      // applyAxisAngle(+Y, α) DECREASES atan2(z,x) by α (right-hand rule),
      // so to move the camera angle from C toward targetC we rotate by (C − targetC).
      let rot = C - targetC;
      while (rot >  Math.PI) rot -= 2 * Math.PI;
      while (rot < -Math.PI) rot += 2 * Math.PI;

      if (Math.abs(rot) < 1e-3) { _clickOrbitTarget = null; return; }

      // 50% per frame → reaches ~1° of target in ~6 frames (~100 ms at 60fps).
      const applied = rot * 0.5;
      _clickOrbitOffset.set(dx, camera.position.y - ringCenter.y, dz);
      _clickOrbitOffset.applyAxisAngle(_yAxis, applied);
      camera.position.copy(ringCenter).add(_clickOrbitOffset);
      controls.target.copy(ringCenter);
      controls.update();
      _cameraDirty = true;
    }

    function stepSnapMagnet() {
      controls.rotateSpeed = _userRotateSpeed;         // default: full speed

      if (!_closestInteractive) return;
      const b = _closestInteractive;
      const d = b.worldPos.distanceTo(camera.position);
      if (d < 1e-6) return;

      // Size gate: billboard must be large enough on screen
      const apparentH = IFRAME_HEIGHT_PX * _scaleNumerator / d;
      if (apparentH < _vpH * SNAP_SIZE_THRESH) return;

      // Project billboard to get horizontal screen offset (needs fresh matrices)
      camera.updateMatrixWorld();
      _snapNdc.copy(b.worldPos).project(camera);
      // When chat is open the right 1/3 is occluded; shift the zone center
      // to the middle of the visible left 2/3 (ndc.x = -1/3).
      const chatOpen = document.body.classList.contains('chat-open');
      const zoneCenter = chatOpen ? -1 / 3 : 0;
      const offsetX = Math.abs(_snapNdc.x - zoneCenter);
      if (offsetX >= SNAP_NDC_ZONE) return;

      // proximity: 1 at zone center, 0 at zone edge
      const proximity = 1 - offsetX / SNAP_NDC_ZONE;
      // Lerp: full speed at edge → SNAP_MIN_FACTOR × speed at center
      controls.rotateSpeed = _userRotateSpeed * (1 - proximity * (1 - SNAP_MIN_FACTOR));
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  ANIMATION LOOP
    // ══════════════════════════════════════════════════════════════════════════
    function animate() {
      requestAnimationFrame(animate);
      stepClickOrbit();                  // orbit toward a clicked ticker row
      stepSnapMagnet();                  // modulate rotateSpeed before orbit step
      stepHorizontalLock();              // pin polar angle to π/2 when fully zoomed out
      controls.update();                 // may set _cameraDirty via 'change' event
      stepRmbOrbit();                    // damped iframe-forwarded right-drag
      stepZoomInertia();                 // may set _cameraDirty if zooming
      enforceBillboardMargin();          // may set _cameraDirty if camera pushed

      if (!_cameraDirty) return;         // nothing changed — skip expensive work
      _cameraDirty = false;

      camera.updateMatrixWorld();
      webglRenderer.render(scene, camera);
      updateBillboardProjection();
      refreshTickerInput();              // mirror closest billboard's ticker
      updatePriceOverlay();              // show price info for closest billboard
    }
    animate();

    // ══════════════════════════════════════════════════════════════════════════
    //  RESIZE
    // ══════════════════════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      webglRenderer.setSize(w, h);
      recomputeViewportCache();
      // Force ticker-list rebuild so the clamped scroll height is
      // recomputed against the new viewport size.
      _lastTickerListGen = -1;
      _cameraDirty = true;
    });
  </script>
</body>
</html>
