# Seed sources for 4_List_renderer (Phase 1).
#
# On first run (or with `--seed`), each entry is upserted into the `sources`
# table (Tier A) and the local user's default board is subscribed to it
# (Tier B). `on_board` controls whether it shows on the board by default;
# the source itself stays registered either way.
#
# adapter  = which fetch adapter handles it (file | biopharm | news)
# kind     = source taxonomy (rss | sqlite | file | web | http_api ...)
# config   = adapter-specific params

sources:
  - id: news_default
    kind: rss
    adapter: news
    name: News — FierceBiotech, Le Figaro, CNBC
    label: News
    on_board: true
    config:
      per_site: 3

  - id: biopharm_top
    kind: sqlite
    adapter: biopharm
    name: Biopharm catalysts — top by composite score
    label: Biopharm
    on_board: false
    config:
      top_n: 10

  - id: sample_file
    kind: file
    adapter: file
    name: Sample — Google demo
    label: Sample
    on_board: false
    config:
      input: data/sample_input.json

  # --- Phase 2: generic, config-only sources (no code needed) ---

  # Generic RSS adapter: any feed by URL. Here: Hacker News front page.
  - id: hn_rss
    kind: rss
    adapter: rss
    name: Hacker News — front page
    label: Hacker News
    on_board: false
    config:
      feed_url: https://hnrss.org/frontpage
      brand: Hacker News
      max_items: 10
      cache_ttl: 900

  # Generic JSON-API adapter: map any JSON response via dotted field paths.
  # Here: Hacker News front page via the Algolia API (single call, no auth).
  - id: hn_api
    kind: http_api
    adapter: http_api
    name: Hacker News — via Algolia API
    label: HN (API)
    on_board: false
    config:
      url: https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=10
      items_path: hits
      brand: Hacker News
      max_items: 10
      cache_ttl: 900
      fields:
        title: title
        url: url
        snippet: story_text
        published: created_at_i        # epoch seconds -> recency attribute (D33 L1)
