# Module 4b — trajectory archetypes.
#
# Each archetype specifies ranges on the SUBSET of features it cares about
# (decision D5). Match confidence = matched / specified.
#
# Features (all strictly positive; computed on adjusted_close):
#   R_4, R_12, R_26, R_52              (price_today / price_Xw_ago)
#   R_4_over_R_12, R_4_over_R_26, R_4_over_R_52,
#   R_12_over_R_26, R_12_over_R_52, R_26_over_R_52
#
# score: positive = "train hasn't left" candidate; negative = "train has left".
# composite_score = score * (alpha + (1 - alpha) * match_confidence),
# alpha from ranking.yaml. Scores are unique integers so composite-score bands
# are disjoint at alpha=0.7, min_confidence=0.70 (min gap = 0.37).

archetypes:
  fresh_awakening:
    score: 10
    description: "Flat-to-down over year, awakening in recent 12 weeks"
    ranges:
      R_52:           [0.85, 1.10]
      R_26:           [0.90, 1.10]
      R_12:           [1.05, 1.30]
      R_4:            [1.02, 1.15]
      R_12_over_R_26: [1.05, 1.40]
      R_26_over_R_52: [0.95, 1.15]

  deep_base_breakout:
    score: 9
    description: "Deep intra-year crash, multi-month base, now breaking out (VCP-style)"
    ranges:
      R_4:            [1.10, 1.30]   # breaking out, not parabolic
      R_26:           [0.30, 0.80]   # deep intra-year crash visible
      R_52:           [0.50, 1.00]   # year still down — crash not yet fully healed
      R_12_over_R_26: [1.30, 5.00]   # meaningful bounce from crash low

  early_breakout:
    score: 7
    description: "Recent move starting, not yet parabolic"
    ranges:
      R_52:          [0.90, 1.15]
      R_12:          [1.10, 1.35]
      R_4:           [1.05, 1.20]
      R_4_over_R_12: [0.80, 1.10]

  post_crash_rebase:
    score: 6
    description: "Down sharply over year, bottomed and stabilising"
    ranges:
      R_52:           [0.40, 0.80]
      R_26:           [0.85, 1.10]
      R_12:           [0.95, 1.10]
      R_4:            [0.98, 1.08]
      R_26_over_R_52: [1.15, 2.00]

  v_recovery:
    score: 5
    description: "Recent strength after mid-period dip; long-term positive"
    ranges:
      R_52: [1.00, 3.00]
      R_26: [0.70, 1.00]
      R_12: [0.80, 1.10]
      R_4:  [1.02, 1.25]

  shallow_rebase:
    score: 4
    description: "Mild decline over year with recent turn-up"
    ranges:
      R_52: [0.75, 0.95]
      R_26: [0.85, 1.10]
      R_12: [0.95, 1.15]
      R_4:  [1.00, 1.15]

  quiet_compression:
    score: 3
    description: "Flat across all windows, coiled spring (no directional edge without catalyst)"
    ranges:
      R_52: [0.90, 1.10]
      R_26: [0.92, 1.08]
      R_12: [0.94, 1.06]
      R_4:  [0.96, 1.04]

  mature_uptrend:
    score: 2
    description: "Sustained uptrend across all windows"
    ranges:
      R_52: [1.20, 2.50]
      R_26: [1.10, 1.80]
      R_12: [1.00, 1.30]
      R_4:  [0.98, 1.10]

  stage2_pullback:
    score: 1
    description: "Weinstein Stage 2B / Livermore continuation pivotal — year strong, minor recent pullback"
    ranges:
      R_52: [1.10, 3.00]
      R_26: [1.05, 999]
      R_12: [1.05, 999]
      R_4:  [0.85, 1.03]

  extended_uptrend:
    score: -1
    description: "Strong uptrend past mature_uptrend's cap — train has left but not parabolic"
    ranges:
      R_52:          [2.50, 999]
      R_26:          [1.30, 999]
      R_4:           [0.95, 1.25]
      R_4_over_R_12: [0.80, 1.25]

  late_stage_extension:
    score: -2
    description: "Minervini late-stage climax run / Weinstein late Stage 2 — hot recent move, not parabolic"
    ranges:
      R_52:          [2.00, 999]
      R_26:          [1.30, 999]
      R_4:           [1.25, 999]
      R_4_over_R_12: [0.40, 1.30]

  sustained_decline:
    score: -3
    description: "Falling across all windows — value trap risk"
    ranges:
      R_52: [0.001, 0.80]
      R_26: [0.001, 0.90]
      R_12: [0.001, 0.95]
      R_4:  [0.001, 0.98]

  broken_trend:
    score: -4
    description: "Uptrend broken, recent weakness — softened from -5 to avoid punishing healthy dips"
    ranges:
      R_52:           [1.10, 999]
      R_12:           [0.70, 0.95]
      R_4:            [0.85, 0.98]
      R_12_over_R_26: [0.60, 0.95]

  parabolic_blowoff:
    score: -10
    description: "Train has left — recent move extreme"
    ranges:
      R_4:           [1.25, 999]
      R_4_over_R_12: [1.30, 999]
      R_4_over_R_52: [1.15, 999]
