# Module 6 — LLM scoring config.
# Loaded by scripts/6_estimate_cost.py and scripts/6_score.py.
#
# Spec: spec/module_6_spec.md (m6-v2 reshape, 2026-04-24).
# Decisions: decisions.md § D30–D43.

# ---------------- Prompt / model ----------------
model: claude-opus-4-7
prompt_version: m6-v4                                  # m6-v4 (D54) adds HARD RULES #20-22: use pack.fundamentals.{financials,recent_insider_transactions,recent_capital_raises} verbatim; m6-v3 (D45) added catalyst-date sanity + IR-freshness check + platform-rNPV row + structured final_results citation
max_output_tokens: 12500      # 2026-04-28: 10000 was scraped (3 of 30 trunc in run 13: BHVN/NAGE plus run-12 RARE); raised to 12500 with headroom
system_prompt_path: config/module_6_system_prompt.md
few_shot_examples_path: config/module_6_few_shots.md

# ---------------- Gates (D21 / D27 / D28 / D29) ----------------
# These are OVERRIDDEN by interactive prompts in scripts/6_score.py at runtime
# (per D30). The values below are fallback defaults used by the cost estimator
# (which is non-interactive in step B) and by --non-interactive runs.
gates:
  composite_best_min: 6.0
  industry_allowlist:
    - Biotechnology
    - Drug Manufacturers - Specialty & Generic
  market_cap_max_usd: 3700000000
  rescue:
    enabled: true
    new_positions_min: 1
    qoq_fund_count_change_min: 1
    excluded_archetypes:
      - extended_uptrend
      - late_stage_extension
      - broken_trend
      - sustained_decline
      - parabolic_blowoff

# ---------------- Web search (D22 / D35) ----------------
web_search:
  enabled: true
  max_uses: 10                     # m6-v4: lowered 12 → 10 (D54 — financials now in pack.fundamentals); m6-v3 had 12 (D40 reshape)
  max_uses_tier_b: 2               # light-refresh cap (D39)
  whitelists_path: config/module_6_web_search_whitelists.yaml

# ---------------- Cross-run caches (D36 / D37 / D38 / D39) ----------------
cache:
  web_search_lookback_days: 180    # prior search content injected if newer than this
  prior_thesis_max_per_horizon: 2  # latest N prior llm_scores rows injected
  default_cache_reuse: true        # tiered routing on by default; --force-refresh flips off
  refresh_threshold_weeks_3mo: 4   # Tier B window for 3mo horizon
  refresh_threshold_weeks_12mo: 8  # Tier B window for 12mo horizon
  tier_b_max_output_tokens: 400    # output cap for light-refresh calls

# ---------------- Dispatch ----------------
dispatch:
  mode: batch                      # "batch" | "sync"
  sync_concurrency: 8              # only used in sync mode
  poll_interval_s: 30              # batch polling cadence
  timeout_s: 86400                 # batch hard deadline

# ---------------- Rate / score calc ----------------
rate:
  tie_tolerance: 0.05              # final_horizon="either" when scores within 5%

# ---------------- Failure handling ----------------
failures:
  abort_threshold_pct: 5.0         # abort run if >5% tickers fail to parse

# ---------------- Pricing (for cost estimator) ----------------
# All prices per 1M tokens, USD. VERIFY against Anthropic's current pricing
# page at first run — Open Item #3 in the spec.
pricing:
  model: claude-opus-4-7
  input_per_mtok: 15.00
  output_per_mtok: 75.00
  cache_read_multiplier: 0.10      # cache-read = 10% of input
  # cache_creation_multiplier: empirically ~0.10 for Opus 4.7 web_search workloads
  # — was set at the docs-quoted 1.25 before, but actual Anthropic billing on
  # 2026-04-25 (3 sync calls × 3 tickers) implied ~0.10 (see decisions §D44).
  cache_creation_multiplier: 0.10
  batch_discount: 0.50             # 50% off all tokens via Message Batches API
  web_search_per_1k: 10.00         # $10 per 1000 web_search queries
  search_result_avg_tokens: 1500   # heuristic: avg tokens per web_search snippet result
                                   # (used to estimate the input-token cost of search results)
  # 2026-04-28 — empirical calibration. Two real Anthropic invoices vs script-computed:
  #   run 12: script $8.90, actual $0.45, ratio 0.051
  #   run 13: script $15.35, actual $1.49, ratio 0.097
  # The script over-counts cache_creation across batch members, and there appears to be
  # an account-tier discount the published rates don't expose. Single global multiplier
  # applied to the FINAL cost (token + search) in both _usd_cost_per_call and the
  # cost estimator. Re-tune as more billing data accumulates.
  cost_calibration_factor: 0.10
