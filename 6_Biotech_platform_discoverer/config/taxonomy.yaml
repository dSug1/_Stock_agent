# 6_Biotech_platform_discoverer — controlled mechanism vocabulary (spec §4).
# Single canonical list referenced by BOTH the embedding archetypes (§8) and the Claude
# D_mechanism field (§9). Each entry: id, branch, label, synonyms[], example_targets[], maturity.
# maturity ∈ {validated, registrational, emerging, lab_stage} — a contextual prior in scoring,
# NEVER a filter. Keep this file editable; extend the autoimmune/gpcr branches freely.
#
# Synonyms carry BOTH the abbreviation AND the spelled-out form (2026-06-28 enrichment), because the
# tagger matches literal terms: OpenAlex concepts come spelled-out ("Histone deacetylase") while
# descriptions often use the abbreviation ("HDAC"). Carrying both closes that gap in both directions.
# Avoid bare generic words (e.g. "kinase") that would over-tag; terms < 3 chars are dropped anyway.

