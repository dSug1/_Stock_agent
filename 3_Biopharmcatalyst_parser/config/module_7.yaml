# Module 7 — Claude API deep-dive config.
# Spec: spec/module_7_spec.md.
# Decisions: spec/decisions.md § D15 (M6.5) + § D16 (M7).
#
# Edits to this file change the content hash, which is appended to
# `prompt_version` so re-runs after a tuning edit invalidate the prior
# row's PK (same trick as module_6/config.py).

# ---------------- Prompt / model ----------------
model: claude-opus-4-7
# m7-v2 (2026-05-28 — ports 13 high-value patterns from 2_Funds_parser M6:
#   POS base-rate table by pathology × stage (A); rNPV formula + WACC=12% (B);
#   HIGH/MEDIUM/LOW probability rubric (C); prior-results + mgmt adjustment
#   ladder (D); ±15pp band HARD RULE (E); evidence hierarchy (F); search-budget
#   split (G); IR-freshness web_search when weeks>30 (H); platform-optionality
#   row HARD RULE (I); cite-dates HARD RULE (J); inline POS adjustment
#   citation (K); mgmt example-citation HARD RULE (L); stage-based move
#   anchor (M). Net effect: stronger calibration discipline + cleaner audit.
prompt_version_label: m7-v2
max_output_tokens: 12500
system_prompt_path: config/module_7_system_prompt.md
few_shot_examples_path: config/module_7_few_shots.md

# ---------------- Web search (single-tier biotech) ----------------
web_search:
  enabled: true
  max_uses: 10                      # per-ticker budget; matches 2_Funds_parser M6 post-D54
  domains_path: config/module_7_web_search_domains.yaml

# ---------------- Selection ----------------
selection:
  source_html: Outputs/catalyst_scores.html
  sidecar_json: Outputs/catalyst_scores_selection.json
  hard_pass_only: true              # M7 ignores hard-fail rows even if checked

# ---------------- Dispatch ----------------
# Cost-minimising defaults (D21, 2026-05-28):
#   • mode=batch — 50% discount on input/output/cache_read/cache_create.
#     Tradeoff: minutes-to-24h SLA. Use when speed doesn't matter.
#   • sync_concurrency=1 — defensive: if anyone passes --mode sync, force
#     sequential dispatch so the prompt cache is actually reused across
#     calls (first writes, rest read at 0.10×). Concurrency>1 in sync mode
#     causes every parallel call to write its own cache copy because none
#     have finished by the time the others start (D21 invoice: 5 sync
#     concurrent calls billed $3.01 vs ~$1.57 estimated for batch mode).
dispatch:
  mode: batch                       # 'batch' | 'sync'
  sync_concurrency: 1               # only used in sync mode; keep at 1 for cache sharing
  poll_interval_s: 30               # batch polling cadence
  timeout_s: 86400                  # batch hard deadline

# ---------------- Modifiers ----------------
# Linear remap of M6's 0-100 signal scores into bounded multiplicative
# modifiers. Spec §5.2 + §5.6. Re-tune here without touching code.
modifiers:
  insider:
    min_multiplier: 0.85
    max_multiplier: 1.15
  funds:
    min_multiplier: 0.85
    max_multiplier: 1.15
  momentum:
    min_multiplier: 0.95            # tighter — momentum is timing, not thesis
    max_multiplier: 1.05

# ---------------- Expectancy clamps ----------------
# Final guards applied AFTER Claude returns; complements the schema bounds
# enforced by parsing.py.
clamps:
  p_final_min: 0.05
  p_final_max: 0.95
  move_on_hit_pct_max: 400.0
  move_on_miss_pct_min: -90.0

# ---------------- Pricing (for the cost estimator) ----------------
# Verify against https://www.anthropic.com/pricing at first run; values
# below match 2_Funds_parser config/scoring.yaml::pricing as of 2026-04-28.
pricing:
  model: claude-opus-4-7
  input_per_mtok: 15.00
  output_per_mtok: 75.00
  cache_read_multiplier: 0.10
  cache_creation_multiplier: 0.10   # empirical (2_Funds_parser D44 + 3_Biopharm D21), not docs-quoted 1.25
                                    # — Anthropic appears to dedup/discount concurrent cache writes well below docs
  batch_discount: 0.50
  web_search_per_1k: 10.00
  search_result_avg_tokens: 1500
  # D22 (2026-05-28): re-tuned again after first BATCH-mode invoice
  # ($0.20 actual for 5-catalyst batch run; raw-formula gives $2.15 →
  # calibration = $0.20/$2.15 ≈ 0.093). Reverted to 0.10 — the value
  # originally inherited from 2_Funds_parser M6 was actually right for
  # batch mode all along (2_Funds_parser uses batch). D21's 0.80 was
  # tuned for sync mode only and over-estimates batch ~8×.
  #
  # Since batch is the production default (dispatch.mode), the single
  # calibration_factor reflects batch reality. Sync-mode forecasts will
  # OVER-ESTIMATE by ~8× — that's the safer direction for the rare
  # debug case (you'll never accidentally exceed your budget; you'll
  # just see an inflated estimate that warns you off sync mode anyway).
  cost_calibration_factor: 0.10     # memory: project_anthropic_cost_calibration

# Estimator aborts dispatch when scenario_cache_batch.total_usd exceeds this.
cost_ceiling_usd: 50.0

# ---------------- Failure handling ----------------
failures:
  abort_threshold_pct: 5.0          # abort if >5% tickers fail to parse
