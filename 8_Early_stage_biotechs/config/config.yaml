# Module 8 — Phase 1 universe config. All keys optional; omitted keys fall back to code defaults
# (see src/early_detection/config.py). yaml.safe_load only (repo security discipline).

# Market-cap floor in USD. Below-floor names are FLAGGED + audited, never deleted (recall-safe).
mktcap_floor_usd: 10000000        # $10M (operator decision)

# Phase-1 markets. Signals + other markets (EU/Nordic/JP/KR) arrive in later phases.
markets: [US, CA]

# SEC SIC allow-map: code -> normalized sector (spec §2.2 sector filter).
sic_allow:
  "2834": therapeutics      # pharmaceutical preparations
  "2836": therapeutics      # biological products (except diagnostic)
  "8731": tools_platform    # commercial physical & biological research
  "3826": tools_platform    # laboratory analytical instruments
  "3841": devices           # surgical & medical instruments

# Best-effort GLEIF LEI enrichment (phase1 §8 Q1). Off in Phase 1; wire in a later pass.
gleif_enrich: false

# Module-6 store, read READ-ONLY as the existing-universe priority tier (decision D2). Omit to use
# the default relative path (../6_Biotech_platform_discoverer/data/store.db).
# m6_store_path: ../6_Biotech_platform_discoverer/data/store.db

# Per-run hard spend guard on any single Claude dispatch. Raised 2026-07-13 for the 200-name
# cold-first extraction tranche (est ~$12.25 Haiku batch); prevents the guard aborting collection
# mid-batch and losing paid work. Lower back toward ~5 for routine small runs if desired.
max_usd_per_run: 15.0

# Raised 2026-07-14: the v2 asymmetry rubric emits ~2.3k output tokens/candidate; 4000 truncated 8 of
# 272 (invalid JSON -> dropped). 6000 leaves headroom so no candidate is lost. (Higher cap does not raise
# per-candidate cost -- billing is on ACTUAL output tokens, not the cap.)
scoring_max_output_tokens: 6000
