# Hype Parser — source registry seed (spec 6.3-6.6).
#
# This file is the editable source of truth; `scripts/5_registry.py --seed` loads it into
# data/hype.db (idempotent on source_id). Freeze a point-in-time snapshot with --freeze
# before any backtest window (spec 6.7 / Protocol 1).
#
# Field meanings (spec 6.2 + v0.2):
#   diffusion_position : leading | bridge | denominator   (numerator vs S-curve denominator)
#   signal_type        : threshold_event | volume         (boundary-crossing outranks counts)
#   history_availability: queryable | forward_only
#        queryable   = the panel era is reconstructable now (has a queryable archive)
#        forward_only= no historical feed; must be archived going forward (OD-2) or it is
#                      absent from the panel era.
#   scrapeability_verified defaults to 0 (claimed, not verified — spec 6.7).
#   jury_credibility   : high | medium | low | na (for juried award/designation sources).

sources:

