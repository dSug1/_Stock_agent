  - {source_id: arxiv,            name: arXiv,                       edge_type: science, tier: tier0, access_method: api,     diffusion_position: leading, signal_type: volume,          history_availability: queryable, jury_credibility: na, cadence: daily,  url: "https://arxiv.org",                rate_limits: "be polite; bulk OAI-PMH", notes: "preprint volume by sub-theme"}
