# Release calendar for the weekly discovery run (decision D26).
#
# PROBLEM: most juries publish ONCE A YEAR — re-scraping all of them every week is wasteful and
# risks rate-limits/bans. SOLUTION: the weekly run fetches a source only when it is "DUE":
#   - its publication window is open for the current period, AND
#   - we have NOT yet captured that period's edition (tracked by a per-source watermark).
# Otherwise it serves the cached jury_signals — no network. Annual sources are thus a no-op for ~50
# weeks/year; only continuous feeds + the just-published award + the post-13F-deadline funds run.
#
# Months below are BEST-EFFORT (1=Jan..12=Dec) and self-correct: once a year's edition is captured the
# watermark advances and the real publish date is learned, so the window can be tightened over time.

cadence_rules:                 # default behavior per source `cadence` (from sources.yaml)
  continuous: poll_weekly_incremental      # watermark + conditional-GET; YC, Product Hunt, CNCF, ARPA-E, SAM.gov
  daily:      poll_weekly_incremental
  weekly:     poll_weekly
  quarterly:  due_after_13f_deadline        # specialist funds (13F)
  annual:     due_in_publish_window_until_captured

# 13F lands ~45 days after quarter end — the ONLY weeks fund positions change. The fund cross-reference
# (specialist_funds.yaml) runs only in these windows; biotech reuses 2_Funds_parser's already-fetched data.
quarterly_13f_due_from:        # MM-DD the quarter's 13Fs start arriving
  - {quarter_end: "03-31", due_from: "05-15"}
  - {quarter_end: "06-30", due_from: "08-14"}
  - {quarter_end: "09-30", due_from: "11-14"}
  - {quarter_end: "12-31", due_from: "02-14"}

# Per-source publication month(s) for ANNUAL juries. "Due" from the first listed month until that
# year's edition is captured (then skip until next year). Sources not listed here default to
# check_monthly_until_captured (cheap conditional-GET once/month).
