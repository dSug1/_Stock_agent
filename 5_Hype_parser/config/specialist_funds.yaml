# Specialist / sector-tilted 13F funds + thematic-ETF fallbacks, per theme-sector (decision D25).
#
# Analogous to the 21 biotech specialist funds curated in 2_Funds_parser (its `funds` table). Purpose:
# cross these managers' 13F **new positions** (reuse 2_Funds_parser module_3 `new_positions`, D3)
# against emerging-theme stock candidates (the discovery `theme_orgs` Track-A / `theme_tickers`) =
# **smart-money confirmation** on a hype theme — a capital jury that fires while a theme is still early.
#
# type:
#   specialist — pure-play / strongly sector-dedicated 13F filer (cleanest new-position signal)
#   crossover  — tech/growth-tilted multi-sector 13F (useful but carries non-theme noise)
#   etf        — read the ETF's HOLDINGS (N-PORT/daily file), not a discretionary 13F
#
# KEY FINDING (research, D25): outside biotech + software/growth, dedicated specialist 13F filers are
# SPARSE — most sector specialists are PRIVATE VCs that file no 13F. So those sectors fall back to
# thematic-ETF holdings deltas as the constituent/weight proxy. CIKs are best-effort from web research
# -> VERIFY on EDGAR before hard-coding (blanks = to resolve).

