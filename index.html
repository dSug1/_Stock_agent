<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Visualizer — 3D Scene</title>

  <style>
    /* ── Theme tokens ────────────────────────────────────────────────────
       --accent is re-written by JS when the user picks a theme in the
       menu panel. Everything in the UI that used to be hard-coded
       #58a6ff now reads var(--accent) instead, so a single property
       write re-skins the whole page. */
    :root {
      --accent: #58a6ff;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      /* Kill text-selection and mobile tap-highlight flashes when clicking
         on the billboards background layer. The HUD slider still works
         because <input> elements opt back in via the #hud rule below. */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Remove focus rings on non-input elements (the layers and their
       wrapper divs would otherwise flash a browser outline on click). */
    #webgl-layer, #billboards-layer, #billboards-layer > * { outline: none; }
    #menu-panel, #menu-panel *, #period-topbar, #period-topbar *,
    #ticker-input-group, #ticker-input-group *,
    #ring-size-controls, #ring-size-controls *,
    #chat-container, #chat-container *, #chat-toggle {
      user-select: auto; -webkit-user-select: auto;
    }

    /* Stacked renderer layers.
       - WebGL canvas sits behind with pointer-events: none so it doesn't
         intercept clicks destined for the iframe billboards or OrbitControls.
       - Billboards layer sits on top with pointer-events: auto so its DOM
         children (the iframes) can receive events, and OrbitControls
         (attached to this container) receives drags on empty background. */
    #webgl-layer, #billboards-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #webgl-layer     { pointer-events: none; z-index: 1; }
    #billboards-layer { pointer-events: auto; z-index: 2; }

    /* Each billboard element is absolutely positioned; its left/top/transform
       are rewritten every frame by the projector in JS. We intentionally AVOID
       any 3D transform here — plain 2D translate + scale — so each iframe's
       hit-box is exactly its visible rectangle on screen. That's the whole
       point of the manual-projection approach: Chrome's CSS3D iframe hit-test
       uses a 2D AABB of the transformed quad which leaks far beyond the
       visible area, breaking pointer events on other billboards. */
    #billboards-layer > * {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 50% 50%;
      will-change: transform, left, top;
    }

    /* ── Hamburger menu toggle (top-left) ──────────────────────────────── */
    #menu-toggle {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 20;
      width: 36px;
      height: 36px;
      background: rgba(22, 27, 34, 0.70);
      border: 1px solid #30363d;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 0;
    }
    #menu-toggle svg {
      width: 20px;
      height: 20px;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    /* The two icon SVGs swap visibility via the .open class on the body. */
    #menu-toggle .icon-close  { display: none; }
    body.menu-open #menu-toggle .icon-bars  { display: none; }
    body.menu-open #menu-toggle .icon-close { display: block; }

    /* ── Slide-in menu panel (left side) ───────────────────────────────── */
    #menu-panel {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 260px;
      z-index: 15;
      background: rgba(22, 27, 34, 0.92);
      border-right: 1px solid #30363d;
      padding: 66px 20px 20px 20px;
      font-size: 13px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transform: translateX(-100%);
      transition: transform 0.25s ease-out;
      box-shadow: 4px 0 24px #0006;
    }
    body.menu-open #menu-panel { transform: translateX(0); }

    #menu-panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      margin-bottom: 8px;
    }
    #menu-panel label:last-of-type { margin-bottom: 0; }
    #menu-panel input[type=range] {
      width: 140px;
      accent-color: var(--accent);
    }
    #menu-panel select {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #e6edf3;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      padding: 5px 8px;
      outline: none;
    }
    #menu-panel select:focus { border-color: var(--accent); }
    #menu-panel .val {
      display: inline-block;
      min-width: 34px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #8b949e;
    }
    #menu-panel .title {
      color: #8b949e;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      margin-top: 14px;
    }
    #menu-panel .title:first-child { margin-top: 0; }
    #menu-panel .menu-btn {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #e6edf3;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      padding: 7px 14px;
      transition: all .15s;
    }
    #menu-panel .menu-btn:hover {
      background: #30363d;
      border-color: var(--accent);
    }

    /* ── Top period-button bar (centered at the top of the screen) ─────── */
    #period-topbar {
      position: absolute;
      top: 14px;
      left: 58px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 8px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: left 0.25s ease-out;
    }
    body.menu-open #period-topbar {
      left: 310px;  /* 260px menu width + 50px gap */
    }
    #topbar-row1 {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    #period-row {
      display: flex;
      gap: 2px;
      align-items: center;
      margin-top: 4px;
      border-top: 1px solid #30363d;
      padding-top: 4px;
    }
    #period-topbar .pbtn {
      flex: 1;
      text-align: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 3px;
      color: #8b949e;
      cursor: pointer;
      font-size: 10px;
      padding: 3px 0;
      font-family: inherit;
      transition: all .15s;
    }
    #period-topbar .pbtn:hover { border-color: #30363d; color: #e6edf3; }
    #period-topbar .pbtn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    /* Ring-size +/- controls — sit at the far left of the period topbar.
       "+" adds a billboard at the position closest to the camera; "−"
       removes the billboard currently closest to the camera. Disabled
       visual state is handled by the :disabled pseudo-class. */
    #ring-size-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-right: 8px;
      margin-right: 4px;
      border-right: 1px solid #30363d;
    }
    #ring-size-controls button {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #e6edf3;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }
    #ring-size-controls button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }
    #ring-size-controls button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Ticker input group — sits on the LEFT side of the period topbar,
       separated from the period buttons by a thin divider. Reflects the
       ticker of the billboard closest to the camera; typing + Go (or
       Enter) rewrites that billboard to the entered ticker. */
    #ticker-input-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #ticker-input {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #e6edf3;
      padding: 4px 8px;
      width: 140px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    #ticker-input:focus { border-color: var(--accent); }
    #ticker-input::placeholder { color: #8b949e; }
    #ticker-go {
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: #ffffff;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      transition: opacity .15s;
    }
    #ticker-go:hover { opacity: .85; }

    /* ── Chat dialog ─────────────────────────────────────────────────────── */
    #chat-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 20;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid #30363d;
      background: rgba(22, 27, 34, 0.92);
      color: #e6edf3;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: all .15s;
    }
    #chat-toggle:hover { border-color: var(--accent); color: var(--accent); }
    #chat-container {
      position: fixed;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 25vw;
      min-width: 280px;
      z-index: 19;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid #30363d;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    #chat-container.open { display: flex; }
    #chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    #chat-header span { color: #e6edf3; font-size: 14px; font-weight: 600; }
    #chat-collapse {
      background: transparent;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #e6edf3;
      cursor: pointer;
      font-size: 16px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }
    #chat-collapse:hover { border-color: var(--accent); color: var(--accent); }
    #chat-body {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      color: #8b949e;
      font-size: 13px;
    }

    /* Blank-slot placeholder shown when there aren't enough tickers.
       Sized dynamically by JS to match IFRAME_WIDTH_PX / IFRAME_HEIGHT_PX.
       Non-interactive on purpose — scroll/click over it should reach
       OrbitControls on the billboards layer behind, just like empty bg. */
    .blank-slot {
      background: #000;
      border: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #30363d;
      font-family: 'Courier New', monospace;
      font-size: 24px;
      letter-spacing: 0.15em;
      pointer-events: none;
    }

    /* The iframes themselves: dark backdrop, thin border matching the chart theme. */
    .chart-frame {
      border: 1px solid #30363d;
      background: #0d1117;
      display: block;
    }

    /* Central-object placeholder — stands in for something to be defined later.
       Same pixel dimensions as the billboards so the ring geometry stays
       balanced. Pointer-events stay on so wheel-to-zoom still works here. */
    .center-placeholder {
      border: 1px dashed #30363d;
      background: rgba(13, 17, 23, 0.55);
      color: #6e7681;
      font-family: 'Courier New', monospace;
      font-size: 22px;
      letter-spacing: 0.18em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>

  <!-- Three.js ES modules pinned to 0.160.0.
       The importmap lets the module script below use bare specifiers
       like `three` and `three/addons/...`. -->
  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Hamburger toggle: three white bars → white X when menu is open. -->
  <button id="menu-toggle" type="button" aria-label="Toggle menu">
    <svg class="icon-bars"  viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    <svg class="icon-close" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </button>

  <!-- Slide-in menu panel on the left. Contains the orbit-speed and
       scroll-gain sliders plus the reset-view button. -->
  <div id="menu-panel">
    <div class="title">Camera</div>
    <label>
      Orbit speed
      <input id="orbit-speed" type="range" min="0.1" max="3" step="0.05" value="1">
      <span id="orbit-speed-val" class="val">1.00</span>
    </label>
    <label>
      Scroll gain
      <input id="scroll-gain" type="range" min="0.1" max="3" step="0.05" value="0.8">
      <span id="scroll-gain-val" class="val">0.80</span>
    </label>

    <div class="title">View</div>
    <button id="reset-view" class="menu-btn" type="button">Reset view</button>

    <div class="title">Theme</div>
    <label class="theme-label">
      Accent
      <select id="theme-select">
        <option value="blue">Blue</option>
        <option value="orange">Orange</option>
      </select>
    </label>
    <label class="theme-label">
      Billboard bg
      <select id="billboard-bg-select">
        <option value="white">White</option>
        <option value="black">Black</option>
        <option value="transparent">Transparent</option>
      </select>
    </label>
  </div>

  <!-- Top-of-screen period buttons — control every billboard at once.
       The ticker input group sits on the LEFT, period buttons are
       appended to the right by the module script below. -->
  <div id="period-topbar">
    <div id="topbar-row1">
      <div id="ring-size-controls">
        <button id="ring-left"  type="button" title="Swap the closest billboard with its left neighbor and recenter">←</button>
        <button id="ring-minus" type="button" title="Remove the billboard closest to the camera">−</button>
        <button id="ring-plus"  type="button" title="Add a billboard at the position closest to the camera">+</button>
        <button id="ring-right" type="button" title="Swap the closest billboard with its right neighbor and recenter">→</button>
      </div>
      <div id="ticker-input-group">
        <input id="ticker-input" type="text" placeholder="Ticker" autocomplete="off" spellcheck="false">
        <button id="ticker-go" type="button">Go</button>
      </div>
    </div>
    <div id="period-row"></div>
  </div>

  <!-- Chat dialog — bottom-right toggle button + floating container -->
  <button id="chat-toggle" type="button" aria-label="Open chat">💬</button>
  <div id="chat-container">
    <div id="chat-header">
      <span>Chat</span>
      <button id="chat-collapse" type="button" aria-label="Collapse chat">–</button>
    </div>
    <div id="chat-body"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    // NOTE: we deliberately do NOT use CSS3DRenderer here. Chrome hit-tests
    // CSS3D-transformed iframes by the 2D AABB of their transformed quad,
    // which leaks far beyond the visible area once the camera gets close to
    // a billboard — so clicks/wheels on other billboards fall through to the
    // wrong target. Instead we project each billboard's 3D world position to
    // 2D screen coordinates manually and use a plain translate+scale, which
    // gives each iframe a pixel-accurate hit-box.

    // ══════════════════════════════════════════════════════════════════════════
    //  CONFIGURATION
    // ══════════════════════════════════════════════════════════════════════════

    // Tickers and time window are provided by run.bat (→ 2_stock_visualizer.py)
    // via URL query params: ?tickers=AAPL,MSFT,GOOGL&period=1mo
    // The Python launcher prompts the user interactively, resolves ticker
    // symbols, pre-fetches data, then opens the browser at this URL. When
    // the URL has no tickers/period params, the session-restore block below
    // falls back to the last cached session in localStorage.
    const _params = new URLSearchParams(location.search);

    const CIRCLE_COUNT      = 6;        // default ring size on very first launch
    const BASE_RING_RADIUS  = 7;        // world units — ring radius for ≤ 8 billboards
    // When the ring has more than RING_EXPAND_THRESHOLD billboards, the radius
    // scales linearly to maintain the same arc-spacing as an 8-billboard ring.
    // The orbit center (and center billboard) shifts away from / toward the
    // camera so the closest billboard stays at the same distance.
    const RING_EXPAND_THRESHOLD = 8;
    let   circleRadius      = BASE_RING_RADIUS;
    const ringCenter        = new THREE.Vector3(0, 0, 0);
    const IFRAME_WIDTH_PX   = 800;      // iframe pixel width
    const IFRAME_HEIGHT_PX  = 500;      // iframe pixel height
    // Billboard world size = IFRAME_*_PX × BILLBOARD_SCALE.
    // At 0.004 that's 3.2 × 2.0 world units — fits inside a radius-7 ring
    // (adjacent centers are 7 units apart → 3.8 units gap between billboards)
    // while still staying readable when viewed from ~14 units away.
    const BILLBOARD_SCALE   = 0.004;
    const CHART_URL         = "_outputs/templates/1_chart_template.html";

    // ══════════════════════════════════════════════════════════════════════════
    //  THEME
    //
    //  Two themes are supported. Switching rewrites --accent on the document
    //  root (which re-skins every CSS rule referencing var(--accent)) AND
    //  broadcasts the new theme to every chart iframe via postMessage so
    //  they can re-skin their own UI in lock-step. Initial iframe src also
    //  carries ?theme=<name> so freshly-loaded iframes come up in the right
    //  theme without a flash of wrong color.
    //
    //  Persistence: menu selection is written to localStorage under
    //  LS_THEME_KEY and restored on next page load.
    // ══════════════════════════════════════════════════════════════════════════
    const THEMES = {
      blue:   { accent: '#58a6ff' },
      orange: { accent: '#f38d20' },
    };
    const LS_THEME_KEY   = 'sv.theme';
    const DEFAULT_THEME  = 'blue';
    function resolveInitialTheme() {
      try {
        const raw = localStorage.getItem(LS_THEME_KEY);
        if (raw && THEMES[raw]) return raw;
      } catch (_) { /* storage disabled — fall through */ }
      return DEFAULT_THEME;
    }
    let currentTheme = resolveInitialTheme();

    function applyTheme(name) {
      if (!THEMES[name]) name = DEFAULT_THEME;
      currentTheme = name;
      document.documentElement.style.setProperty('--accent', THEMES[name].accent);
    }
    // Apply the initial theme immediately so the UI renders in the right
    // accent from the first paint.
    applyTheme(currentTheme);

    // Billboard background — must be declared early so makeChartElement can
    // reference it when building the initial set of iframes.
    const LS_BG_KEY = 'sv.billboardBg';
    const DEFAULT_BG = 'white';
    let currentBillboardBg = (() => {
      try {
        const raw = localStorage.getItem(LS_BG_KEY);
        if (raw && ['white', 'black', 'transparent'].includes(raw)) return raw;
      } catch (_) {}
      return DEFAULT_BG;
    })();

    // Push the current theme into every live chart iframe. Iframes that were
    // already open at the time of a theme change can't be re-created without
    // losing scroll/zoom state, so they listen for a 'sv-theme' postMessage
    // and swap their --accent CSS variable at runtime.
    function broadcastTheme() {
      if (typeof billboards === 'undefined') return;
      for (const b of billboards) {
        if (!b || !b.interactive) continue;
        const el = b.element;
        if (!el || el.tagName !== 'IFRAME') continue;
        try {
          el.contentWindow.postMessage(
            { type: 'sv-theme', theme: currentTheme }, '*');
        } catch (_) { /* cross-origin safety */ }
      }
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  USER PREFERENCES — localStorage helpers
    //
    //  Everything a user can adjust (orbit speed, scroll gain, theme, period,
    //  ring size, per-slot tickers) is persisted to localStorage on every
    //  change and restored at startup, so a "production mode" launch comes up
    //  exactly how the previous session was left.
    //
    //  URL query params from the Python launcher (?tickers=…&period=…) count
    //  as fresh intent for *this* session and override the cached session
    //  when present — but they are also written back to the cache so the
    //  next blank launch picks them up.
    // ══════════════════════════════════════════════════════════════════════════
    const LS_ORBIT_SPEED_KEY  = 'sv.orbitSpeed';
    const LS_SCROLL_GAIN_KEY  = 'sv.scrollGain';
    const LS_SESSION_KEY      = 'sv.session';      // {period, ringTickers:[...]}
    const DEFAULT_ORBIT_SPEED = 1.0;
    const DEFAULT_SCROLL_GAIN = 0.8;

    // Safe localStorage accessors — fall back silently if storage is disabled
    // (private browsing, iframe with blocked 3rd-party storage, etc.).
    function lsSet(key, value) {
      try { localStorage.setItem(key, String(value)); } catch (_) {}
    }
    function lsGetNumber(key, fallback, min, max) {
      try {
        const raw = localStorage.getItem(key);
        if (raw == null) return fallback;
        const v = parseFloat(raw);
        if (!Number.isFinite(v)) return fallback;
        return Math.min(max, Math.max(min, v));
      } catch (_) { return fallback; }
    }
    function lsSetJSON(key, obj) {
      try { localStorage.setItem(key, JSON.stringify(obj)); } catch (_) {}
    }
    function lsGetJSON(key) {
      try {
        const raw = localStorage.getItem(key);
        if (raw == null) return null;
        return JSON.parse(raw);
      } catch (_) { return null; }
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  SESSION RESTORE
    //
    //  Decide the initial period + ring tickers by combining URL query params
    //  (Python launcher) with the cached session. URL params win when present
    //  and non-empty; otherwise we replay the cache; otherwise we fall back
    //  to CIRCLE_COUNT blank slots.
    // ══════════════════════════════════════════════════════════════════════════
    const PERIODS = ['1d','5d','1mo','3mo','6mo','1y','2y','5y','max'];
    const DEFAULT_PERIOD = '1mo';

    const _cachedSession = lsGetJSON(LS_SESSION_KEY);
    const _urlTickersRaw = _params.get('tickers');     // null | "" | "A,B,C"
    const _urlPeriodRaw  = _params.get('period');      // null | "1mo" | …

    // Resolve initial ring tickers. Empty string in a slot means "blank
    // interactive iframe ready for the Go button" — NOT a non-interactive
    // placeholder (those are only for the center slot).
    let initialRingTickers;
    if (_urlTickersRaw !== null && _urlTickersRaw.trim().length > 0) {
      // Python launcher provided a non-empty ticker list — use it verbatim.
      initialRingTickers = _urlTickersRaw
        .split(',').map(s => s.trim()).filter(Boolean);
    } else if (
      _cachedSession &&
      Array.isArray(_cachedSession.ringTickers) &&
      _cachedSession.ringTickers.length > 0
    ) {
      initialRingTickers = _cachedSession.ringTickers
        .map(t => (typeof t === 'string' ? t : ''));
    } else {
      initialRingTickers = new Array(CIRCLE_COUNT).fill('');
    }

    // Resolve initial period.
    let initialPeriod = DEFAULT_PERIOD;
    if (_urlPeriodRaw && PERIODS.includes(_urlPeriodRaw)) {
      initialPeriod = _urlPeriodRaw;
    } else if (_cachedSession && PERIODS.includes(_cachedSession.period)) {
      initialPeriod = _cachedSession.period;
    }

    // Snapshot the current session state to localStorage. Called after every
    // user-driven mutation (period change, ticker update, ring +/-) AND once
    // after the initial billboard loop completes, so URL-launch state is
    // captured into the cache on the first blank-launch.
    //
    // Safe to reference `billboards` and `getRingBillboards` even though they
    // are declared later — persistSession is only invoked at event-time, by
    // which point the entire module has finished executing.
    function persistSession() {
      if (typeof billboards === 'undefined') return;
      if (typeof getRingBillboards !== 'function') return;
      const ringTickers = getRingBillboards().map(b => (b && b.ticker) || '');
      lsSetJSON(LS_SESSION_KEY, {
        period:      currentPeriod,
        ringTickers: ringTickers,
      });
    }

    // Camera placed far enough back that the full ring + center fit on
    // screen with empty background space around them — required for
    // OrbitControls drag-to-rotate to receive pointerdowns (iframes
    // capture their own).
    // MIN_ORBIT_DISTANCE is the hard floor: the camera can never orbit
    // closer to the ring center than this. It must be ≥ circleRadius so
    // the camera never enters the ring (which causes billboards to flip
    // behind the camera and triggers violent zoom-out corrections).
    // A small margin (1 wu) keeps things comfortable.
    const MIN_ORBIT_MARGIN   = 1;
    function getMinOrbitDistance() { return circleRadius + MIN_ORBIT_MARGIN; }
    const MAX_ORBIT_DISTANCE = 40;
    const CAMERA_START_POS   = new THREE.Vector3(0, 4, 14);

    // ══════════════════════════════════════════════════════════════════════════
    //  SCENE / CAMERA / RENDERERS
    // ══════════════════════════════════════════════════════════════════════════

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.copy(CAMERA_START_POS);
    camera.lookAt(0, 0, 0);

    // WebGL renderer — draws background plane, grid, lights, any 3D helpers.
    const webglRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    webglRenderer.setPixelRatio(window.devicePixelRatio);
    webglRenderer.setSize(window.innerWidth, window.innerHeight);
    webglRenderer.setClearColor(0x000000, 0);
    webglRenderer.domElement.id = 'webgl-layer';
    document.body.appendChild(webglRenderer.domElement);

    // Billboards layer — a plain <div> that holds every iframe/placeholder
    // as an absolutely-positioned child. Each frame we compute the child's
    // screen position/scale from its world position + the camera, and write
    // it into left/top/transform/zIndex. OrbitControls is attached here so
    // drags and wheels on empty background reach the camera controller.
    const billboardsLayer = document.createElement('div');
    billboardsLayer.id = 'billboards-layer';
    document.body.appendChild(billboardsLayer);

    // ══════════════════════════════════════════════════════════════════════════
    //  LIGHTS (kept for any future 3D content — CSS3DObjects ignore lighting,
    //  and the background plane uses MeshBasicMaterial so it's self-lit.)
    // ══════════════════════════════════════════════════════════════════════════
    const ambient = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight.position.set(6, 10, 6);
    dirLight.target.position.set(0, 0, 0);
    scene.add(dirLight);
    scene.add(dirLight.target);

    // ══════════════════════════════════════════════════════════════════════════
    //  BACKGROUND IMAGE (PNG from Utilities/Renderer/, parented to the camera)
    //
    //  Parenting to the camera means it always orbits with the camera and the
    //  camera always faces it — it behaves like a skybox card. We use
    //  MeshBasicMaterial so lighting doesn't affect it, and push it far out
    //  (large plane at local z = -120) so nothing in the scene ever clips it.
    //  depthWrite:false + renderOrder:-999 keep it behind everything else.
    //
    //  The image is served by Flask via /utilities/renderer/<filename> (see
    //  2_stock_visualizer.py → utilities_renderer route). Filename contains
    //  spaces so we encodeURI it explicitly.
    // ══════════════════════════════════════════════════════════════════════════
    const BG_IMAGE_URL = '/utilities/renderer/' + encodeURIComponent('Screenshot 2025-07-12 083355.png');

    const bgMaterial = new THREE.MeshBasicMaterial({
      color:      0xffffff,
      depthWrite: false,
      depthTest:  false,
      toneMapped: false,
    });

    new THREE.TextureLoader().load(
      BG_IMAGE_URL,
      (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        bgMaterial.map = tex;
        bgMaterial.needsUpdate = true;
      },
      undefined,
      (err) => console.warn('Background image failed to load:', err)
    );

    const bgPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(400, 240),
      bgMaterial
    );
    bgPlane.position.set(0, 0, -120);   // local to the camera → in front of it
    bgPlane.renderOrder = -999;
    camera.add(bgPlane);
    scene.add(camera);                  // required for the camera child to render

    // ══════════════════════════════════════════════════════════════════════════
    //  BILLBOARDS (manually projected from 3D world → 2D screen every frame)
    //
    //  Each entry is: { element, worldPos: Vector3, interactive: bool, ticker }
    //    element      — DOM node (iframe or div) absolutely positioned in the
    //                   billboards layer
    //    worldPos     — fixed 3D position (center of ring / ring slots)
    //    interactive  — true for chart iframes, false for placeholders
    //    ticker       — current ticker symbol (empty string for placeholders)
    // ══════════════════════════════════════════════════════════════════════════
    const billboards = [];

    // ══════════════════════════════════════════════════════════════════════════
    //  RING GEOMETRY — dynamic radius + center shift
    //
    //  For n ≤ RING_EXPAND_THRESHOLD the ring sits at BASE_RING_RADIUS
    //  around the origin. For n > THRESHOLD the radius scales linearly
    //  (R = BASE * n / THRESHOLD) to keep the arc-spacing between adjacent
    //  billboards constant. Each time the radius grows / shrinks the ring
    //  center shifts AWAY FROM / TOWARD the camera in the XZ plane by the
    //  same amount, which preserves the distance from the camera to the
    //  closest billboard — i.e. the "zoom" adapts automatically.
    //
    //  computeDesiredRadius(n)    → ideal radius for n billboards
    //  adjustRingGeometry(n)      → mutates circleRadius + ringCenter +
    //                                controls.target + centerBillboard
    // ══════════════════════════════════════════════════════════════════════════
    function computeDesiredRadius(n) {
      if (n <= RING_EXPAND_THRESHOLD) return BASE_RING_RADIUS;
      return BASE_RING_RADIUS * n / RING_EXPAND_THRESHOLD;
    }

    /**
     * Update ring radius and orbit center for a ring of `n` billboards.
     *
     * The center is shifted along the camera → oldCenter direction in the
     * XZ plane by exactly (newRadius − oldRadius). Because the shift equals
     * the radius delta, the XZ distance from the camera to the closest
     * billboard (D_xz − R) stays constant — so the visual "zoom" doesn't
     * change. The orbit-controls target and the center billboard world
     * position are kept in sync with ringCenter.
     */
    function adjustRingGeometry(n) {
      const newRadius = computeDesiredRadius(n);
      const shift = newRadius - circleRadius;
      if (Math.abs(shift) < 1e-6) return;

      // Direction: from camera toward current ring center in the XZ plane.
      const dx = ringCenter.x - camera.position.x;
      const dz = ringCenter.z - camera.position.z;
      const len = Math.sqrt(dx * dx + dz * dz);
      if (len > 1e-6) {
        ringCenter.x += shift * (dx / len);
        ringCenter.z += shift * (dz / len);
      }
      circleRadius = newRadius;

      // Keep center billboard and orbit controls in sync.
      if (centerBillboard) centerBillboard.worldPos.copy(ringCenter);
      if (controls) {
        controls.target.copy(ringCenter);
        controls.minDistance = getMinOrbitDistance();
        controls.maxDistance = MAX_ORBIT_DISTANCE + (circleRadius - BASE_RING_RADIUS);
        controls.update();
      }
    }

    // Every ring slot — filled or blank — is an interactive iframe. A blank
    // slot loads the chart template without a ?ticker= param so the user can
    // later type a ticker into the top-bar input and have the Go button fill
    // it in. (The center slot is a separate non-interactive placeholder div
    // built by makeCenterPlaceholder below.)
    function makeChartElement(ticker) {
      const iframe = document.createElement('iframe');
      iframe.className = 'chart-frame';
      let src = `${CHART_URL}?period=${encodeURIComponent(initialPeriod)}`
              + `&theme=${encodeURIComponent(currentTheme)}`
              + `&bg=${encodeURIComponent(currentBillboardBg)}`;
      if (ticker) src += `&ticker=${encodeURIComponent(ticker)}`;
      iframe.src = src;
      iframe.style.width  = IFRAME_WIDTH_PX  + 'px';
      iframe.style.height = IFRAME_HEIGHT_PX + 'px';
      iframe.setAttribute('allow', 'fullscreen');
      iframe.setAttribute('loading', 'eager');
      return iframe;
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  FOCUS SANITIZER
    //
    //  Even with the 2D projection fix, Chrome still holds keyboard focus on
    //  whichever iframe was last clicked. That by itself is fine, but it can
    //  leave a subtly-stale wheel-event target in some edge cases. Releasing
    //  focus on pointerleave makes scroll routing deterministic — the next
    //  wheel event always hit-tests fresh against the element under cursor.
    //
    //  We preserve focus when an <input>/<textarea> inside the iframe has it
    //  so the user can keep typing in the search box while moving the cursor.
    // ══════════════════════════════════════════════════════════════════════════
    function attachFocusSanitizer(iframe) {
      iframe.addEventListener('pointerleave', () => {
        if (document.activeElement !== iframe) return;
        try {
          const inner = iframe.contentDocument && iframe.contentDocument.activeElement;
          if (inner && (inner.tagName === 'INPUT' || inner.tagName === 'TEXTAREA')) return;
        } catch (_) { /* cross-origin safety — same origin in practice */ }
        iframe.blur();
      });
    }

    function addBillboard(ticker, worldPos) {
      const el = makeChartElement(ticker);
      const isIframe = el.tagName === 'IFRAME';
      if (isIframe) attachFocusSanitizer(el);
      // Hide until the first projection frame so nothing flashes at (0,0).
      el.style.display = 'none';
      billboardsLayer.appendChild(el);
      billboards.push({
        element:     el,
        worldPos:    worldPos.clone(),
        interactive: isIframe,
        ticker:      (isIframe && ticker) ? String(ticker).toUpperCase() : '',
      });
    }

    // 1) MainObject at origin — placeholder div (NOT a ticker chart).
    //    This slot is reserved for something to be defined later.
    function makeCenterPlaceholder() {
      const div = document.createElement('div');
      div.className   = 'center-placeholder';
      div.style.width  = IFRAME_WIDTH_PX  + 'px';
      div.style.height = IFRAME_HEIGHT_PX + 'px';
      div.textContent  = '— placeholder —';
      // No interactive content → pointer-events:none so it can't block
      // scroll/click events destined for ring billboards behind it.
      div.style.pointerEvents = 'none';
      return div;
    }
    // The center billboard is tracked by reference so ring-only operations
    // (redistribute / add / remove) can filter it out.
    // Apply the initial ring geometry — if the cached session had > 8
    // billboards the ring is already expanded on first paint. The shift
    // direction uses CAMERA_START_POS (camera isn't orbited yet).
    {
      const n = initialRingTickers.length;
      circleRadius = computeDesiredRadius(n);
      if (n > RING_EXPAND_THRESHOLD) {
        // Shift center away from camera START position in the XZ plane.
        const dx = -CAMERA_START_POS.x;   // origin → camera, negated = away
        const dz = -CAMERA_START_POS.z;
        const len = Math.sqrt(dx * dx + dz * dz);
        if (len > 1e-6) {
          const shift = circleRadius - BASE_RING_RADIUS;
          ringCenter.set(shift * dx / len, 0, shift * dz / len);
        }
      }
    }

    let centerBillboard = null;
    {
      const el = makeCenterPlaceholder();
      el.style.display = 'none';
      billboardsLayer.appendChild(el);
      centerBillboard = {
        element:     el,
        worldPos:    ringCenter.clone(),
        interactive: false,
        ticker:      '',
      };
      billboards.push(centerBillboard);
    }

    // 2) Ring chart iframes evenly spaced on a circle in the XZ plane.
    //    The list of tickers (and therefore the ring size) comes from
    //    initialRingTickers, which was resolved above from the URL query and
    //    the cached session. Every slot — filled or blank — is an interactive
    //    iframe so the top-bar ticker input can target any of them.
    {
      const n = initialRingTickers.length;
      for (let i = 0; i < n; i++) {
        const angle = (i / n) * Math.PI * 2;
        const pos = new THREE.Vector3(
          ringCenter.x + Math.cos(angle) * circleRadius,
          0,
          ringCenter.z + Math.sin(angle) * circleRadius
        );
        addBillboard(initialRingTickers[i] || '', pos);
      }
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  ORBIT CONTROLS
    // ══════════════════════════════════════════════════════════════════════════
    // Attach to the billboards layer (top layer) so it receives drags on
    // empty background space. Events inside an iframe are trapped by the
    // iframe's own browsing context and never reach OrbitControls — so
    // clicks on period buttons, search, scroll-zoom etc. all reach the chart.
    const controls = new OrbitControls(camera, billboardsLayer);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enablePan     = false;                 // stay focused on the ring
    // Wheel zoom is handled by our own inertia model below (not OrbitControls)
    // so each wheel tick kicks a velocity that decays over several frames,
    // giving the camera a coasting/gliding feel between detents. Wheel events
    // inside a chart iframe are trapped by the iframe's own document and never
    // bubble out, so the chart's time-range zoom is unaffected.
    controls.enableZoom    = false;
    controls.zoomSpeed     = 0.8;
    controls.minDistance   = getMinOrbitDistance();
    controls.maxDistance   = MAX_ORBIT_DISTANCE + (circleRadius - BASE_RING_RADIUS);
    controls.target.copy(ringCenter);
    controls.rotateSpeed   = 1.0;
    // Right-mouse-button drags the orbit; left button does nothing so clicks
    // inside chart iframes stay untouched (period buttons, search, etc.).
    controls.mouseButtons = {
      LEFT:   null,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT:  THREE.MOUSE.ROTATE,
    };
    controls.update();

    // Suppress the browser's native context menu on the 3D layer so the
    // right-click-drag doesn't pop a menu mid-orbit. The HUD is a sibling
    // above this layer so its controls are unaffected.
    billboardsLayer.addEventListener('contextmenu', (e) => e.preventDefault());
    webglRenderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

    // ══════════════════════════════════════════════════════════════════════════
    //  ZOOM INERTIA (custom wheel handler)
    //
    //  Pure impulse-and-decay: each wheel tick adds to a zoom VELOCITY, and
    //  every animation frame we apply the velocity to the camera radius and
    //  multiply the velocity by a friction factor. When friction brings the
    //  velocity near zero the camera naturally coasts to a stop.
    //
    //  Working in log-radius means the motion looks the same whether zooming
    //  in or out — a kick of +v shrinks r by the same visual fraction that a
    //  kick of −v grows it by.
    // ══════════════════════════════════════════════════════════════════════════
    let _zoomVel = 0;                           // velocity in log(r) / frame
    const ZOOM_KICK_PER_PIXEL = 0.00018;        // impulse added per wheel pixel
    const ZOOM_FRICTION       = 0.88;           // per-frame velocity retention
    const ZOOM_VEL_EPS        = 1e-5;           // below this, clamp to 0

    billboardsLayer.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      // Normalize deltaY across input devices.
      //   deltaMode 0 = pixels (most mice ≈ ±100 per notch)
      //   deltaMode 1 = lines  (older Firefox)
      //   deltaMode 2 = pages
      let dy = ev.deltaY;
      if (ev.deltaMode === 1) dy *= 16;
      if (ev.deltaMode === 2) dy *= 400;
      // dy > 0 means wheel-down → zoom out → log(r) should grow.
      _zoomVel += dy * ZOOM_KICK_PER_PIXEL * controls.zoomSpeed;
    }, { passive: false });

    // Apply the current zoom velocity to the camera once per frame, then decay.
    const _zoomDir = new THREE.Vector3();
    function stepZoomInertia() {
      if (_zoomVel === 0) return;
      _zoomDir.subVectors(camera.position, controls.target);
      const r = _zoomDir.length();
      if (r > 1e-6) {
        let newR = r * Math.exp(_zoomVel);
        const minDist = getMinOrbitDistance();
        if (newR < minDist) { newR = minDist; _zoomVel = 0; }
        if (newR > controls.maxDistance) { newR = controls.maxDistance; _zoomVel = 0; }
        _zoomDir.setLength(newR);
        camera.position.copy(controls.target).add(_zoomDir);
      }
      _zoomVel *= ZOOM_FRICTION;
      if (Math.abs(_zoomVel) < ZOOM_VEL_EPS) _zoomVel = 0;
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  PERIOD-SYNC HUB
    //
    //  Each chart iframe changes its own period when the user wheel-zooms or
    //  clicks a period button. The iframe then posts {type:'sv-period', period}
    //  to its parent (this window). We forward that message to every OTHER
    //  billboard iframe so they all stay in sync on the same time window.
    // ══════════════════════════════════════════════════════════════════════════
    window.addEventListener('message', (ev) => {
      const d = ev.data;
      if (!d || d.type !== 'sv-period' || typeof d.period !== 'string') return;
      // Forward to every other iframe so they all sync up.
      for (const b of billboards) {
        if (!b.interactive) continue;                    // skip placeholders
        const el = b.element;
        if (el.contentWindow === ev.source) continue;    // skip originator
        try {
          el.contentWindow.postMessage({ type: 'sv-period', period: d.period }, '*');
        } catch (_) { /* cross-origin safety net — same-origin in practice */ }
      }
      // Update the top-bar highlight so it reflects chart-initiated changes
      // (e.g. wheel-zoom inside a billboard that auto-switches period).
      if (typeof setGlobalPeriod === 'function') {
        setGlobalPeriod(d.period, /*fromBroadcast=*/true);
      }
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  HAMBURGER MENU toggle (top-left)
    //
    //  Clicking the bars icon slides the panel in from the left and swaps the
    //  icon to a white X. Clicking again closes. CSS handles the icon swap and
    //  the slide animation via the body.menu-open class.
    // ══════════════════════════════════════════════════════════════════════════
    const $menuToggle = document.getElementById('menu-toggle');
    $menuToggle.addEventListener('click', () => {
      document.body.classList.toggle('menu-open');
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  USER PREFERENCES — slider + theme + reset-view wiring
    //
    //  The key definitions, default values, and lsSet/lsGet helpers live up
    //  near the theme module so the session-restore logic can reach them.
    //  Here we only wire the DOM elements to those helpers. Slider values
    //  are INTENTIONALLY not touched by the "Reset view" button, which is
    //  scoped to camera position/target only.
    // ══════════════════════════════════════════════════════════════════════════

    // Orbit-speed slider (lives inside the menu panel).
    const $speed    = document.getElementById('orbit-speed');
    const $speedVal = document.getElementById('orbit-speed-val');
    function applyOrbitSpeed(v, persist) {
      controls.rotateSpeed    = v;
      $speed.value            = String(v);
      $speedVal.textContent   = v.toFixed(2);
      if (persist) lsSet(LS_ORBIT_SPEED_KEY, v);
    }
    $speed.addEventListener('input', () => {
      applyOrbitSpeed(parseFloat($speed.value), /*persist=*/true);
    });

    // Scroll-gain slider — controls OrbitControls.zoomSpeed, i.e. how many
    // world units the camera dollies per wheel tick.
    const $scroll    = document.getElementById('scroll-gain');
    const $scrollVal = document.getElementById('scroll-gain-val');
    function applyScrollGain(v, persist) {
      controls.zoomSpeed    = v;
      $scroll.value         = String(v);
      $scrollVal.textContent = v.toFixed(2);
      if (persist) lsSet(LS_SCROLL_GAIN_KEY, v);
    }
    $scroll.addEventListener('input', () => {
      applyScrollGain(parseFloat($scroll.value), /*persist=*/true);
    });

    // Theme selector — the THEMES object / applyTheme / currentTheme /
    // broadcastTheme were already set up near the top of the script; here we
    // just wire the <select> element to them and persist the choice.
    const $themeSelect = document.getElementById('theme-select');
    $themeSelect.value = currentTheme;
    $themeSelect.addEventListener('change', () => {
      applyTheme($themeSelect.value);
      lsSet(LS_THEME_KEY, currentTheme);
      broadcastTheme();
    });

    // Billboard background selector — broadcasts sv-bg to all chart iframes.
    // LS_BG_KEY, DEFAULT_BG, currentBillboardBg declared near the top
    // (before makeChartElement) so initial iframes get the correct ?bg= param.
    function broadcastBillboardBg() {
      if (typeof billboards === 'undefined') return;
      for (const b of billboards) {
        if (!b || !b.interactive) continue;
        const el = b.element;
        if (!el || el.tagName !== 'IFRAME') continue;
        try {
          el.contentWindow.postMessage(
            { type: 'sv-bg', bg: currentBillboardBg }, '*');
        } catch (_) {}
      }
    }

    const $bgSelect = document.getElementById('billboard-bg-select');
    $bgSelect.value = currentBillboardBg;
    $bgSelect.addEventListener('change', () => {
      currentBillboardBg = $bgSelect.value;
      lsSet(LS_BG_KEY, currentBillboardBg);
      broadcastBillboardBg();
    });

    // Restore saved preferences (or defaults) before the first render.
    // persist=false because we're replaying the stored value, not overwriting it.
    applyOrbitSpeed(lsGetNumber(LS_ORBIT_SPEED_KEY, DEFAULT_ORBIT_SPEED, 0.1, 3), false);
    applyScrollGain(lsGetNumber(LS_SCROLL_GAIN_KEY, DEFAULT_SCROLL_GAIN, 0.1, 3), false);

    // ══════════════════════════════════════════════════════════════════════════
    //  RESET VIEW
    //
    //  Restores the original camera position and orbit target. Billboards
    //  themselves sit at fixed world positions (a ring around the origin),
    //  so snapping the camera back to CAMERA_START_POS also snaps every
    //  billboard back to its initial screen position/size.
    //
    //  NOTE: the orbit-speed and scroll-gain sliders are NOT touched here —
    //  they are user preferences persisted across sessions in localStorage
    //  and must survive a view reset.
    // ══════════════════════════════════════════════════════════════════════════
    const $resetView = document.getElementById('reset-view');
    $resetView.addEventListener('click', () => {
      // Restore the camera to its default position RELATIVE to the
      // current ring center (which may have shifted for >8 billboards).
      camera.position.set(
        ringCenter.x + CAMERA_START_POS.x,
        CAMERA_START_POS.y,
        ringCenter.z + CAMERA_START_POS.z
      );
      controls.target.copy(ringCenter);
      // Flush any residual rotation damping from OrbitControls so the
      // reset is instantaneous.
      controls.update();
      // Reset billboard background to white
      currentBillboardBg = DEFAULT_BG;
      $bgSelect.value = DEFAULT_BG;
      lsSet(LS_BG_KEY, DEFAULT_BG);
      broadcastBillboardBg();
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  CHAT DIALOG — toggle button (bottom-right) + floating container
    // ══════════════════════════════════════════════════════════════════════════
    const $chatToggle    = document.getElementById('chat-toggle');
    const $chatContainer = document.getElementById('chat-container');
    const $chatCollapse  = document.getElementById('chat-collapse');

    $chatToggle.addEventListener('click', () => {
      $chatContainer.classList.add('open');
      $chatToggle.style.display = 'none';
    });
    $chatCollapse.addEventListener('click', () => {
      $chatContainer.classList.remove('open');
      $chatToggle.style.display = '';
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  TOP PERIOD BAR
    //
    //  Controls every billboard's time window at once. Click a button → we
    //  update the local active state and broadcast {type:'sv-period', period}
    //  directly to every chart iframe. The period-sync hub above forwards any
    //  iframe-initiated period change (wheel zoom inside a chart) to the others,
    //  AND we listen for those here so the top-bar highlight stays in sync.
    // ══════════════════════════════════════════════════════════════════════════
    // PERIODS was declared up near the session-restore block so the
    // cache-replay logic can reach it. currentPeriod starts at whatever
    // the session restore decided (URL query or cached value or default).
    let currentPeriod = initialPeriod;

    const $periodRow = document.getElementById('period-row');
    const periodButtons = {};
    PERIODS.forEach(p => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pbtn';
      btn.textContent = p.toUpperCase();
      btn.dataset.period = p;
      btn.addEventListener('click', () => setGlobalPeriod(p, /*fromBroadcast=*/false));
      $periodRow.appendChild(btn);
      periodButtons[p] = btn;
    });

    function updatePeriodHighlight() {
      for (const p of PERIODS) {
        periodButtons[p].classList.toggle('active', p === currentPeriod);
      }
    }
    updatePeriodHighlight();

    function broadcastPeriodToAll(p) {
      for (const b of billboards) {
        if (!b.interactive) continue;
        try {
          b.element.contentWindow.postMessage({ type: 'sv-period', period: p }, '*');
        } catch (_) { /* same-origin safety net */ }
      }
    }

    function setGlobalPeriod(p, fromBroadcast) {
      if (!PERIODS.includes(p) || p === currentPeriod) return;
      currentPeriod = p;
      updatePeriodHighlight();
      if (!fromBroadcast) broadcastPeriodToAll(p);
      persistSession();
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  TICKER INPUT (bound to the billboard closest to the camera)
    //
    //  Every animation frame we find the closest interactive billboard and,
    //  unless the user is currently typing in the input, reflect that
    //  billboard's ticker in the input box. Clicking Go (or pressing Enter)
    //  resolves the entered text via /api/resolve (falling back to the raw
    //  upper-cased text) and rewrites the closest billboard's iframe src so
    //  it loads the new ticker at the current period.
    // ══════════════════════════════════════════════════════════════════════════
    const $tickerInput = document.getElementById('ticker-input');
    const $tickerGo    = document.getElementById('ticker-go');

    function findClosestInteractiveBillboard() {
      let best = null, bestD = Infinity;
      for (const b of billboards) {
        if (!b.interactive) continue;
        const d = b.worldPos.distanceTo(camera.position);
        if (d < bestD) { bestD = d; best = b; }
      }
      return best;
    }

    let _lastClosestBillboard = null;
    function refreshTickerInput() {
      // Don't clobber what the user is currently typing.
      if (document.activeElement === $tickerInput) return;
      const b = findClosestInteractiveBillboard();
      if (b === _lastClosestBillboard) return;
      _lastClosestBillboard = b;
      $tickerInput.value = b ? b.ticker : '';
    }

    async function runTickerUpdate() {
      const raw = $tickerInput.value.trim();
      if (!raw) return;
      // Try to resolve company names / fuzzy input to a real ticker. Fall
      // back to the raw upper-cased string if the resolve endpoint fails.
      let ticker = raw.toUpperCase();
      try {
        const res = await fetch(`/api/resolve?q=${encodeURIComponent(raw)}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.ticker) ticker = String(data.ticker).toUpperCase();
        }
      } catch (_) { /* network blip — use raw uppercased */ }

      const target = findClosestInteractiveBillboard();
      if (!target) return;
      target.ticker = ticker;
      // Rewrite the iframe src so the chart reloads with the new ticker at
      // the current global period.
      target.element.src =
        `${CHART_URL}?ticker=${encodeURIComponent(ticker)}`
      + `&period=${encodeURIComponent(currentPeriod)}`
      + `&theme=${encodeURIComponent(currentTheme)}`
      + `&bg=${encodeURIComponent(currentBillboardBg)}`;
      $tickerInput.value = ticker;
      $tickerInput.blur();
      // Force the next refresh to re-apply (avoids a stale cache match).
      _lastClosestBillboard = null;
      persistSession();
    }

    $tickerGo.addEventListener('click', runTickerUpdate);
    $tickerInput.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); runTickerUpdate(); }
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  RING SIZE CONTROLS  (+  /  −)
    //
    //  "+"  adds a new interactive billboard at the position closest to the
    //       camera along the ring, then redistributes every ring billboard
    //       evenly around the circle so one slot always faces the camera.
    //  "−"  removes whichever ring billboard is currently closest to the
    //       camera, then redistributes the rest evenly.
    //  Bounds: ring size is clamped to [1, 100].
    //
    //  "Closest to the camera" here means at the angle on the ring that
    //  minimizes distance to the camera: atan2(camera.z, camera.x) in the XZ
    //  plane (the analytic solution for a point on a radius-R circle).
    // ══════════════════════════════════════════════════════════════════════════
    const RING_MIN = 1;
    const RING_MAX = 100;

    function getRingBillboards() {
      return billboards.filter(b => b !== centerBillboard);
    }

    function findClosestRingBillboard() {
      let best = null, bestD = Infinity;
      for (const b of billboards) {
        if (b === centerBillboard) continue;
        const d = b.worldPos.distanceTo(camera.position);
        if (d < bestD) { bestD = d; best = b; }
      }
      return best;
    }

    /**
     * Redistribute every ring billboard evenly around circleRadius centred
     * on ringCenter so that slot 0 sits at the angle on the ring closest
     * to the camera. If `priority` is given and is a ring billboard, it is
     * placed at slot 0; the rest keep their existing relative order and
     * fill slots 1..n-1.
     */
    function recomputeRingPositions(priority) {
      const ring = getRingBillboards();
      const n = ring.length;
      if (n === 0) return;

      let ordered;
      if (priority && ring.includes(priority)) {
        ordered = [priority, ...ring.filter(b => b !== priority)];
      } else {
        ordered = ring;
      }

      // Angle from ring center to camera (XZ plane).
      const cameraAngle = Math.atan2(
        camera.position.z - ringCenter.z,
        camera.position.x - ringCenter.x
      );
      for (let i = 0; i < n; i++) {
        const angle = cameraAngle + (i / n) * Math.PI * 2;
        ordered[i].worldPos.set(
          ringCenter.x + Math.cos(angle) * circleRadius,
          0,
          ringCenter.z + Math.sin(angle) * circleRadius,
        );
      }
    }

    /**
     * Create a fresh interactive iframe with no ticker and add it to the
     * ring. The resulting billboard is placed at slot 0 (closest to camera).
     * No-op when already at RING_MAX.
     */
    function addClosestRingBillboard() {
      const ring = getRingBillboards();
      if (ring.length >= RING_MAX) return;
      const iframe = document.createElement('iframe');
      iframe.className   = 'chart-frame';
      // No ticker param → template shows an empty chart. The user can fill
      // it via the ticker input beside this button.
      iframe.src         = `${CHART_URL}?period=${encodeURIComponent(currentPeriod)}`
                         + `&theme=${encodeURIComponent(currentTheme)}`
                         + `&bg=${encodeURIComponent(currentBillboardBg)}`;
      iframe.style.width  = IFRAME_WIDTH_PX  + 'px';
      iframe.style.height = IFRAME_HEIGHT_PX + 'px';
      iframe.setAttribute('allow', 'fullscreen');
      iframe.setAttribute('loading', 'eager');
      attachFocusSanitizer(iframe);
      iframe.style.display = 'none';  // hidden until the next projection frame
      billboardsLayer.appendChild(iframe);
      const b = {
        element:     iframe,
        worldPos:    new THREE.Vector3(),
        interactive: true,
        ticker:      '',
      };
      billboards.push(b);
      // Expand ring geometry if crossing the threshold (radius + center shift).
      adjustRingGeometry(ring.length + 1);
      recomputeRingPositions(b);
      _lastClosestBillboard = null;   // force ticker input to refresh
      updateRingButtonState();
      persistSession();
    }

    /**
     * Remove whichever ring billboard is currently closest to the camera,
     * then redistribute the survivors. No-op when already at RING_MIN.
     */
    function removeClosestRingBillboard() {
      const ring = getRingBillboards();
      if (ring.length <= RING_MIN) return;
      const target = findClosestRingBillboard();
      if (!target) return;
      // Detach from the DOM and splice from the master billboards array.
      if (target.element && target.element.parentNode) {
        target.element.parentNode.removeChild(target.element);
      }
      const idx = billboards.indexOf(target);
      if (idx >= 0) billboards.splice(idx, 1);
      if (_lastClosestBillboard === target) _lastClosestBillboard = null;
      // Shrink ring geometry if still above the threshold (radius + center shift).
      adjustRingGeometry(ring.length - 1);
      recomputeRingPositions();
      updateRingButtonState();
      persistSession();
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  RING SWAP  (←  /  →)
    //
    //  Swap the closest ring billboard (T, the "ticker billboard") with its
    //  screen-left or screen-right neighbor on the ring, then rotate the
    //  camera around the Y axis by the same angle T moved so T stays
    //  horizontally centered on screen — i.e. T remains closest to the
    //  camera after the swap.
    //
    //  "Screen-left" / "screen-right" is computed by projecting the two
    //  ring-adjacent billboards onto the camera's world-space right vector:
    //  the one with a more negative dot product is on the left, the more
    //  positive one is on the right. This is robust to any camera yaw.
    //
    //  Net visual effect: T stays front-and-center, the whole scene appears
    //  to rotate by one slot, and the ring-ordering of tickers has shifted
    //  one step in the clicked direction. The arrow buttons are disabled
    //  while the ring contains fewer than 2 billboards (nothing to swap).
    // ══════════════════════════════════════════════════════════════════════════
    const _swapTmpA   = new THREE.Vector3();
    const _swapTmpB   = new THREE.Vector3();
    const _swapRight  = new THREE.Vector3();
    const _swapOffset = new THREE.Vector3();
    const _yAxis      = new THREE.Vector3(0, 1, 0);

    function swapRingNeighbor(direction) {
      // direction = -1 (left arrow) or +1 (right arrow)
      const ring = getRingBillboards();
      if (ring.length < 2) return;

      const T = findClosestRingBillboard();
      if (!T) return;

      // Sort the ring by angle around the ring center (XZ plane). Because
      // recomputeRingPositions always lays billboards on an evenly spaced
      // circle — and swaps only shuffle which billboard occupies which
      // slot — the angle-sorted order is always the true ring-neighbor order.
      const sorted = ring.slice().sort(
        (a, b) =>
          Math.atan2(a.worldPos.z - ringCenter.z, a.worldPos.x - ringCenter.x) -
          Math.atan2(b.worldPos.z - ringCenter.z, b.worldPos.x - ringCenter.x)
      );
      const n    = sorted.length;
      const tIdx = sorted.indexOf(T);
      const prev = sorted[(tIdx - 1 + n) % n];
      const next = sorted[(tIdx + 1) % n];

      // Project each candidate onto the camera's world-space +X vector to
      // decide which is screen-left and which is screen-right of T.
      _swapRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
      const prevDot = _swapTmpA.subVectors(prev.worldPos, T.worldPos).dot(_swapRight);
      const nextDot = _swapTmpB.subVectors(next.worldPos, T.worldPos).dot(_swapRight);

      // screen-left  = more negative dot   (direction = -1)
      // screen-right = more positive dot   (direction = +1)
      const wantLeft = (direction < 0);
      let neighbor;
      if (prev === next) {
        // Ring of size 2 — there's only one "other" billboard; both
        // buttons act on the same target.
        neighbor = prev;
      } else if (wantLeft) {
        neighbor = (prevDot < nextDot) ? prev : next;
      } else {
        neighbor = (prevDot > nextDot) ? prev : next;
      }

      // Capture T's and neighbor's old angles (relative to ring center)
      // BEFORE mutating worldPos — the camera rotation delta is derived
      // from these, not from the camera's current angle.
      const tOldAngle = Math.atan2(
        T.worldPos.z - ringCenter.z, T.worldPos.x - ringCenter.x);
      const nOldAngle = Math.atan2(
        neighbor.worldPos.z - ringCenter.z, neighbor.worldPos.x - ringCenter.x);

      // Swap the two world positions. All other billboards stay put.
      _swapTmpA.copy(T.worldPos);
      T.worldPos.copy(neighbor.worldPos);
      neighbor.worldPos.copy(_swapTmpA);

      // Rotate the camera so that its own atan2(z,x) angle follows T
      // from tOldAngle to nOldAngle. Three.js's applyAxisAngle(+Y, α)
      // rotates a point right-hand-rule around +Y, which DECREASES its
      // atan2(z,x) angle by α — so the rotation amount we pass is
      // (tOldAngle - nOldAngle), not the reverse. Wrap into [-π, π] to
      // always pick the short way around.
      let delta = tOldAngle - nOldAngle;
      if (delta >  Math.PI) delta -= 2 * Math.PI;
      if (delta < -Math.PI) delta += 2 * Math.PI;

      _swapOffset.subVectors(camera.position, controls.target);
      _swapOffset.applyAxisAngle(_yAxis, delta);
      camera.position.copy(controls.target).add(_swapOffset);
      // Flush any residual damping so the new orientation is instant.
      controls.update();

      // T is still the closest to the camera (we moved the camera to
      // follow), but _lastClosestBillboard may be stale via object identity
      // comparisons that compare positions too — force a refresh anyway.
      _lastClosestBillboard = null;

      persistSession();
    }

    const $ringLeft  = document.getElementById('ring-left');
    const $ringMinus = document.getElementById('ring-minus');
    const $ringPlus  = document.getElementById('ring-plus');
    const $ringRight = document.getElementById('ring-right');

    function updateRingButtonState() {
      const n = getRingBillboards().length;
      $ringMinus.disabled = (n <= RING_MIN);
      $ringPlus .disabled = (n >= RING_MAX);
      // Nothing to swap with unless there are at least 2 ring billboards.
      const canSwap = (n >= 2);
      $ringLeft .disabled = !canSwap;
      $ringRight.disabled = !canSwap;
    }

    $ringPlus .addEventListener('click', addClosestRingBillboard);
    $ringMinus.addEventListener('click', removeClosestRingBillboard);
    $ringLeft .addEventListener('click', () => swapRingNeighbor(-1));
    $ringRight.addEventListener('click', () => swapRingNeighbor(+1));
    updateRingButtonState();

    // Write the freshly-resolved initial session (URL query ∪ cache) back to
    // localStorage. On a URL-launch this promotes the URL params into the
    // cache so the next blank launch restores them. On a blank-launch this
    // is a no-op overwrite.
    persistSession();

    // ══════════════════════════════════════════════════════════════════════════
    //  ZOOM CLAMP — keep a background margin around every billboard
    //
    //  OrbitControls' minDistance clamps distance-to-target, not
    //  distance-to-nearest-billboard. Since the ring billboards sit 7 units
    //  from the origin, the camera can still get arbitrarily close to one of
    //  them even while respecting minDistance. If it does, the billboard's
    //  rendered size balloons and the iframe fills the whole screen, leaving
    //  no background pixels under the cursor — the user can no longer right-
    //  click-drag to orbit or scroll-wheel to zoom out.
    //
    //  Approach: for a given camera view direction (unit vector v from the
    //  orbit target), find the smallest camera-to-target radius r such that
    //  EVERY billboard is at least dMinRequired away from the camera. This
    //  is the minimum orbit radius along the current view ray.
    //
    //  Geometry: camera at target + r*v, billboard offset d_p = billboard - target.
    //  Distance² = |r*v - d_p|² = r² − 2r(v·d_p) + |d_p|². We need this ≥ dMin².
    //    r² − 2r(v·d_p) + (|d_p|² − dMin²) ≥ 0
    //  Upward parabola in r, roots at r = (v·d_p) ± √((v·d_p)² − |d_p|² + dMin²).
    //  The "safe far side" root is r_high = dot + √disc; if disc ≤ 0 the
    //  billboard is always far enough regardless of r. Take max(r_high) over
    //  all billboards and clamp to [MIN_ORBIT_DISTANCE, MAX_ORBIT_DISTANCE].
    //
    //  Called from the animation loop, so both wheel-driven dolly and
    //  right-click orbit into a tighter configuration push the camera out
    //  whenever it would otherwise let a billboard fill the screen.
    // ══════════════════════════════════════════════════════════════════════════
    const BILLBOARD_MAX_SCREEN_FRAC = 0.85; // billboard may fill ≤ 85% of each axis

    function computeMarginDMin() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const fovRad     = camera.fov * Math.PI / 180;
      const halfFovTan = Math.tan(fovRad * 0.5);
      // scale_px = IFRAME_DIM_PX * BILLBOARD_SCALE * h / (2 * d * halfFovTan)
      // Want scale_px ≤ viewportDim * frac → solve for d.
      const dMinWidth =
        (IFRAME_WIDTH_PX  * BILLBOARD_SCALE * h) /
        (2 * w * BILLBOARD_MAX_SCREEN_FRAC * halfFovTan);
      const dMinHeight =
        (IFRAME_HEIGHT_PX * BILLBOARD_SCALE * h) /
        (2 * h * BILLBOARD_MAX_SCREEN_FRAC * halfFovTan);
      return Math.max(dMinWidth, dMinHeight);
    }

    const _viewDir = new THREE.Vector3();
    const _offset  = new THREE.Vector3();

    function computeEnforcedMinRadius() {
      _viewDir.subVectors(camera.position, controls.target);
      const viewLen = _viewDir.length();
      if (viewLen < 1e-6) return getMinOrbitDistance();
      _viewDir.multiplyScalar(1 / viewLen);

      const dMin    = computeMarginDMin();
      const dMinSq  = dMin * dMin;

      let minR = getMinOrbitDistance();
      for (const b of billboards) {
        _offset.subVectors(b.worldPos, controls.target);
        const dot    = _viewDir.dot(_offset);
        const offLen = _offset.lengthSq();
        const disc   = dot * dot - offLen + dMinSq;
        if (disc <= 0) continue;                 // always safe regardless of r
        const rHigh = dot + Math.sqrt(disc);     // minimum safe r for this billboard
        if (rHigh > minR) minR = rHigh;
      }
      return Math.min(controls.maxDistance, minR);
    }

    function enforceBillboardMargin() {
      const enforcedMin = computeEnforcedMinRadius();
      _viewDir.subVectors(camera.position, controls.target);
      const curR = _viewDir.length();
      if (curR < 1e-6) return;
      if (curR >= enforcedMin) return;
      _viewDir.multiplyScalar(1 / curR);
      camera.position.copy(controls.target).addScaledVector(_viewDir, enforcedMin);
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  BILLBOARD PROJECTOR
    //
    //  For each billboard:
    //    1. Project its fixed world position into normalized device coords
    //       via camera.projectionMatrix × camera.matrixWorldInverse.
    //    2. If it's behind the camera or outside the near/far clip, hide it.
    //    3. Convert NDC to screen pixels and write to element.style.left/top.
    //    4. Compute the perspective-correct scale so a 1-world-unit object
    //       appears at its proper on-screen size, then apply as a plain 2D
    //       translate(-50%,-50%) + scale(s) transform.
    //    5. Assign zIndex by distance so closer billboards paint on top.
    //
    //  Because the final transform is 2D only, each iframe's hit-box equals
    //  its visible rectangle — no CSS3D AABB leakage, no pointer-event
    //  crosstalk between billboards regardless of camera angle.
    // ══════════════════════════════════════════════════════════════════════════
    const _ndc = new THREE.Vector3();
    let _lastScaleBroadcast = 0;
    function updateBillboardProjection() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      // World pixels per world unit, one unit from the camera, at this FOV.
      // Derivation: at distance d, a world-size s projects to s*(h/(2*d*tan(fov/2)))
      // on screen. Our iframe has a native pixel width IFRAME_WIDTH_PX and a
      // desired world width IFRAME_WIDTH_PX*BILLBOARD_SCALE, so its CSS
      // scale factor at distance d is BILLBOARD_SCALE * h / (2*d*tan(fov/2)).
      const fovRad        = camera.fov * Math.PI / 180;
      const halfFovTan    = Math.tan(fovRad * 0.5);
      const scaleNumerator = BILLBOARD_SCALE * h / (2 * halfFovTan);

      // Track sort order for zIndex. Farthest gets lowest zIndex.
      const ordered = billboards
        .map((b, i) => ({ b, i, d: b.worldPos.distanceTo(camera.position) }))
        .sort((a, b) => b.d - a.d);

      for (let rank = 0; rank < ordered.length; rank++) {
        const { b, d } = ordered[rank];
        const el = b.element;

        // Project world position → NDC
        _ndc.copy(b.worldPos).project(camera);
        // project() returns (x,y in [-1,1], z in [-1,1] when in front; >1 means
        // behind camera or past the far plane)
        const inFront = _ndc.z > -1 && _ndc.z < 1;
        if (!inFront) {
          if (el.style.display !== 'none') el.style.display = 'none';
          continue;
        }
        if (el.style.display === 'none') el.style.display = '';

        const sx = ( _ndc.x * 0.5 + 0.5) * w;
        const sy = (-_ndc.y * 0.5 + 0.5) * h;
        const scale = scaleNumerator / d;

        el.style.left      = sx + 'px';
        el.style.top       = sy + 'px';
        el.style.transform = `translate(-50%, -50%) scale(${scale})`;
        el.style.zIndex    = String(rank + 1);

      }

      // Send sv-scale to every interactive iframe (throttled to ~5 Hz)
      // so the price panel can counter-scale to constant apparent text size.
      const now = performance.now();
      if (now - _lastScaleBroadcast > 200) {
        _lastScaleBroadcast = now;
        const refScale = ordered.length
          ? scaleNumerator / ordered[ordered.length - 1].d
          : 1;
        for (const { b } of ordered) {
          if (!b.interactive) continue;
          const el = b.element;
          if (el.tagName !== 'IFRAME') continue;
          const s = scaleNumerator / b.worldPos.distanceTo(camera.position);
          try {
            el.contentWindow.postMessage(
              { type: 'sv-scale', scale: s, refScale }, '*');
          } catch (_) {}
        }
      }
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  ANIMATION LOOP
    // ══════════════════════════════════════════════════════════════════════════
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      stepZoomInertia();                 // apply & decay zoom velocity
      enforceBillboardMargin();          // push camera out if any billboard too close
      camera.updateMatrixWorld();

      webglRenderer.render(scene, camera);
      updateBillboardProjection();
      refreshTickerInput();              // mirror closest billboard's ticker
    }
    animate();

    // ══════════════════════════════════════════════════════════════════════════
    //  RESIZE
    // ══════════════════════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      webglRenderer.setSize(w, h);
      // billboardsLayer is CSS-sized (100%/100%), so no resize call needed;
      // updateBillboardProjection() will re-project on the next frame.
    });
  </script>
</body>
</html>
