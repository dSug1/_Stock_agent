<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Visualizer — 3D Scene</title>

  <style>
    /* ── Theme tokens ──────────────────────────────────────────────────── */
    :root {
      --accent: #58a6ff;
      --bg: #000000;
      --fg: #3a3a50;
      --text: #c0c8d8;
      --btn-bg: #454558;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #ffffff; --fg: #e0e0e0; --text: #404050; --btn-bg: #f0f0f0; }
      #period-topbar .pbtn.active { color: #606878; }
    }
    :root.force-dark {
      --bg: #000000; --fg: #3a3a50; --text: #c0c8d8; --btn-bg: #454558;
    }
    :root.force-dark #period-topbar .pbtn.active { color: #fff; }
    :root.force-light {
      --bg: #ffffff; --fg: #e0e0e0; --text: #404050; --btn-bg: #f0f0f0;
    }
    :root.force-light #period-topbar .pbtn.active { color: #606878; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      /* Kill text-selection and mobile tap-highlight flashes when clicking
         on the billboards background layer. The HUD slider still works
         because <input> elements opt back in via the #hud rule below. */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Remove focus rings on non-input elements (the layers and their
       wrapper divs would otherwise flash a browser outline on click). */
    #webgl-layer, #billboards-layer, #billboards-layer > * { outline: none; }
    #menu-panel, #menu-panel *, #period-topbar, #period-topbar *,
    #ticker-input-group, #ticker-input-group *,
    #ring-size-controls, #ring-size-controls *,
    #overlay-wrapper, #overlay-wrapper * {
      user-select: auto; -webkit-user-select: auto;
    }

    /* Stacked renderer layers.
       - WebGL canvas sits behind with pointer-events: none so it doesn't
         intercept clicks destined for the iframe billboards or OrbitControls.
       - Billboards layer sits on top with pointer-events: auto so its DOM
         children (the iframes) can receive events, and OrbitControls
         (attached to this container) receives drags on empty background. */
    #webgl-layer, #billboards-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #webgl-layer     { pointer-events: none; z-index: 1; }
    #billboards-layer { pointer-events: auto; z-index: 2; }

    /* Each billboard element is absolutely positioned; its left/top/transform
       are rewritten every frame by the projector in JS. We intentionally AVOID
       any 3D transform here — plain 2D translate + scale — so each iframe's
       hit-box is exactly its visible rectangle on screen. That's the whole
       point of the manual-projection approach: Chrome's CSS3D iframe hit-test
       uses a 2D AABB of the transformed quad which leaks far beyond the
       visible area, breaking pointer events on other billboards. */
    #billboards-layer > * {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 50% 50%;
      will-change: transform, left, top;
    }

    /* ── Hamburger menu toggle (top-left) ──────────────────────────────── */
    #menu-toggle {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 26;
      width: 36px;
      height: 36px;
      background: var(--bg);
      border: 1px solid var(--fg);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 0;
    }
    #menu-toggle svg {
      width: 20px;
      height: 20px;
      stroke: var(--text);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    /* The two icon SVGs swap visibility via the .open class on the body. */
    #menu-toggle .icon-close  { display: none; }
    body.menu-open #menu-toggle .icon-bars  { display: none; }
    body.menu-open #menu-toggle .icon-close { display: block; }

    /* ── Slide-in menu panel (left side) ───────────────────────────────── */
    #menu-panel {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 260px;
      z-index: 25;
      background: var(--bg);
      border-right: 1px solid var(--fg);
      padding: 66px 20px 20px 20px;
      font-size: 13px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transform: translateX(-100%);
      transition: transform 0.25s ease-out;
      box-shadow: 4px 0 24px #0006;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    body.menu-open #menu-panel { transform: translateX(0); }

    #display-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #menu-panel label {
      display: grid;
      grid-template-columns: 80px 1fr 40px;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      margin: 0;
    }
    #menu-panel input[type=range] {
      width: 100%;
      accent-color: var(--fg);
    }
    #menu-panel .val {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    #menu-panel .title {
      color: var(--text);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    /* Collapsible "Display" header — button styled like a section title */
    #menu-panel .display-toggle {
      background: transparent;
      border: none;
      padding: 0;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
    }
    #menu-panel .display-toggle .arrow {
      transition: transform .15s;
      font-size: 10px;
      opacity: 0.7;
    }
    #menu-panel .display-toggle[aria-expanded="false"] .arrow {
      transform: rotate(-90deg);
    }
    #menu-panel .display-toggle:hover { color: var(--accent); }
    #display-group.collapsed { display: none; }
    #menu-panel .menu-btn {
      background: var(--btn-bg);
      border: 1px solid var(--fg);
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      padding: 2px 8px;
      margin: 0;
      transition: all .15s;
    }
    #menu-panel .menu-btn:hover {
      background: transparent;
      border-color: var(--accent);
    }

    /* ── Period-button bar — top-center by default, bottom when chat open ─ */
    #period-topbar {
      position: fixed;
      z-index: 21;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background: var(--bg);
      border: 1px solid var(--fg);
      border-radius: 6px;
      padding: 6px 8px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
    }
    /* When chat is open: move to bottom center */
    body.chat-open #period-topbar {
      top: auto;
      bottom: 16px;
    }
    #period-row {
      display: flex;
      gap: 2px;
      align-items: center;
    }
    #period-topbar .pbtn {
      flex: 1;
      text-align: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 3px;
      color: var(--text);
      cursor: pointer;
      font-size: 10px;
      padding: 3px 0;
      font-family: inherit;
      transition: all .15s;
    }
    #period-topbar .pbtn:hover { border-color: var(--fg); color: var(--text); }
    #period-topbar .pbtn.active {
      background: var(--fg);
      border-color: var(--fg);
      color: #fff;
      font-weight: 600;
    }

    /* Ring-size +/- controls inside the menu panel. */
    #ring-size-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #ring-size-controls button {
      background: var(--btn-bg);
      border: 1px solid var(--fg);
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }
    #ring-size-controls button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }
    #ring-size-controls button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Ticker input group — sits inside the chat container. Visible only
       when the chat is open but NOT fully expanded. Reflects the ticker
       of the billboard closest to the camera; typing + Go (or Enter)
       rewrites that billboard to the entered ticker. */
    #ticker-input-group {
      display: none;
      align-items: center;
      gap: 4px;
    }
    #ticker-input {
      background: transparent;
      border: 1px solid var(--fg);
      border-radius: 4px;
      color: var(--text);
      padding: 4px 8px;
      width: 140px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    #ticker-input:focus { border-color: var(--accent); }
    #ticker-input::placeholder { color: var(--text); opacity: 0.4; }

    /* ── Chat body — repurposed as the per-ticker detail container.
       Hidden in states 0 (closed) and 1 (half-open); only shown in state 2
       (fully-open), where it fills the remaining vertical space below the
       closest ticker row and hosts ticker-specific data / chat. ── */
    #chat-body {
      display: none;
      padding: 10px 14px;
      overflow-y: auto;
      color: var(--text);
      font-size: 13px;
    }
    #chat-body .cb-ticker {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent, #58a6ff);
      margin-bottom: 4px;
    }
    #chat-body .cb-company {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 12px;
    }
    #chat-body .cb-placeholder {
      font-size: 12px;
      opacity: 0.5;
      font-style: italic;
    }

    /* Blank-slot placeholder shown when there aren't enough tickers.
       Sized dynamically by JS to match IFRAME_WIDTH_PX / IFRAME_HEIGHT_PX.
       Non-interactive on purpose — scroll/click over it should reach
       OrbitControls on the billboards layer behind, just like empty bg. */
    .blank-slot {
      background: var(--bg);
      border: 1px solid var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-family: inherit;
      font-size: 24px;
      letter-spacing: 0.15em;
      pointer-events: none;
    }

    /* The iframes themselves: backdrop + thin border. */
    .chart-frame {
      border: 1px solid var(--fg);
      background: var(--bg);
      display: block;
    }
    .chart-frame.no-detail { border-color: transparent; }

    /* Central-object placeholder — stands in for something to be defined later.
       Same pixel dimensions as the billboards so the ring geometry stays
       balanced. Pointer-events stay on so wheel-to-zoom still works here. */
    .center-placeholder {
      border: 1px dashed var(--fg);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 22px;
      letter-spacing: 0.18em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* ── Chat bottom row — ring controls + ticker input (chat-open, not expanded) ──
       margin-right matches #ticker-list-scroll (padding-right: 6px) so the Go
       button's right edge aligns with where the ticker rows' text ends. */
    #chat-bottom-row {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      margin-right: 6px;
      min-width: 0;
    }
    #chat-bottom-row #ring-size-controls { flex: 0 0 auto; }
    #chat-bottom-row #ticker-input-group { flex: 1 1 auto; min-width: 0; display: flex; }
    #ticker-input-group #ticker-input { width: 0; flex: 1; min-width: 30px; }
    #ticker-go-btn {
      padding: 4px 8px;
      font-size: 11px;
    }

    /* ── Overlay wrapper — holds price-overlay + giraffe button side by side ── */
    #overlay-wrapper {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: none;
      align-items: center;
      gap: 8px;
    }
    #overlay-wrapper.visible { display: flex; }
    /* When chat is open: dock top-right, height adapts to row count.
       max-height clamps the overlay so it never extends past the viewport
       even with a high ticker count — the ticker list inside shrinks to fit
       and scrolls, keeping the bottom-row controls visible. */
    body.chat-open #overlay-wrapper {
      top: 16px;
      bottom: auto;
      right: 16px;
      left: auto;
      transform: none;
      align-items: stretch;
      max-height: calc(100vh - 32px);
    }

    /* ── Price info overlay ───────────────────────────────────────────── */
    #price-overlay {
      position: relative;
      background: var(--bg);
      border: 1px solid var(--fg);
      border-radius: 6px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    /* Row 1 (single-row at bottom: ticker + company + price + change + status) */
    .po-row1 { display: flex; align-items: center; gap: 10px; }
    /* Row 2 (price + change + status — shown only in two-row chat-open mode) */
    .po-row2 { display: none; align-items: center; gap: 10px; }
    /* Separator line between ticker info and chat — hidden by default */
    .po-separator { display: none; border: none; border-top: 1px solid var(--fg); margin: 8px 0 0 0; width: 100%; }

    #price-overlay .po-ticker {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    #price-overlay .po-company {
      font-size: 13px;
      color: var(--text);
      opacity: 0.6;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #price-overlay .po-price {
      font-size: 16px;
      font-weight: 700;
    }
    #price-overlay .po-change {
      font-size: 13px;
      font-weight: 600;
    }
    #price-overlay .po-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid;
    }
    #price-overlay .po-status.open   { color: #3fb950; border-color: #3fb950; }
    #price-overlay .po-status.closed { color: var(--text); opacity: 0.5; border-color: var(--fg); }
    /* Giraffe button — sits outside #price-overlay, to its right */
    #ticker-go {
      background: var(--fg);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 2px;
      width: var(--giraffe-size, 36px);
      height: var(--giraffe-size, 36px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .15s;
      flex-shrink: 0;
    }
    #ticker-go img {
      width: 60%;
      height: 60%;
      object-fit: contain;
    }
    #ticker-go:hover { opacity: .85; }
    /* Hide giraffe when chat is open */
    body.chat-open #ticker-go { display: none; }

    /* Chat state button — top-right of overlay, cycles expand/reduce/close */
    #chat-state-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: 1px solid var(--fg);
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
      font-size: 10px;
      width: 22px;
      height: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      z-index: 1;
    }
    #chat-state-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* When chat is open: switch overlay to column layout with chat body */
    body.chat-open #overlay-wrapper {
      width: calc(100vw / 3);
      min-width: 320px;
    }
    body.chat-open #price-overlay {
      flex-direction: column;
      gap: 4px;
      align-items: stretch;
      width: 100%;
      min-width: 0;
      padding-right: 36px; /* room for expand/close buttons */
      overflow: hidden;
    }
    body.chat-open .po-row1 { display: none; }
    body.chat-open .po-row2 { display: none; }
    body.chat-open .po-separator { display: none; }
    body.chat-open #chat-state-btn { display: flex; }
    body.chat-open #ticker-list { display: block; }
    body.chat-open #chat-bottom-row { display: flex; }
    body.chat-open.chat-expanded #chat-bottom-row { display: none; }

    /* Expanded mode — full-height container.
       Only the closest billboard's row is visible, anchored to the top; the
       rest of the vertical space is reserved for the chat UI. */
    body.chat-open.chat-expanded #overlay-wrapper { top: 16px; bottom: 16px; }
    body.chat-open.chat-expanded #price-overlay   { flex: 1; }
    body.chat-open.chat-expanded #ticker-list {
      display: flex;
      flex: 0 0 auto;
      min-height: 0;
      justify-content: flex-start;
    }
    body.chat-open.chat-expanded #ticker-list-scroll {
      overflow: hidden;
      flex: 0 0 auto;
    }
    body.chat-open.chat-expanded .tl-row:not(.closest) { display: none; }
    body.chat-open.chat-expanded .tl-sep              { display: none; }
    body.chat-open.chat-expanded #chat-body {
      display: block;
      flex: 1 1 0;
      min-height: 0;
      border-top: 1px solid var(--fg);
      margin-top: 6px;
      padding-top: 10px;
    }

    /* ── Ticker list (multi-row billboard list inside chat) ── */
    #ticker-list {
      display: none;
      flex-direction: column;
      justify-content: center;
      position: relative;
      width: 100%;
      overflow: hidden;
    }
    #ticker-list-scroll {
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-width: thin;
    }
    .tl-row {
      display: flex;
      align-items: center;
      gap: calc(8px * var(--ticker-row-scale, 1));
      height: calc(22px * var(--ticker-row-scale, 1));
      padding: 0;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    .tl-row:hover .tl-ticker { color: var(--accent, #58a6ff); }
    .tl-row.closest .tl-ticker { color: var(--accent, #58a6ff); }
    .tl-ticker {
      font-size: calc(13px * var(--ticker-row-scale, 1));
      font-weight: 700;
      color: var(--text);
      min-width: calc(52px * var(--ticker-row-scale, 1));
    }
    .tl-company {
      font-size: calc(11px * var(--ticker-row-scale, 1));
      color: var(--text);
      opacity: 0.6;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    .tl-price {
      font-size: calc(13px * var(--ticker-row-scale, 1));
      font-weight: 700;
    }
    .tl-change {
      font-size: calc(11px * var(--ticker-row-scale, 1));
      font-weight: 600;
    }
    .tl-sep {
      border: none;
      border-top: 1px solid var(--fg);
      margin: 0;
      width: 100%;
    }
    /* ── Per-row giraffe button (state 1 only) ── */
    .tl-giraffe-btn {
      display: none;
      background: var(--fg);
      border: none;
      border-radius: 3px;
      cursor: pointer;
      padding: 0;
      width: calc(16px * var(--ticker-row-scale, 1));
      height: calc(16px * var(--ticker-row-scale, 1));
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity .15s;
      margin-left: 4px;
    }
    .tl-giraffe-btn:hover { opacity: .75; }
    .tl-giraffe-btn img {
      width: 65%;
      height: 65%;
      object-fit: contain;
      pointer-events: none;
    }
    body.chat-open:not(.chat-expanded) .tl-giraffe-btn { display: flex; }
  </style>

  <!-- Three.js ES modules pinned to 0.160.0.
       The importmap lets the module script below use bare specifiers
       like `three` and `three/addons/...`. -->
  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Hamburger toggle: three white bars → white X when menu is open. -->
  <button id="menu-toggle" type="button" aria-label="Toggle menu">
    <svg class="icon-bars"  viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    <svg class="icon-close" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </button>

  <!-- Slide-in menu panel on the left. Contains the orbit-speed and
       scroll-gain sliders plus the reset-view button. -->
  <div id="menu-panel">
    <button id="display-toggle" class="title display-toggle" type="button" aria-expanded="false">
      <span>Display</span><span class="arrow">▼</span>
    </button>
    <div id="display-group" class="collapsed">
      <div class="title">Theme <button id="theme-toggle" class="menu-btn" type="button">Dark</button> <button id="charttype-toggle" class="menu-btn" type="button">Candle</button></div>
      <div class="title">Camera <button id="reset-view" class="menu-btn" type="button">Reset view</button></div>
      <label>
        Orbit speed
        <input id="orbit-speed" type="range" min="0.1" max="3" step="0.05" value="1">
        <span id="orbit-speed-val" class="val">1.00</span>
      </label>
      <label>
        Scroll gain
        <input id="scroll-gain" type="range" min="0.1" max="3" step="0.05" value="0.8">
        <span id="scroll-gain-val" class="val">0.80</span>
      </label>
    </div>
  </div>

  <!-- Period buttons — above the price overlay at bottom, or at bottom-center when chat open. -->
  <div id="period-topbar">
    <div id="period-row"></div>
  </div>

  <div id="overlay-wrapper">
    <div id="price-overlay">
      <div class="po-row1">
        <span class="po-ticker"></span>
        <span class="po-company"></span>
        <span class="po-price"></span>
        <span class="po-change"></span>
        <span class="po-status closed"></span>
      </div>
      <div class="po-row2">
        <span class="po-price"></span>
        <span class="po-change"></span>
        <span class="po-status closed"></span>
      </div>
      <hr class="po-separator">
      <div id="ticker-list">
        <div id="ticker-list-scroll"></div>
      </div>
      <div id="chat-body"></div>
      <div id="chat-bottom-row">
        <div id="ring-size-controls">
          <button id="ring-left"  type="button" title="Swap the closest billboard with its left neighbor and recenter">←</button>
          <button id="ring-minus" type="button" title="Remove the billboard closest to the camera">−</button>
          <button id="ring-plus"  type="button" title="Add a billboard at the position closest to the camera">+</button>
          <button id="ring-right" type="button" title="Swap the closest billboard with its right neighbor and recenter">→</button>
        </div>
        <div id="ticker-input-group">
          <input id="ticker-input" type="text" placeholder="Ticker" autocomplete="off" spellcheck="false">
          <button id="ticker-go-btn" class="menu-btn" type="button">Go</button>
        </div>
      </div>
      <button id="chat-state-btn" type="button" aria-label="Chat state">+</button>
    </div>
    <button id="ticker-go" type="button" title="Chat"><img src="/utilities/renderer/logo.png" alt="Chat"></button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    // NOTE: we deliberately do NOT use CSS3DRenderer here. Chrome hit-tests
    // CSS3D-transformed iframes by the 2D AABB of their transformed quad,
    // which leaks far beyond the visible area once the camera gets close to
    // a billboard — so clicks/wheels on other billboards fall through to the
    // wrong target. Instead we project each billboard's 3D world position to
    // 2D screen coordinates manually and use a plain translate+scale, which
    // gives each iframe a pixel-accurate hit-box.

    // ══════════════════════════════════════════════════════════════════════════
    //  CONFIGURATION
    // ══════════════════════════════════════════════════════════════════════════

    // Tickers and time window are provided by run.bat (→ 2_stock_visualizer.py)
    // via URL query params: ?tickers=AAPL,MSFT,GOOGL&period=1mo
    // The Python launcher prompts the user interactively, resolves ticker
    // symbols, pre-fetches data, then opens the browser at this URL. When
    // the URL has no tickers/period params, the session-restore block below
    // falls back to the last cached session in localStorage.
    const _params = new URLSearchParams(location.search);

    const CIRCLE_COUNT      = 6;        // default ring size on very first launch
    const BASE_RING_RADIUS  = 7;        // world units — ring radius for ≤ 8 billboards
    // When the ring has more than RING_EXPAND_THRESHOLD billboards, the radius
    // scales linearly to maintain the same arc-spacing as an 8-billboard ring.
    // The orbit center (and center billboard) shifts away from / toward the
    // camera so the closest billboard stays at the same distance.
    const RING_EXPAND_THRESHOLD = 8;
    let   circleRadius      = BASE_RING_RADIUS;
    const ringCenter        = new THREE.Vector3(0, 0, 0);
    const IFRAME_WIDTH_PX   = 800;      // iframe pixel width
    const IFRAME_HEIGHT_PX  = 500;      // iframe pixel height
    // Billboard world size = IFRAME_*_PX × BILLBOARD_SCALE.
    // At 0.004 that's 3.2 × 2.0 world units — fits inside a radius-7 ring
    // (adjacent centers are 7 units apart → 3.8 units gap between billboards)
    // while still staying readable when viewed from ~14 units away.
    const BILLBOARD_SCALE   = 0.004;
    const CHART_URL         = "_outputs/templates/1_chart_template.html";


    // ══════════════════════════════════════════════════════════════════════════
    //  USER PREFERENCES — localStorage helpers
    //
    //  Everything a user can adjust (orbit speed, scroll gain, period,
    //  ring size, per-slot tickers) is persisted to localStorage on every
    //  change and restored at startup, so a "production mode" launch comes up
    //  exactly how the previous session was left.
    //
    //  URL query params from the Python launcher (?tickers=…&period=…) count
    //  as fresh intent for *this* session and override the cached session
    //  when present — but they are also written back to the cache so the
    //  next blank launch picks them up.
    // ══════════════════════════════════════════════════════════════════════════
    const LS_ORBIT_SPEED_KEY  = 'sv.orbitSpeed';
    const LS_SCROLL_GAIN_KEY  = 'sv.scrollGain';
    const LS_SESSION_KEY      = 'sv.session';      // {period, ringTickers:[...]}
    const DEFAULT_ORBIT_SPEED = 1.0;
    const DEFAULT_SCROLL_GAIN = 0.8;

    // Safe localStorage accessors — fall back silently if storage is disabled
    // (private browsing, iframe with blocked 3rd-party storage, etc.).
    function lsSet(key, value) {
      try { localStorage.setItem(key, String(value)); } catch (_) {}
    }
    function lsGetNumber(key, fallback, min, max) {
      try {
        const raw = localStorage.getItem(key);
        if (raw == null) return fallback;
        const v = parseFloat(raw);
        if (!Number.isFinite(v)) return fallback;
        return Math.min(max, Math.max(min, v));
      } catch (_) { return fallback; }
    }
    function lsSetJSON(key, obj) {
      try { localStorage.setItem(key, JSON.stringify(obj)); } catch (_) {}
    }
    function lsGetJSON(key) {
      try {
        const raw = localStorage.getItem(key);
        if (raw == null) return null;
        return JSON.parse(raw);
      } catch (_) { return null; }
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  LIGHT / DARK OVERRIDE
    //
    //  Values: null = follow OS, 'light', 'dark'.
    //  Applies a force-light / force-dark class on <html> which overrides
    //  the @media (prefers-color-scheme) CSS rules.
    // ══════════════════════════════════════════════════════════════════════════
    const LS_MODE_KEY = 'sv.mode';
    let _modeOverride = null;   // null | 'light' | 'dark'
    try {
      const raw = localStorage.getItem(LS_MODE_KEY);
      if (raw === 'light' || raw === 'dark') _modeOverride = raw;
    } catch (_) {}

    function isLightMode() {
      if (_modeOverride) return _modeOverride === 'light';
      return window.matchMedia('(prefers-color-scheme: light)').matches;
    }

    function applyModeOverride() {
      const root = document.documentElement;
      root.classList.remove('force-light', 'force-dark');
      if (_modeOverride) root.classList.add('force-' + _modeOverride);
    }
    applyModeOverride();

    // ══════════════════════════════════════════════════════════════════════════
    //  SESSION RESTORE
    //
    //  Decide the initial period + ring tickers by combining URL query params
    //  (Python launcher) with the cached session. URL params win when present
    //  and non-empty; otherwise we replay the cache; otherwise we fall back
    //  to CIRCLE_COUNT blank slots.
    // ══════════════════════════════════════════════════════════════════════════
    const PERIODS = ['1d','5d','1mo','3mo','6mo','1y','2y','5y','max'];
    const DEFAULT_PERIOD = '1d';

    const _cachedSession = lsGetJSON(LS_SESSION_KEY);
    const _urlTickersRaw = _params.get('tickers');     // null | "" | "A,B,C"
    const _urlPeriodRaw  = _params.get('period');      // null | "1mo" | …

    // Resolve initial ring tickers. Empty string in a slot means "blank
    // interactive iframe ready for the Go button" — NOT a non-interactive
    // placeholder (those are only for the center slot).
    let initialRingTickers;
    if (_urlTickersRaw !== null && _urlTickersRaw.trim().length > 0) {
      // Python launcher provided a non-empty ticker list — use it verbatim.
      initialRingTickers = _urlTickersRaw
        .split(',').map(s => s.trim()).filter(Boolean);
    } else if (
      _cachedSession &&
      Array.isArray(_cachedSession.ringTickers) &&
      _cachedSession.ringTickers.length > 0
    ) {
      initialRingTickers = _cachedSession.ringTickers
        .map(t => (typeof t === 'string' ? t : ''));
    } else {
      initialRingTickers = new Array(CIRCLE_COUNT).fill('');
    }

    // Resolve initial period.
    let initialPeriod = DEFAULT_PERIOD;
    if (_urlPeriodRaw && PERIODS.includes(_urlPeriodRaw)) {
      initialPeriod = _urlPeriodRaw;
    }
    // Cached session period intentionally ignored — always start at DEFAULT_PERIOD
    // unless overridden by URL param.

    // Snapshot the current session state to localStorage. Called after every
    // user-driven mutation (period change, ticker update, ring +/-) AND once
    // after the initial billboard loop completes, so URL-launch state is
    // captured into the cache on the first blank-launch.
    //
    // Safe to reference `billboards` and `getRingBillboards` even though they
    // are declared later — persistSession is only invoked at event-time, by
    // which point the entire module has finished executing.
    function persistSession() {
      if (typeof billboards === 'undefined') return;
      if (typeof getRingBillboards !== 'function') return;
      const ringTickers = getRingBillboards().map(b => (b && b.ticker) || '');
      lsSetJSON(LS_SESSION_KEY, {
        period:      currentPeriod,
        ringTickers: ringTickers,
      });
    }

    // Camera placed far enough back that the full ring + center fit on
    // screen with empty background space around them — required for
    // OrbitControls drag-to-rotate to receive pointerdowns (iframes
    // capture their own).
    // MIN_ORBIT_DISTANCE is the hard floor: the camera can never orbit
    // closer to the ring center than this. It must be ≥ circleRadius so
    // the camera never enters the ring (which causes billboards to flip
    // behind the camera and triggers violent zoom-out corrections).
    // A small margin (1 wu) keeps things comfortable.
    const MIN_ORBIT_MARGIN   = 1;
    function getMinOrbitDistance() { return circleRadius + MIN_ORBIT_MARGIN; }
    const MAX_ORBIT_DISTANCE = 40;
    // Halved distance to the front billboard (was (0, 4, 14), ~8 wu from the
    // closest billboard's face) so the billboard appears roughly twice its
    // previous size at startup and on reset-view. XZ direction preserved so
    // the >8-billboard ring-shift logic below still points the right way.
    const CAMERA_START_POS   = new THREE.Vector3(0, 2, 10.5);

    // ══════════════════════════════════════════════════════════════════════════
    //  SCENE / CAMERA / RENDERERS
    // ══════════════════════════════════════════════════════════════════════════

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(isLightMode() ? 0xffffff : 0x000000);

    function syncSceneBackground() {
      const light = isLightMode();
      scene.background = new THREE.Color(light ? 0xffffff : 0x000000);
      if (typeof _cameraDirty !== 'undefined') _cameraDirty = true;
      // Broadcast to all chart iframes so they reskin immediately.
      if (typeof billboards !== 'undefined') {
        for (const b of billboards) {
          if (!b || !b.interactive) continue;
          const el = b.element;
          if (!el || el.tagName !== 'IFRAME') continue;
          try { el.contentWindow.postMessage({ type: 'sv-mode', light }, '*'); }
          catch (_) {}
        }
      }
    }
    // OS theme change — only matters when no manual override is active.
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
      if (!_modeOverride) syncSceneBackground();
    });

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.copy(CAMERA_START_POS);
    camera.lookAt(0, 0, 0);

    // WebGL renderer — draws background plane, grid, lights, any 3D helpers.
    const webglRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    webglRenderer.setPixelRatio(window.devicePixelRatio);
    webglRenderer.setSize(window.innerWidth, window.innerHeight);
    webglRenderer.setClearColor(0x000000, 0);
    webglRenderer.domElement.id = 'webgl-layer';
    document.body.appendChild(webglRenderer.domElement);

    // Billboards layer — a plain <div> that holds every iframe/placeholder
    // as an absolutely-positioned child. Each frame we compute the child's
    // screen position/scale from its world position + the camera, and write
    // it into left/top/transform/zIndex. OrbitControls is attached here so
    // drags and wheels on empty background reach the camera controller.
    const billboardsLayer = document.createElement('div');
    billboardsLayer.id = 'billboards-layer';
    document.body.appendChild(billboardsLayer);

    // ══════════════════════════════════════════════════════════════════════════
    //  LIGHTS (kept for any future 3D content — CSS3DObjects ignore lighting,
    //  and the background plane uses MeshBasicMaterial so it's self-lit.)
    // ══════════════════════════════════════════════════════════════════════════
    const ambient = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight.position.set(6, 10, 6);
    dirLight.target.position.set(0, 0, 0);
    scene.add(dirLight);
    scene.add(dirLight.target);

    // ══════════════════════════════════════════════════════════════════════════
    //  BILLBOARDS (manually projected from 3D world → 2D screen every frame)
    //
    //  Each entry is: { element, worldPos: Vector3, interactive: bool, ticker }
    //    element      — DOM node (iframe or div) absolutely positioned in the
    //                   billboards layer
    //    worldPos     — fixed 3D position (center of ring / ring slots)
    //    interactive  — true for chart iframes, false for placeholders
    //    ticker       — current ticker symbol (empty string for placeholders)
    // ══════════════════════════════════════════════════════════════════════════
    const billboards = [];

    // ══════════════════════════════════════════════════════════════════════════
    //  RING GEOMETRY — dynamic radius + center shift
    //
    //  For n ≤ RING_EXPAND_THRESHOLD the ring sits at BASE_RING_RADIUS
    //  around the origin. For n > THRESHOLD the radius scales linearly
    //  (R = BASE * n / THRESHOLD) to keep the arc-spacing between adjacent
    //  billboards constant. Each time the radius grows / shrinks the ring
    //  center shifts AWAY FROM / TOWARD the camera in the XZ plane by the
    //  same amount, which preserves the distance from the camera to the
    //  closest billboard — i.e. the "zoom" adapts automatically.
    //
    //  computeDesiredRadius(n)    → ideal radius for n billboards
    //  adjustRingGeometry(n)      → mutates circleRadius + ringCenter +
    //                                controls.target + centerBillboard
    // ══════════════════════════════════════════════════════════════════════════
    function computeDesiredRadius(n) {
      if (n <= RING_EXPAND_THRESHOLD) return BASE_RING_RADIUS;
      return BASE_RING_RADIUS * n / RING_EXPAND_THRESHOLD;
    }

    /**
     * Update ring radius and orbit center for a ring of `n` billboards.
     *
     * The center is shifted along the camera → oldCenter direction in the
     * XZ plane by exactly (newRadius − oldRadius). Because the shift equals
     * the radius delta, the XZ distance from the camera to the closest
     * billboard (D_xz − R) stays constant — so the visual "zoom" doesn't
     * change. The orbit-controls target and the center billboard world
     * position are kept in sync with ringCenter.
     */
    function adjustRingGeometry(n) {
      const newRadius = computeDesiredRadius(n);
      const shift = newRadius - circleRadius;
      if (Math.abs(shift) < 1e-6) return;

      // Direction: from camera toward current ring center in the XZ plane.
      const dx = ringCenter.x - camera.position.x;
      const dz = ringCenter.z - camera.position.z;
      const len = Math.sqrt(dx * dx + dz * dz);
      if (len > 1e-6) {
        ringCenter.x += shift * (dx / len);
        ringCenter.z += shift * (dz / len);
      }
      circleRadius = newRadius;

      // Keep center billboard and orbit controls in sync.
      if (centerBillboard) centerBillboard.worldPos.copy(ringCenter);
      if (controls) {
        controls.target.copy(ringCenter);
        controls.minDistance = getMinOrbitDistance();
        controls.maxDistance = MAX_ORBIT_DISTANCE + (circleRadius - BASE_RING_RADIUS);
        controls.update();
      }
    }

    // Every ring slot — filled or blank — is an interactive iframe. A blank
    // slot loads the chart template without a ?ticker= param so the user can
    // later type a ticker into the top-bar input and have the Go button fill
    // it in. (The center slot is a separate non-interactive placeholder div
    // built by makeCenterPlaceholder below.)
    function makeChartElement(ticker) {
      const iframe = document.createElement('iframe');
      iframe.className = 'chart-frame';
      let src = `${CHART_URL}?period=${encodeURIComponent(initialPeriod)}`
        ;
      if (ticker) src += `&ticker=${encodeURIComponent(ticker)}`;
      iframe.src = src;
      iframe.style.width  = IFRAME_WIDTH_PX  + 'px';
      iframe.style.height = IFRAME_HEIGHT_PX + 'px';
      iframe.setAttribute('allow', 'fullscreen');
      iframe.setAttribute('loading', 'eager');
      iframe.addEventListener('load', () => {
        try { iframe.contentWindow.postMessage({ type: 'sv-mode', light: isLightMode() }, '*'); } catch (_) {}
        try { iframe.contentWindow.postMessage({ type: 'sv-detail', show: false }, '*'); } catch (_) {}
      }, { once: true });
      return iframe;
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  FOCUS SANITIZER
    //
    //  Even with the 2D projection fix, Chrome still holds keyboard focus on
    //  whichever iframe was last clicked. That by itself is fine, but it can
    //  leave a subtly-stale wheel-event target in some edge cases. Releasing
    //  focus on pointerleave makes scroll routing deterministic — the next
    //  wheel event always hit-tests fresh against the element under cursor.
    //
    //  We preserve focus when an <input>/<textarea> inside the iframe has it
    //  so the user can keep typing in the search box while moving the cursor.
    // ══════════════════════════════════════════════════════════════════════════
    function attachFocusSanitizer(iframe) {
      iframe.addEventListener('pointerleave', () => {
        if (document.activeElement !== iframe) return;
        try {
          const inner = iframe.contentDocument && iframe.contentDocument.activeElement;
          if (inner && (inner.tagName === 'INPUT' || inner.tagName === 'TEXTAREA')) return;
        } catch (_) { /* cross-origin safety — same origin in practice */ }
        iframe.blur();
      });
    }

    function addBillboard(ticker, worldPos) {
      const el = makeChartElement(ticker);
      const isIframe = el.tagName === 'IFRAME';
      if (isIframe) attachFocusSanitizer(el);
      // Hide until the first projection frame so nothing flashes at (0,0).
      el.style.display = 'none';
      billboardsLayer.appendChild(el);
      billboards.push({
        element:     el,
        worldPos:    worldPos.clone(),
        interactive: isIframe,
        ticker:      (isIframe && ticker) ? String(ticker).toUpperCase() : '',
      });
    }

    // 1) MainObject at origin — placeholder div (NOT a ticker chart).
    //    This slot is reserved for something to be defined later.
    function makeCenterPlaceholder() {
      const div = document.createElement('div');
      div.className   = 'center-placeholder';
      div.style.width  = IFRAME_WIDTH_PX  + 'px';
      div.style.height = IFRAME_HEIGHT_PX + 'px';
      div.textContent  = '— placeholder —';
      // No interactive content → pointer-events:none so it can't block
      // scroll/click events destined for ring billboards behind it.
      div.style.pointerEvents = 'none';
      return div;
    }
    // The center billboard is tracked by reference so ring-only operations
    // (redistribute / add / remove) can filter it out.
    // Apply the initial ring geometry — if the cached session had > 8
    // billboards the ring is already expanded on first paint. The shift
    // direction uses CAMERA_START_POS (camera isn't orbited yet).
    {
      const n = initialRingTickers.length;
      circleRadius = computeDesiredRadius(n);
      if (n > RING_EXPAND_THRESHOLD) {
        // Shift center away from camera START position in the XZ plane.
        const dx = -CAMERA_START_POS.x;   // origin → camera, negated = away
        const dz = -CAMERA_START_POS.z;
        const len = Math.sqrt(dx * dx + dz * dz);
        if (len > 1e-6) {
          const shift = circleRadius - BASE_RING_RADIUS;
          ringCenter.set(shift * dx / len, 0, shift * dz / len);
        }
      }
    }

    let centerBillboard = null;
    {
      const el = makeCenterPlaceholder();
      el.style.display = 'none';
      billboardsLayer.appendChild(el);
      centerBillboard = {
        element:     el,
        worldPos:    ringCenter.clone(),
        interactive: false,
        ticker:      '',
      };
      billboards.push(centerBillboard);
    }

    // 2) Ring chart iframes evenly spaced on a circle in the XZ plane.
    //    The list of tickers (and therefore the ring size) comes from
    //    initialRingTickers, which was resolved above from the URL query and
    //    the cached session. Every slot — filled or blank — is an interactive
    //    iframe so the top-bar ticker input can target any of them.
    {
      const n = initialRingTickers.length;
      for (let i = 0; i < n; i++) {
        const angle = (i / n) * Math.PI * 2;
        const pos = new THREE.Vector3(
          ringCenter.x + Math.cos(angle) * circleRadius,
          0,
          ringCenter.z + Math.sin(angle) * circleRadius
        );
        addBillboard(initialRingTickers[i] || '', pos);
      }
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  ORBIT CONTROLS
    // ══════════════════════════════════════════════════════════════════════════
    // Attach to the billboards layer (top layer) so it receives drags on
    // empty background space. Events inside an iframe are trapped by the
    // iframe's own browsing context and never reach OrbitControls — so
    // clicks on period buttons, search, scroll-zoom etc. all reach the chart.
    const controls = new OrbitControls(camera, billboardsLayer);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enablePan     = false;                 // stay focused on the ring
    // Wheel zoom is handled by our own inertia model below (not OrbitControls)
    // so each wheel tick kicks a velocity that decays over several frames,
    // giving the camera a coasting/gliding feel between detents. Wheel events
    // inside a chart iframe are trapped by the iframe's own document and never
    // bubble out, so the chart's time-range zoom is unaffected.
    controls.enableZoom    = false;
    controls.zoomSpeed     = 0.8;
    controls.minDistance   = getMinOrbitDistance();
    controls.maxDistance   = MAX_ORBIT_DISTANCE + (circleRadius - BASE_RING_RADIUS);
    controls.target.copy(ringCenter);
    controls.rotateSpeed   = 1.0;

    // Position the camera on the same side as the first ring billboard so
    // that billboard sits centered (vertically + horizontally) in the view.
    // Used at startup AND on reset-view; preserves orbit distance.
    function alignCameraToFirstBillboard() {
      const first = billboards.find(b => b !== centerBillboard);
      const D = Math.hypot(CAMERA_START_POS.x, CAMERA_START_POS.z);
      if (first) {
        const dx = first.worldPos.x - ringCenter.x;
        const dz = first.worldPos.z - ringCenter.z;
        const len = Math.hypot(dx, dz);
        if (len > 1e-6) {
          camera.position.set(
            ringCenter.x + (dx / len) * D,
            first.worldPos.y,
            ringCenter.z + (dz / len) * D
          );
          controls.target.copy(ringCenter);
          controls.update();
          return;
        }
      }
      camera.position.set(
        ringCenter.x + CAMERA_START_POS.x,
        CAMERA_START_POS.y,
        ringCenter.z + CAMERA_START_POS.z
      );
      controls.target.copy(ringCenter);
      controls.update();
    }
    alignCameraToFirstBillboard();

    // Dirty flag — skip expensive per-frame work when camera is idle.
    let _cameraDirty = true;
    controls.addEventListener('change', () => { _cameraDirty = true; });
    // Right-mouse-button drags the orbit; left button does nothing so clicks
    // inside chart iframes stay untouched (period buttons, search, etc.).
    controls.mouseButtons = {
      LEFT:   null,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT:  THREE.MOUSE.ROTATE,
    };
    controls.update();

    // Suppress the browser's native context menu on the 3D layer so the
    // right-click-drag doesn't pop a menu mid-orbit. The HUD is a sibling
    // above this layer so its controls are unaffected.
    billboardsLayer.addEventListener('contextmenu', (e) => e.preventDefault());
    webglRenderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

    // ══════════════════════════════════════════════════════════════════════════
    //  ZOOM INERTIA (custom wheel handler)
    //
    //  Pure impulse-and-decay: each wheel tick adds to a zoom VELOCITY, and
    //  every animation frame we apply the velocity to the camera radius and
    //  multiply the velocity by a friction factor. When friction brings the
    //  velocity near zero the camera naturally coasts to a stop.
    //
    //  Working in log-radius means the motion looks the same whether zooming
    //  in or out — a kick of +v shrinks r by the same visual fraction that a
    //  kick of −v grows it by.
    // ══════════════════════════════════════════════════════════════════════════
    let _zoomVel = 0;                           // velocity in log(r) / frame
    const ZOOM_KICK_PER_PIXEL = 0.00018;        // impulse added per wheel pixel
    const ZOOM_FRICTION       = 0.88;           // per-frame velocity retention
    const ZOOM_VEL_EPS        = 1e-5;           // below this, clamp to 0

    function _applyWheelKick(deltaY, deltaMode) {
      // Normalize deltaY across input devices.
      //   deltaMode 0 = pixels (most mice ≈ ±100 per notch)
      //   deltaMode 1 = lines  (older Firefox)
      //   deltaMode 2 = pages
      let dy = deltaY;
      if (deltaMode === 1) dy *= 16;
      if (deltaMode === 2) dy *= 400;
      // dy > 0 means wheel-down → zoom out → log(r) should grow.
      _zoomVel += dy * ZOOM_KICK_PER_PIXEL * controls.zoomSpeed;
    }

    billboardsLayer.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      _applyWheelKick(ev.deltaY, ev.deltaMode);
    }, { passive: false });

    // Wheel events that happen over a chart iframe don't bubble across
    // the frame boundary, so each iframe relays them back here via
    // postMessage ({type:'sv-wheel', deltaY, deltaMode}). Funnel those
    // through the same normalization path so zoom feel is identical
    // whether the cursor is over a billboard or the 3D background.
    window.addEventListener('message', (ev) => {
      const d = ev.data;
      if (!d || d.type !== 'sv-wheel' || typeof d.deltaY !== 'number') return;
      _applyWheelKick(d.deltaY, d.deltaMode | 0);
    });

    // Right-button drags forwarded from chart iframes as {sv-rmb-move, deltaX,
    // deltaY}. Mirror OrbitControls' damped-rotate exactly: accumulate the
    // delta into a pending (theta,phi) pair (in radians), then each frame
    // apply `dampingFactor` of the pending amount and decay what's left by
    // `(1 - dampingFactor)`. This matches OrbitControls' handleMouseMoveRotate
    // + update loop so iframe-forwarded drags feel identical to native ones,
    // including the gentle coast after release.
    //
    // The camera.up quaternion transform (see OrbitControls.update) is
    // essential — without it the offset is projected onto the wrong pole
    // and the camera can flip to the apex on the first delta.
    const _rmbOffset    = new THREE.Vector3();
    const _rmbSpherical = new THREE.Spherical();
    const _rmbQuat      = new THREE.Quaternion();
    const _rmbQuatInv   = new THREE.Quaternion();
    const _UP_Y         = new THREE.Vector3(0, 1, 0);
    const _PHI_EPS      = 0.000001;
    const _RMB_PEND_EPS = 1e-6;
    let   _rmbPendTheta = 0;
    let   _rmbPendPhi   = 0;
    window.addEventListener('message', (ev) => {
      const d = ev.data;
      if (!d || d.type !== 'sv-rmb-move') return;
      if (typeof d.deltaX !== 'number' || typeof d.deltaY !== 'number') return;
      const h = billboardsLayer.clientHeight;
      if (!h) return;
      _rmbPendTheta += 2 * Math.PI * d.deltaX * controls.rotateSpeed / h;
      _rmbPendPhi   += 2 * Math.PI * d.deltaY * controls.rotateSpeed / h;
    });

    function stepRmbOrbit() {
      if (Math.abs(_rmbPendTheta) < _RMB_PEND_EPS && Math.abs(_rmbPendPhi) < _RMB_PEND_EPS) {
        _rmbPendTheta = 0;
        _rmbPendPhi   = 0;
        return;
      }
      const df = controls.enableDamping ? controls.dampingFactor : 1;
      const applyTheta = _rmbPendTheta * df;
      const applyPhi   = _rmbPendPhi   * df;
      _rmbQuat.setFromUnitVectors(camera.up, _UP_Y);
      _rmbQuatInv.copy(_rmbQuat).invert();
      _rmbOffset.copy(camera.position).sub(controls.target);
      _rmbOffset.applyQuaternion(_rmbQuat);
      _rmbSpherical.setFromVector3(_rmbOffset);
      _rmbSpherical.theta -= applyTheta;
      _rmbSpherical.phi   -= applyPhi;
      _rmbSpherical.phi = Math.max(_PHI_EPS, Math.min(Math.PI - _PHI_EPS, _rmbSpherical.phi));
      _rmbSpherical.makeSafe();
      _rmbOffset.setFromSpherical(_rmbSpherical);
      _rmbOffset.applyQuaternion(_rmbQuatInv);
      camera.position.copy(controls.target).add(_rmbOffset);
      camera.lookAt(controls.target);
      _rmbPendTheta -= applyTheta;
      _rmbPendPhi   -= applyPhi;
      _cameraDirty = true;
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  HORIZONTAL ORBIT LOCK
    //
    //  When the camera is at ≥95% of the maximum zoom-IN (i.e. distance to
    //  target is within the bottom 5% of the [minDistance, maxDistance] range)
    //  we flatten the view so the closest billboard is seen edge-on. While in
    //  the lock zone:
    //    - vertical orbit input is blocked (both OrbitControls drag and the
    //      iframe-forwarded RMB-drag accumulator)
    //    - the polar angle phi is animated toward π/2 with a damping factor,
    //      so the camera glides into the horizontal plane instead of snapping
    //
    //  Below the threshold (zoomed out more than 5%) polar limits are restored
    //  and vertical orbit works normally.
    //
    //  Zoom % is measured as (maxDistance − dist) / (maxDistance − minDistance):
    //  100% at minDistance, 0% at maxDistance.
    // ══════════════════════════════════════════════════════════════════════════
    const HORIZONTAL_LOCK_ZOOM_PCT = 0.95;   // engage when zoom-in ≥ 95%
    const HORIZONTAL_LOCK_DAMP     = 0.10;
    const HORIZONTAL_LOCK_EPS      = 0.0005;
    let   _lockPhi = null;   // null when below threshold; phi-being-animated when locked

    function stepHorizontalLock() {
      const dist    = camera.position.distanceTo(controls.target);
      const minDist = getMinOrbitDistance();
      const maxDist = controls.maxDistance;
      const range   = maxDist - minDist;
      // Guard: if the orbit range collapsed (min ≈ max), skip — there's no
      // meaningful zoom percentage to compute.
      const zoomIn  = range > 1e-6 ? (maxDist - dist) / range : 0;

      if (zoomIn < HORIZONTAL_LOCK_ZOOM_PCT) {
        if (_lockPhi !== null) {
          _lockPhi = null;
          controls.minPolarAngle = 0;
          controls.maxPolarAngle = Math.PI;
        }
        return;
      }

      // First frame in the lock zone — seed _lockPhi from the camera's current
      // polar angle so the animation starts from where the camera is.
      if (_lockPhi === null) {
        const dy = camera.position.y - controls.target.y;
        _lockPhi = Math.acos(THREE.MathUtils.clamp(dy / dist, -1, 1));
      }

      // Damp toward horizontal (π/2). Snap when we're within EPS to avoid an
      // asymptotic chase that never quite resolves.
      const goal = Math.PI / 2;
      _lockPhi  += (goal - _lockPhi) * HORIZONTAL_LOCK_DAMP;
      if (Math.abs(_lockPhi - goal) < HORIZONTAL_LOCK_EPS) _lockPhi = goal;

      // Pinning min == max == _lockPhi makes OrbitControls' next update() clamp
      // the polar angle to exactly _lockPhi — both blocking new vertical drag
      // and animating the camera into the horizontal plane.
      controls.minPolarAngle = _lockPhi;
      controls.maxPolarAngle = _lockPhi;

      // Suppress iframe-forwarded vertical drag too — these come in via
      // sv-rmb-move and bypass OrbitControls entirely.
      _rmbPendPhi = 0;
      _cameraDirty = true;
    }

    // Apply the current zoom velocity to the camera once per frame, then decay.
    const _zoomDir = new THREE.Vector3();
    function stepZoomInertia() {
      if (_zoomVel === 0) return;
      _cameraDirty = true;
      _zoomDir.subVectors(camera.position, controls.target);
      const r = _zoomDir.length();
      if (r > 1e-6) {
        let newR = r * Math.exp(_zoomVel);
        const minDist = getMinOrbitDistance();
        if (newR < minDist) { newR = minDist; _zoomVel = 0; }
        if (newR > controls.maxDistance) { newR = controls.maxDistance; _zoomVel = 0; }
        _zoomDir.setLength(newR);
        camera.position.copy(controls.target).add(_zoomDir);
      }
      _zoomVel *= ZOOM_FRICTION;
      if (Math.abs(_zoomVel) < ZOOM_VEL_EPS) _zoomVel = 0;
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  PERIOD-SYNC HUB
    //
    //  Each chart iframe changes its own period when the user wheel-zooms or
    //  clicks a period button. The iframe then posts {type:'sv-period', period}
    //  to its parent (this window). We forward that message to every OTHER
    //  billboard iframe so they all stay in sync on the same time window.
    // ══════════════════════════════════════════════════════════════════════════
    window.addEventListener('message', (ev) => {
      const d = ev.data;
      if (!d || d.type !== 'sv-period' || typeof d.period !== 'string') return;
      // Batch-fetch for every other iframe (skip the originator — it already
      // loaded its own data in response to the user's wheel/click).
      if (typeof broadcastPeriodWithBatch === 'function') {
        broadcastPeriodWithBatch(d.period, /*excludeWindow=*/ev.source);
      }
      // Update the top-bar highlight so it reflects chart-initiated changes
      // (e.g. wheel-zoom inside a billboard that auto-switches period).
      if (typeof setGlobalPeriod === 'function') {
        setGlobalPeriod(d.period, /*fromBroadcast=*/true);
      }
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  PRICE INFO OVERLAY — shows ticker/price for the closest billboard
    //
    //  Each chart iframe posts {type:'sv-price-info'} after rendering.
    //  We store the info keyed by iframe contentWindow, then on each
    //  animation frame we display the closest billboard's data.
    // ══════════════════════════════════════════════════════════════════════════
    const _priceInfoMap = new WeakMap();   // contentWindow → info object
    const $overlayWrapper = document.getElementById('overlay-wrapper');
    const $priceOverlay = document.getElementById('price-overlay');

    // Measure overlay height once and lock --giraffe-size so the giraffe
    // button matches the overlay's natural height (chat must not be open).
    let _giraffeSized = false;
    function syncGiraffeSize() {
      if (_giraffeSized) return;
      if (document.body.classList.contains('chat-open')) return;
      const h = $priceOverlay.offsetHeight;
      if (h > 0) {
        document.documentElement.style.setProperty('--giraffe-size', h + 'px');
        _giraffeSized = true;
      }
    }

    const $poTicker     = $priceOverlay.querySelector('.po-ticker');
    const $poCompany    = $priceOverlay.querySelector('.po-company');
    const $poPrices     = $priceOverlay.querySelectorAll('.po-price');
    const $poChanges    = $priceOverlay.querySelectorAll('.po-change');
    const $poStatuses   = $priceOverlay.querySelectorAll('.po-status');

    // ── Ticker list (multi-row) state ──
    const $tickerList       = document.getElementById('ticker-list');
    const $tickerListScroll = document.getElementById('ticker-list-scroll');
    const _tickerRowMap     = new Map();   // billboard → {rowEl, sepEl, ticker, company, price, change}
    let _lastTickerListGen  = -1;
    let _lastClosestForList = null;
    let _clickOrbitTarget   = null;    // billboard to orbit toward after a row click

    window.addEventListener('message', (ev) => {
      const d = ev.data;
      if (!d || d.type !== 'sv-price-info') return;
      if (ev.source) {
        _priceInfoMap.set(ev.source, d);
        // Iframe is ready — re-send state it may have missed during load
        for (let i = 0; i < billboards.length; i++) {
          const bi = billboards[i];
          if (bi.interactive && bi.element.contentWindow === ev.source) {
            try { ev.source.postMessage({ type: 'sv-mode', light: isLightMode() }, '*'); } catch (_) {}
            if (bi._detail !== undefined) {
              try { ev.source.postMessage({ type: 'sv-detail', show: bi._detail }, '*'); } catch (_) {}
            }
            try { ev.source.postMessage({ type: 'sv-charttype', chartType: _chartType }, '*'); } catch (_) {}
            break;
          }
        }
        const b = _closestInteractive;
        if (b && b.element && b.element.contentWindow === ev.source) {
          updatePriceOverlay();
        }
      }
    });

    function updatePriceOverlay() {
      const b = _closestInteractive;
      let hasClosest = false;
      if (b && b.element && b.element.tagName === 'IFRAME') {
        let info;
        try { info = _priceInfoMap.get(b.element.contentWindow); } catch (_) {}
        if (info && info.ticker) {
          hasClosest = true;
          $poTicker.textContent  = info.ticker;
          $poCompany.textContent = info.company;
          const color = info.positive ? '#3fb950' : '#f85149';
          $poPrices.forEach(el  => { el.textContent = info.price;      el.style.color = color; });
          $poChanges.forEach(el => { el.textContent = info.change;     el.style.color = color; });
          $poStatuses.forEach(el => { el.textContent = info.statusText; el.className = 'po-status ' + info.status; });
          $overlayWrapper.classList.add('visible');
          syncGiraffeSize();
        }
      }
      // Keep the overlay visible as long as there's any interactive
      // billboard to point at — the giraffe button must stay reachable
      // even if the closest billboard's iframe hasn't posted sv-price-info
      // yet. Only hide when there are truly no interactive billboards.
      if (document.body.classList.contains('chat-open') || b) {
        $overlayWrapper.classList.add('visible');
      } else {
        $overlayWrapper.classList.remove('visible');
      }

      // ── Multi-row ticker list (when chat open) ──
      if (document.body.classList.contains('chat-open')) {
        const ring = getRingBillboards();
        const gen  = ring.length;
        if (gen !== _lastTickerListGen || b !== _lastClosestForList) {
          buildTickerListRows(ring, b);
          _lastTickerListGen  = gen;
          _lastClosestForList = b;
        }
        updateTickerListData();
        updateTickerDetail();
      }
    }

    /**
     * Rebuild ticker-list DOM rows: one per ring billboard, sorted by ring
     * angle with the closest billboard rotated to index 0.
     */
    function buildTickerListRows(ring, closest) {
      // Compute angle of each ring billboard relative to ringCenter
      const withAngle = ring.map((b, idx) => {
        const a = Math.atan2(
          b.worldPos.z - ringCenter.z,
          b.worldPos.x - ringCenter.x,
        );
        return { b, a, idx };
      });

      // Closest billboard's angle
      let closestAngle = 0;
      if (closest) {
        closestAngle = Math.atan2(
          closest.worldPos.z - ringCenter.z,
          closest.worldPos.x - ringCenter.x,
        );
      }

      // Sort by angular offset from closest (ascending, clockwise)
      const TWO_PI = Math.PI * 2;
      withAngle.sort((a, b) => {
        const da = ((a.a - closestAngle) % TWO_PI + TWO_PI) % TWO_PI;
        const db = ((b.a - closestAngle) % TWO_PI + TWO_PI) % TWO_PI;
        if (Math.abs(da - db) < 1e-9) return a.idx - b.idx;  // tiebreaker
        return da - db;
      });

      // Mark which billboards are still present
      const currentSet = new Set(ring);

      // Remove stale entries
      for (const [bb, entry] of _tickerRowMap) {
        if (!currentSet.has(bb)) {
          entry.rowEl.remove();
          entry.sepEl.remove();
          _tickerRowMap.delete(bb);
        }
      }

      // Ensure each billboard has a row; reorder via appendChild
      for (let i = 0; i < withAngle.length; i++) {
        const bb = withAngle[i].b;
        let entry = _tickerRowMap.get(bb);
        if (!entry) {
          const rowEl = document.createElement('div');
          rowEl.className = 'tl-row';
          const tTicker  = document.createElement('span'); tTicker.className  = 'tl-ticker';
          const tCompany = document.createElement('span'); tCompany.className = 'tl-company';
          const tPrice   = document.createElement('span'); tPrice.className   = 'tl-price';
          const tChange  = document.createElement('span'); tChange.className  = 'tl-change';
          const giraffeBtn = document.createElement('button');
          giraffeBtn.type = 'button';
          giraffeBtn.className = 'tl-giraffe-btn';
          giraffeBtn.title = 'Open this ticker';
          const giraffeImg = document.createElement('img');
          giraffeImg.src = '/utilities/renderer/logo.png';
          giraffeImg.alt = '';
          giraffeBtn.appendChild(giraffeImg);
          rowEl.append(tTicker, tCompany, tPrice, tChange, giraffeBtn);
          const sepEl = document.createElement('hr');
          sepEl.className = 'tl-sep';
          const clickedBb = bb;
          rowEl.addEventListener('click', () => {
            _clickOrbitTarget = clickedBb;
            _cameraDirty = true;
          });
          giraffeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            _clickOrbitTarget = clickedBb;
            _chatExpanded = true;
            document.body.classList.add('chat-expanded');
            setChatBtnState(1);
            _lastTickerListGen = -1;
            _cameraDirty = true;
          });
          entry = { rowEl, sepEl, ticker: tTicker, company: tCompany, price: tPrice, change: tChange, giraffe: giraffeBtn, _lastTicker: '', _lastPrice: '', _lastChange: '' };
          _tickerRowMap.set(bb, entry);
        }
        // appendChild moves existing nodes — achieves reorder
        $tickerListScroll.appendChild(entry.rowEl);
        // separator after every row except the last
        if (i < withAngle.length - 1) {
          $tickerListScroll.appendChild(entry.sepEl);
        } else {
          entry.sepEl.remove();  // remove trailing separator
        }
        // Mark closest
        entry.rowEl.classList.toggle('closest', i === 0);
      }

      // Rows are always rendered at their natural fixed size — no font
      // scaling based on row count. Scroll-on-overflow handles the rest.
      const n = ring.length;
      $tickerList.style.setProperty('--ticker-row-scale', 1);

      // Measure helper
      const measureRows = (count) => {
        const rs = $tickerListScroll.querySelectorAll('.tl-row');
        const ss = $tickerListScroll.querySelectorAll('.tl-sep');
        let h = 0;
        for (let i = 0; i < count && i < rs.length; i++) h += rs[i].offsetHeight;
        for (let i = 0; i < count - 1 && i < ss.length; i++) h += ss[i].offsetHeight;
        return h;
      };

      document.body.classList.toggle('chat-expanded', _chatExpanded);

      if (_chatExpanded) {
        // State 2: only the closest row is visible, no sizing needed.
        $tickerListScroll.style.maxHeight = '';
        $tickerListScroll.style.minHeight = '';
        $tickerListScroll.classList.remove('scrollable');
      } else {
        // State 1 (adaptive): compute how much vertical space is available
        // in the chat container for the ticker list, then show as many rows
        // as fit and scroll the rest.
        const bottomRowEl   = document.getElementById('chat-bottom-row');
        const bottomRowH    = bottomRowEl ? bottomRowEl.offsetHeight : 0;
        const overlayChrome = 32 /* top + bottom 16px viewport margins */ + 16 /* paddings/gaps */;
        const maxAvail      = Math.max(60, window.innerHeight - overlayChrome - bottomRowH);
        const naturalH      = measureRows(n);

        if (naturalH > maxAvail) {
          // Rows overflow the available space → enable scrolling.
          $tickerListScroll.style.maxHeight = maxAvail + 'px';
          $tickerListScroll.style.minHeight = maxAvail + 'px';
          $tickerListScroll.classList.add('scrollable');
        } else {
          // Everything fits: use natural height, pad to 3 rows when fewer.
          $tickerListScroll.style.maxHeight = '';
          $tickerListScroll.style.minHeight = (n < 3) ? measureRows(3) + 'px' : '';
          $tickerListScroll.classList.remove('scrollable');
        }
      }
    }

    /**
     * Update text content of every ticker-list row from _priceInfoMap.
     * Uses dirty checks to minimise DOM writes on the hot path.
     */
    function updateTickerListData() {
      for (const [bb, entry] of _tickerRowMap) {
        let info;
        try { info = _priceInfoMap.get(bb.element.contentWindow); } catch (_) {}
        const ticker  = info ? info.ticker  : (bb.ticker || '');
        const company = info ? info.company : '';
        const price   = info ? info.price   : '...';
        const change  = info ? info.change  : '';
        const color   = info ? (info.positive ? '#3fb950' : '#f85149') : 'var(--text)';

        if (entry._lastTicker !== ticker) {
          entry.ticker.textContent = ticker;
          entry._lastTicker = ticker;
        }
        if (entry._lastCompany !== company) {
          entry.company.textContent = company;
          entry._lastCompany = company;
        }
        if (entry._lastPrice !== price) {
          entry.price.textContent = price;
          entry._lastPrice = price;
        }
        if (entry._lastChange !== change) {
          entry.change.textContent = change;
          entry._lastChange = change;
        }
        entry.price.style.color  = color;
        entry.change.style.color = color;
      }
    }

    /**
     * Populate the #chat-body detail panel (state 2 only) with data for the
     * currently-closest billboard. The closest row is also the only ticker
     * row visible at the top in state 2, so detail content tracks it.
     * Cheap dirty-check: only rewrites DOM when the ticker identity changes.
     */
    let _detailLastTicker = null;
    function updateTickerDetail() {
      const expanded = document.body.classList.contains('chat-expanded');
      if (!expanded) {
        _detailLastTicker = null;
        return;
      }
      const b = _closestInteractive;
      let info;
      try { if (b && b.element) info = _priceInfoMap.get(b.element.contentWindow); } catch (_) {}
      const ticker  = info ? info.ticker  : (b && b.ticker) || '';
      const company = info ? info.company : '';
      if (_detailLastTicker === ticker) return;
      _detailLastTicker = ticker;
      $chatBody.replaceChildren();
      if (!ticker) return;
      const h = document.createElement('div');
      h.className = 'cb-ticker';
      h.textContent = ticker;
      const c = document.createElement('div');
      c.className = 'cb-company';
      c.textContent = company;
      const p = document.createElement('div');
      p.className = 'cb-placeholder';
      p.textContent = 'Ticker-specific data & chat will appear here.';
      $chatBody.append(h, c, p);
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  HAMBURGER MENU toggle (top-left)
    //
    //  Clicking the bars icon slides the panel in from the left and swaps the
    //  icon to a white X. Clicking again closes. CSS handles the icon swap and
    //  the slide animation via the body.menu-open class.
    // ══════════════════════════════════════════════════════════════════════════
    const $menuToggle = document.getElementById('menu-toggle');
    $menuToggle.addEventListener('click', () => {
      document.body.classList.toggle('menu-open');
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  DISPLAY GROUP TOGGLE — collapses Theme + Camera sections
    // ══════════════════════════════════════════════════════════════════════════
    const $displayToggle = document.getElementById('display-toggle');
    const $displayGroup  = document.getElementById('display-group');
    function applyDisplayOpen(open) {
      $displayGroup.classList.toggle('collapsed', !open);
      $displayToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    // Always start collapsed on page load; clear any stale persisted state
    // from earlier builds so the default is enforced.
    try { localStorage.removeItem('sv.displayOpen'); } catch (_) {}
    applyDisplayOpen(false);
    $displayToggle.addEventListener('click', () => {
      const open = $displayGroup.classList.contains('collapsed');  // currently collapsed → opening
      applyDisplayOpen(open);
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  LIGHT / DARK TOGGLE
    // ══════════════════════════════════════════════════════════════════════════
    const $themeToggle = document.getElementById('theme-toggle');

    function updateThemeToggleLabel() {
      $themeToggle.textContent = isLightMode() ? 'Light' : 'Dark';
    }
    updateThemeToggleLabel();

    $themeToggle.addEventListener('click', () => {
      // Toggle: if currently light → force dark, if currently dark → force light.
      _modeOverride = isLightMode() ? 'dark' : 'light';
      lsSet(LS_MODE_KEY, _modeOverride);
      applyModeOverride();
      syncSceneBackground();
      updateThemeToggleLabel();
    });

    // If OS theme changes and no override is active, update button label.
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
      if (!_modeOverride) updateThemeToggleLabel();
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  CHART TYPE TOGGLE  (Candle → Line → Area → Candle …)
    // ══════════════════════════════════════════════════════════════════════════
    const CHART_TYPES = ['candle', 'line', 'area'];
    const CHART_TYPE_LABELS = { candle: 'Candle', line: 'Line', area: 'Area' };
    const LS_CHART_TYPE_KEY = 'sv.chartType';
    let _chartType = (function() {
      try { const v = localStorage.getItem(LS_CHART_TYPE_KEY); return CHART_TYPES.includes(v) ? v : 'candle'; }
      catch(_) { return 'candle'; }
    })();

    const $chartTypeToggle = document.getElementById('charttype-toggle');

    function broadcastChartType() {
      if (typeof billboards === 'undefined') return;
      for (const b of billboards) {
        if (!b || !b.interactive) continue;
        const el = b.element;
        if (!el || el.tagName !== 'IFRAME') continue;
        try { el.contentWindow.postMessage({ type: 'sv-charttype', chartType: _chartType }, '*'); }
        catch (_) {}
      }
    }

    function updateChartTypeLabel() {
      $chartTypeToggle.textContent = CHART_TYPE_LABELS[_chartType];
    }
    updateChartTypeLabel();

    $chartTypeToggle.addEventListener('click', () => {
      const idx = CHART_TYPES.indexOf(_chartType);
      _chartType = CHART_TYPES[(idx + 1) % CHART_TYPES.length];
      lsSet(LS_CHART_TYPE_KEY, _chartType);
      updateChartTypeLabel();
      broadcastChartType();
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  USER PREFERENCES — slider + reset-view wiring
    //
    //  The key definitions, default values, and lsSet/lsGet helpers live
    //  near the top of the script so the session-restore logic can reach them.
    //  Here we only wire the DOM elements to those helpers. Slider values
    //  are INTENTIONALLY not touched by the "Reset view" button, which is
    //  scoped to camera position/target only.
    // ══════════════════════════════════════════════════════════════════════════

    // Orbit-speed slider (lives inside the menu panel).
    const $speed    = document.getElementById('orbit-speed');
    const $speedVal = document.getElementById('orbit-speed-val');
    let _userRotateSpeed = 1.0;           // user's chosen base speed (for snap magnet)
    function applyOrbitSpeed(v, persist) {
      _userRotateSpeed        = v;
      controls.rotateSpeed    = v;
      $speed.value            = String(v);
      $speedVal.textContent   = v.toFixed(2);
      if (persist) lsSet(LS_ORBIT_SPEED_KEY, v);
    }
    $speed.addEventListener('input', () => {
      applyOrbitSpeed(parseFloat($speed.value), /*persist=*/true);
    });

    // Scroll-gain slider — controls OrbitControls.zoomSpeed, i.e. how many
    // world units the camera dollies per wheel tick.
    const $scroll    = document.getElementById('scroll-gain');
    const $scrollVal = document.getElementById('scroll-gain-val');
    function applyScrollGain(v, persist) {
      controls.zoomSpeed    = v;
      $scroll.value         = String(v);
      $scrollVal.textContent = v.toFixed(2);
      if (persist) lsSet(LS_SCROLL_GAIN_KEY, v);
    }
    $scroll.addEventListener('input', () => {
      applyScrollGain(parseFloat($scroll.value), /*persist=*/true);
    });


    // Restore saved preferences (or defaults) before the first render.
    // persist=false because we're replaying the stored value, not overwriting it.
    applyOrbitSpeed(lsGetNumber(LS_ORBIT_SPEED_KEY, DEFAULT_ORBIT_SPEED, 0.1, 3), false);
    applyScrollGain(lsGetNumber(LS_SCROLL_GAIN_KEY, DEFAULT_SCROLL_GAIN, 0.1, 3), false);

    // ══════════════════════════════════════════════════════════════════════════
    //  RESET VIEW
    //
    //  Restores the original camera position and orbit target. Billboards
    //  themselves sit at fixed world positions (a ring around the origin),
    //  so snapping the camera back to CAMERA_START_POS also snaps every
    //  billboard back to its initial screen position/size.
    //
    //  NOTE: the orbit-speed and scroll-gain sliders are NOT touched here —
    //  they are user preferences persisted across sessions in localStorage
    //  and must survive a view reset.
    // ══════════════════════════════════════════════════════════════════════════
    const $resetView = document.getElementById('reset-view');
    $resetView.addEventListener('click', () => {
      alignCameraToFirstBillboard();
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  CHAT DIALOG — giraffe opens; single button cycles expand → reduce → close
    // ══════════════════════════════════════════════════════════════════════════
    const $chatStateBtn = document.getElementById('chat-state-btn');
    const $chatBody     = document.getElementById('chat-body');
    let _chatExpanded   = false;
    // State 0 = closed, 1 = half-open, 2 = fully-open.
    // In states 1 and 2 the corner button always shows "×" and closes to 0.
    // State 1 → 2 transition is triggered exclusively by the per-row giraffe
    // button in the ticker list; there is no "+" expand affordance any more.
    let _chatBtnState = 0;

    function setChatBtnState(s) {
      _chatBtnState = s;
      $chatStateBtn.textContent = '×';
      $chatStateBtn.setAttribute('aria-label', 'Close chat');
    }

    document.getElementById('ticker-go').addEventListener('click', () => {
      document.body.classList.toggle('chat-open');
      _chatExpanded = false;
      document.body.classList.remove('chat-expanded');
      setChatBtnState(1);
      _lastTickerListGen = -1;
      _cameraDirty = true;
    });
    function closeChatContainer() {
      document.body.classList.remove('chat-open');
      document.body.classList.remove('chat-expanded');
      _chatExpanded = false;
      setChatBtnState(0);
      $chatBody.replaceChildren();
