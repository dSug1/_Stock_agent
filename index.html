<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Visualizer — 3D Scene</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      /* Kill text-selection and mobile tap-highlight flashes when clicking
         on the billboards background layer. The HUD slider still works
         because <input> elements opt back in via the #hud rule below. */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Remove focus rings on non-input elements (the layers and their
       wrapper divs would otherwise flash a browser outline on click). */
    #webgl-layer, #billboards-layer, #billboards-layer > * { outline: none; }
    #hud, #hud * { user-select: auto; -webkit-user-select: auto; }

    /* Stacked renderer layers.
       - WebGL canvas sits behind with pointer-events: none so it doesn't
         intercept clicks destined for the iframe billboards or OrbitControls.
       - Billboards layer sits on top with pointer-events: auto so its DOM
         children (the iframes) can receive events, and OrbitControls
         (attached to this container) receives drags on empty background. */
    #webgl-layer, #billboards-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #webgl-layer     { pointer-events: none; z-index: 1; }
    #billboards-layer { pointer-events: auto; z-index: 2; }

    /* Each billboard element is absolutely positioned; its left/top/transform
       are rewritten every frame by the projector in JS. We intentionally AVOID
       any 3D transform here — plain 2D translate + scale — so each iframe's
       hit-box is exactly its visible rectangle on screen. That's the whole
       point of the manual-projection approach: Chrome's CSS3D iframe hit-test
       uses a 2D AABB of the transformed quad which leaks far beyond the
       visible area, breaking pointer events on other billboards. */
    #billboards-layer > * {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 50% 50%;
      will-change: transform, left, top;
    }

    /* Floating HUD with the orbit-speed slider */
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      user-select: none;
    }
    #hud label {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    #hud input[type=range] {
      width: 140px;
      accent-color: #58a6ff;
    }
    #hud .val {
      display: inline-block;
      min-width: 34px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #8b949e;
    }
    #hud .title {
      color: #8b949e;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    /* Blank-slot placeholder shown when there aren't enough tickers.
       Sized dynamically by JS to match IFRAME_WIDTH_PX / IFRAME_HEIGHT_PX.
       Non-interactive on purpose — scroll/click over it should reach
       OrbitControls on the billboards layer behind, just like empty bg. */
    .blank-slot {
      background: #000;
      border: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #30363d;
      font-family: 'Courier New', monospace;
      font-size: 24px;
      letter-spacing: 0.15em;
      pointer-events: none;
    }

    /* The iframes themselves: dark backdrop, thin border matching the chart theme. */
    .chart-frame {
      border: 1px solid #30363d;
      background: #0d1117;
      display: block;
    }

    /* Central-object placeholder — stands in for something to be defined later.
       Same pixel dimensions as the billboards so the ring geometry stays
       balanced. Pointer-events stay on so wheel-to-zoom still works here. */
    .center-placeholder {
      border: 1px dashed #30363d;
      background: rgba(13, 17, 23, 0.55);
      color: #6e7681;
      font-family: 'Courier New', monospace;
      font-size: 22px;
      letter-spacing: 0.18em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>

  <!-- Three.js ES modules pinned to 0.160.0.
       The importmap lets the module script below use bare specifiers
       like `three` and `three/addons/...`. -->
  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="hud">
    <div class="title">Camera</div>
    <label>
      Orbit speed
      <input id="orbit-speed" type="range" min="0.1" max="3" step="0.05" value="1">
      <span id="orbit-speed-val" class="val">1.00</span>
    </label>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    // NOTE: we deliberately do NOT use CSS3DRenderer here. Chrome hit-tests
    // CSS3D-transformed iframes by the 2D AABB of their transformed quad,
    // which leaks far beyond the visible area once the camera gets close to
    // a billboard — so clicks/wheels on other billboards fall through to the
    // wrong target. Instead we project each billboard's 3D world position to
    // 2D screen coordinates manually and use a plain translate+scale, which
    // gives each iframe a pixel-accurate hit-box.

    // ══════════════════════════════════════════════════════════════════════════
    //  CONFIGURATION
    // ══════════════════════════════════════════════════════════════════════════

    // Tickers and time window are provided by run.bat (→ 2_stock_visualizer.py)
    // via URL query params: ?tickers=AAPL,MSFT,GOOGL&period=1mo
    // The Python launcher prompts the user interactively, resolves ticker
    // symbols, pre-fetches data, then opens the browser at this URL.
    const _params     = new URLSearchParams(location.search);
    const TICKERS     = (_params.get('tickers') || '')
                          .split(',')
                          .map(s => s.trim())
                          .filter(Boolean);
    const TIMEWINDOW  = _params.get('period') || '1mo';

    const CIRCLE_COUNT      = 6;        // objects around the MainObject
    const CIRCLE_RADIUS     = 7;        // world units — ring radius around the center
    const IFRAME_WIDTH_PX   = 800;      // iframe pixel width
    const IFRAME_HEIGHT_PX  = 500;      // iframe pixel height
    // Billboard world size = IFRAME_*_PX × BILLBOARD_SCALE.
    // At 0.004 that's 3.2 × 2.0 world units — fits inside a radius-7 ring
    // (adjacent centers are 7 units apart → 3.8 units gap between billboards)
    // while still staying readable when viewed from ~14 units away.
    const BILLBOARD_SCALE   = 0.004;
    const CHART_URL         = "_outputs/templates/1_chart_template.html";

    // Camera placed far enough back that the full ring + center fit on
    // screen with empty background space around them — required for
    // OrbitControls drag-to-rotate to receive pointerdowns (iframes
    // capture their own).
    const MIN_ORBIT_DISTANCE = 8;
    const MAX_ORBIT_DISTANCE = 40;
    const CAMERA_START_POS   = new THREE.Vector3(0, 5, 16);

    // ══════════════════════════════════════════════════════════════════════════
    //  SCENE / CAMERA / RENDERERS
    // ══════════════════════════════════════════════════════════════════════════

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.copy(CAMERA_START_POS);
    camera.lookAt(0, 0, 0);

    // WebGL renderer — draws background plane, grid, lights, any 3D helpers.
    const webglRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    webglRenderer.setPixelRatio(window.devicePixelRatio);
    webglRenderer.setSize(window.innerWidth, window.innerHeight);
    webglRenderer.setClearColor(0x000000, 0);
    webglRenderer.domElement.id = 'webgl-layer';
    document.body.appendChild(webglRenderer.domElement);

    // Billboards layer — a plain <div> that holds every iframe/placeholder
    // as an absolutely-positioned child. Each frame we compute the child's
    // screen position/scale from its world position + the camera, and write
    // it into left/top/transform/zIndex. OrbitControls is attached here so
    // drags and wheels on empty background reach the camera controller.
    const billboardsLayer = document.createElement('div');
    billboardsLayer.id = 'billboards-layer';
    document.body.appendChild(billboardsLayer);

    // ══════════════════════════════════════════════════════════════════════════
    //  LIGHTS (kept for any future 3D content — CSS3DObjects ignore lighting,
    //  and the background plane uses MeshBasicMaterial so it's self-lit.)
    // ══════════════════════════════════════════════════════════════════════════
    const ambient = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight.position.set(6, 10, 6);
    dirLight.target.position.set(0, 0, 0);
    scene.add(dirLight);
    scene.add(dirLight.target);

    // ══════════════════════════════════════════════════════════════════════════
    //  BACKGROUND IMAGE (blue gradient, parented to the camera)
    //
    //  Parenting to the camera means it always orbits with the camera and the
    //  camera always faces it — it behaves like a skybox card. We use
    //  MeshBasicMaterial so lighting doesn't affect it, and push it far out
    //  (large plane at local z = -120) so nothing in the scene ever clips it.
    //  depthWrite:false + renderOrder:-999 keep it behind everything else.
    // ══════════════════════════════════════════════════════════════════════════
    function makeGradientTexture() {
      const c = document.createElement('canvas');
      c.width  = 16;
      c.height = 512;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 0, c.height);
      g.addColorStop(0.00, '#0b2346');  // top — deep navy
      g.addColorStop(0.45, '#153a6e');  // upper mid — brighter blue
      g.addColorStop(0.75, '#0a1b36');  // lower mid — darker
      g.addColorStop(1.00, '#04080f');  // bottom — near black
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, c.width, c.height);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const bgPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(400, 240),
      new THREE.MeshBasicMaterial({
        map:        makeGradientTexture(),
        depthWrite: false,
        depthTest:  false,
        toneMapped: false,
      })
    );
    bgPlane.position.set(0, 0, -120);   // local to the camera → in front of it
    bgPlane.renderOrder = -999;
    camera.add(bgPlane);
    scene.add(camera);                  // required for the camera child to render

    // ══════════════════════════════════════════════════════════════════════════
    //  BILLBOARDS (manually projected from 3D world → 2D screen every frame)
    //
    //  Each entry is: { element, worldPos: Vector3, interactive: bool }
    //    element      — DOM node (iframe or div) absolutely positioned in the
    //                   billboards layer
    //    worldPos     — fixed 3D position (center of ring / ring slots)
    //    interactive  — true for chart iframes, false for placeholders
    // ══════════════════════════════════════════════════════════════════════════
    const billboards = [];

    function makeChartElement(ticker) {
      if (!ticker) {
        // Not enough tickers to fill this slot → black blank placeholder.
        const div = document.createElement('div');
        div.className      = 'blank-slot';
        div.style.width    = IFRAME_WIDTH_PX  + 'px';
        div.style.height   = IFRAME_HEIGHT_PX + 'px';
        div.textContent    = '— empty slot —';
        return div;
      }
      const iframe = document.createElement('iframe');
      iframe.className = 'chart-frame';
      iframe.src = `${CHART_URL}`
                 + `?ticker=${encodeURIComponent(ticker)}`
                 + `&period=${encodeURIComponent(TIMEWINDOW)}`;
      iframe.style.width  = IFRAME_WIDTH_PX  + 'px';
      iframe.style.height = IFRAME_HEIGHT_PX + 'px';
      iframe.setAttribute('allow', 'fullscreen');
      iframe.setAttribute('loading', 'eager');
      return iframe;
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  FOCUS SANITIZER
    //
    //  Even with the 2D projection fix, Chrome still holds keyboard focus on
    //  whichever iframe was last clicked. That by itself is fine, but it can
    //  leave a subtly-stale wheel-event target in some edge cases. Releasing
    //  focus on pointerleave makes scroll routing deterministic — the next
    //  wheel event always hit-tests fresh against the element under cursor.
    //
    //  We preserve focus when an <input>/<textarea> inside the iframe has it
    //  so the user can keep typing in the search box while moving the cursor.
    // ══════════════════════════════════════════════════════════════════════════
    function attachFocusSanitizer(iframe) {
      iframe.addEventListener('pointerleave', () => {
        if (document.activeElement !== iframe) return;
        try {
          const inner = iframe.contentDocument && iframe.contentDocument.activeElement;
          if (inner && (inner.tagName === 'INPUT' || inner.tagName === 'TEXTAREA')) return;
        } catch (_) { /* cross-origin safety — same origin in practice */ }
        iframe.blur();
      });
    }

    function addBillboard(ticker, worldPos) {
      const el = makeChartElement(ticker);
      const isIframe = el.tagName === 'IFRAME';
      if (isIframe) attachFocusSanitizer(el);
      // Hide until the first projection frame so nothing flashes at (0,0).
      el.style.display = 'none';
      billboardsLayer.appendChild(el);
      billboards.push({
        element:     el,
        worldPos:    worldPos.clone(),
        interactive: isIframe,
      });
    }

    // 1) MainObject at origin — placeholder div (NOT a ticker chart).
    //    This slot is reserved for something to be defined later.
    function makeCenterPlaceholder() {
      const div = document.createElement('div');
      div.className   = 'center-placeholder';
      div.style.width  = IFRAME_WIDTH_PX  + 'px';
      div.style.height = IFRAME_HEIGHT_PX + 'px';
      div.textContent  = '— placeholder —';
      // No interactive content → pointer-events:none so it can't block
      // scroll/click events destined for ring billboards behind it.
      div.style.pointerEvents = 'none';
      return div;
    }
    {
      const el = makeCenterPlaceholder();
      el.style.display = 'none';
      billboardsLayer.appendChild(el);
      billboards.push({
        element:     el,
        worldPos:    new THREE.Vector3(0, 0, 0),
        interactive: false,
      });
    }

    // 2) CIRCLE_COUNT chart iframes evenly spaced on a circle in the XZ plane.
    //    Up to 6 tickers from the URL (?tickers=...) fill the ring in order;
    //    missing slots get the black blank placeholder.
    for (let i = 0; i < CIRCLE_COUNT; i++) {
      const angle = (i / CIRCLE_COUNT) * Math.PI * 2;
      const pos = new THREE.Vector3(
        Math.cos(angle) * CIRCLE_RADIUS,
        0,
        Math.sin(angle) * CIRCLE_RADIUS
      );
      const ticker = TICKERS[i] || '';
      addBillboard(ticker, pos);
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  ORBIT CONTROLS
    // ══════════════════════════════════════════════════════════════════════════
    // Attach to the billboards layer (top layer) so it receives drags on
    // empty background space. Events inside an iframe are trapped by the
    // iframe's own browsing context and never reach OrbitControls — so
    // clicks on period buttons, search, scroll-zoom etc. all reach the chart.
    const controls = new OrbitControls(camera, billboardsLayer);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enablePan     = false;                 // stay focused on the ring
    // Wheel events on the background reach OrbitControls and dolly the camera.
    // Wheel events inside a chart iframe are trapped by the iframe's own
    // document and never bubble out — so scrolling on a billboard zooms the
    // chart's time range (which then broadcasts a period change, below),
    // while scrolling on empty background moves the camera.
    controls.enableZoom    = true;
    controls.zoomSpeed     = 0.8;
    controls.minDistance   = MIN_ORBIT_DISTANCE;
    controls.maxDistance   = MAX_ORBIT_DISTANCE;
    controls.target.set(0, 0, 0);
    controls.rotateSpeed   = 1.0;
    // Right-mouse-button drags the orbit; left button does nothing so clicks
    // inside chart iframes stay untouched (period buttons, search, etc.).
    controls.mouseButtons = {
      LEFT:   null,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT:  THREE.MOUSE.ROTATE,
    };
    controls.update();

    // Suppress the browser's native context menu on the 3D layer so the
    // right-click-drag doesn't pop a menu mid-orbit. The HUD is a sibling
    // above this layer so its controls are unaffected.
    billboardsLayer.addEventListener('contextmenu', (e) => e.preventDefault());
    webglRenderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

    // ══════════════════════════════════════════════════════════════════════════
    //  PERIOD-SYNC HUB
    //
    //  Each chart iframe changes its own period when the user wheel-zooms or
    //  clicks a period button. The iframe then posts {type:'sv-period', period}
    //  to its parent (this window). We forward that message to every OTHER
    //  billboard iframe so they all stay in sync on the same time window.
    // ══════════════════════════════════════════════════════════════════════════
    window.addEventListener('message', (ev) => {
      const d = ev.data;
      if (!d || d.type !== 'sv-period' || typeof d.period !== 'string') return;
      for (const b of billboards) {
        if (!b.interactive) continue;                    // skip placeholders
        const el = b.element;
        if (el.contentWindow === ev.source) continue;    // skip originator
        try {
          el.contentWindow.postMessage({ type: 'sv-period', period: d.period }, '*');
        } catch (_) { /* cross-origin safety net — same-origin in practice */ }
      }
    });

    // Orbit-speed slider
    const $speed    = document.getElementById('orbit-speed');
    const $speedVal = document.getElementById('orbit-speed-val');
    $speed.addEventListener('input', () => {
      const v = parseFloat($speed.value);
      controls.rotateSpeed = v;
      $speedVal.textContent = v.toFixed(2);
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  BILLBOARD PROJECTOR
    //
    //  For each billboard:
    //    1. Project its fixed world position into normalized device coords
    //       via camera.projectionMatrix × camera.matrixWorldInverse.
    //    2. If it's behind the camera or outside the near/far clip, hide it.
    //    3. Convert NDC to screen pixels and write to element.style.left/top.
    //    4. Compute the perspective-correct scale so a 1-world-unit object
    //       appears at its proper on-screen size, then apply as a plain 2D
    //       translate(-50%,-50%) + scale(s) transform.
    //    5. Assign zIndex by distance so closer billboards paint on top.
    //
    //  Because the final transform is 2D only, each iframe's hit-box equals
    //  its visible rectangle — no CSS3D AABB leakage, no pointer-event
    //  crosstalk between billboards regardless of camera angle.
    // ══════════════════════════════════════════════════════════════════════════
    const _ndc = new THREE.Vector3();
    function updateBillboardProjection() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      // World pixels per world unit, one unit from the camera, at this FOV.
      // Derivation: at distance d, a world-size s projects to s*(h/(2*d*tan(fov/2)))
      // on screen. Our iframe has a native pixel width IFRAME_WIDTH_PX and a
      // desired world width IFRAME_WIDTH_PX*BILLBOARD_SCALE, so its CSS
      // scale factor at distance d is BILLBOARD_SCALE * h / (2*d*tan(fov/2)).
      const fovRad        = camera.fov * Math.PI / 180;
      const halfFovTan    = Math.tan(fovRad * 0.5);
      const scaleNumerator = BILLBOARD_SCALE * h / (2 * halfFovTan);

      // Track sort order for zIndex. Farthest gets lowest zIndex.
      const ordered = billboards
        .map((b, i) => ({ b, i, d: b.worldPos.distanceTo(camera.position) }))
        .sort((a, b) => b.d - a.d);

      for (let rank = 0; rank < ordered.length; rank++) {
        const { b, d } = ordered[rank];
        const el = b.element;

        // Project world position → NDC
        _ndc.copy(b.worldPos).project(camera);
        // project() returns (x,y in [-1,1], z in [-1,1] when in front; >1 means
        // behind camera or past the far plane)
        const inFront = _ndc.z > -1 && _ndc.z < 1;
        if (!inFront) {
          if (el.style.display !== 'none') el.style.display = 'none';
          continue;
        }
        if (el.style.display === 'none') el.style.display = '';

        const sx = ( _ndc.x * 0.5 + 0.5) * w;
        const sy = (-_ndc.y * 0.5 + 0.5) * h;
        const scale = scaleNumerator / d;

        el.style.left      = sx + 'px';
        el.style.top       = sy + 'px';
        el.style.transform = `translate(-50%, -50%) scale(${scale})`;
        el.style.zIndex    = String(rank + 1);
      }
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  ANIMATION LOOP
    // ══════════════════════════════════════════════════════════════════════════
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      camera.updateMatrixWorld();

      webglRenderer.render(scene, camera);
      updateBillboardProjection();
    }
    animate();

    // ══════════════════════════════════════════════════════════════════════════
    //  RESIZE
    // ══════════════════════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      webglRenderer.setSize(w, h);
      // billboardsLayer is CSS-sized (100%/100%), so no resize call needed;
      // updateBillboardProjection() will re-project on the next frame.
    });
  </script>
</body>
</html>
